<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#f5f7fb"><title>Page not found — Laxman Nepal</title><link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="/assets/css/light.css"></head><body><main class="section-wrap section" style="min-height:80vh;display:grid;place-items:center;text-align:center"><div><p class="eyebrow">404 · Not found</p><h1 style="font-size:clamp(56px,10vw,120px);margin:0">Lost page.</h1><p class="hero-text" style="margin-left:auto;margin-right:auto">The page you requested does not exist or has moved.</p><a class="button button-primary" href="/">Back home ↗</a></div></main><script>
(function(){
  var path=window.location.pathname;
  if(!/^\/nepse(?:\/.*)?$/.test(path)) return;
  var suffix=path.replace(/^\/nepse\/?/,"");
  var frame=document.createElement("iframe");
  frame.title="NEPSE Terminal";
  frame.src="https://laxmannepal.github.io/nepse/"+suffix+window.location.search+window.location.hash;
  frame.setAttribute("allow","clipboard-read; clipboard-write");
  frame.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f8fc";
  document.documentElement.style.cssText="margin:0;width:100%;height:100%;overflow:hidden";
  document.body.replaceChildren(frame);
  document.body.style.cssText="margin:0;width:100%;height:100%;overflow:hidden";
})();
</script></body></html>

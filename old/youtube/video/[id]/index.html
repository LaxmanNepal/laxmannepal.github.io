<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Video | Laxman Nepal</title><meta name="description" content="Watch a YouTube video from Laxman Nepal and explore its statistics and related content."><link rel="canonical" href="https://apps.laxmannepal.com.np/youtube/video/"><meta property="og:type" content="video.other"><meta property="og:site_name" content="Laxman Nepal"><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8fb;color:#111827}.wrap{max-width:1100px;margin:auto;padding:24px}.glass{background:rgba(255,255,255,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.8);box-shadow:0 20px 60px #0f172a12;border-radius:28px}.player{overflow:hidden;aspect-ratio:16/9;background:#000}.player iframe{width:100%;height:100%;border:0}.card{padding:22px;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px}.stat b{display:block;font-size:25px}.muted{color:#64748b}.back{display:inline-block;margin-bottom:18px;color:#2563eb;text-decoration:none}@media(max-width:650px){.wrap{padding:14px}.stats{grid-template-columns:1fr}.glass{border-radius:20px}}</style></head><body><main class="wrap"><a class="back" href="/youtube/">← Back to YouTube</a><div id="app"><div class="glass card">Loading video…</div></div></main><script>const id=location.pathname.split('/').filter(Boolean).pop()||new URLSearchParams(location.search).get('v');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=x=>new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(Number(x||0));async function run(){try{const d=await (await fetch('/data/youtube.json?v='+Date.now(),{cache:'no-store'})).json();const arr=[...(d.popularVideos||[]),...(d.recentVideos||[]),...(d.latestVideos||[])];const v=arr.find(x=>(x.id||x.videoId)===id);if(!v)throw Error('Video not found');const vid=v.id||v.videoId;const title=v.title||'YouTube video';document.title=title+' | Laxman Nepal';document.querySelector('link[rel=canonical]').href=location.href;document.querySelector('meta[name=description]').content=(v.description||title).slice(0,155);document.querySelector('meta[property="og:title"]')?.setAttribute('content',title);app.innerHTML='<div class="glass player"><iframe src="https://www.youtube.com/embed/'+encodeURIComponent(vid)+'?autoplay=1&rel=0" title="'+esc(title)+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><section class="glass card"><h1>'+esc(title)+'</h1><p class="muted">'+esc(v.publishedAt||v.publishDate||'')+'</p><div class="stats"><div class="glass stat"><b>'+n(v.views||v.statistics?.viewCount)+'</b><span class="muted">Views</span></div><div class="glass stat"><b>'+n(v.likes||v.statistics?.likeCount)+'</b><span class="muted">Likes</span></div><div class="glass stat"><b>'+n(v.comments||v.statistics?.commentCount)+'</b><span class="muted">Comments</span></div></div></section>'}catch(e){app.innerHTML='<div class="glass card"><h2>Video unavailable</h2><p class="muted">This video is not present in the latest channel dataset.</p></div>'}}run()</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Laxman Nepal YouTube growth dashboard — subscribers, views, uploads, growth trends, popular videos and channel insights."><link rel="canonical" href="https://apps.laxmannepal.com.np/youtube/"><title>Laxman Nepal YouTube — Growth Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:#101828;background:radial-gradient(circle at 10% 0,#dbeafe,transparent 30%),radial-gradient(circle at 90% 10%,#ede9fe,transparent 30%),#f5f7fb}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.glass{background:#ffffff9c;border:1px solid #ffffffdd;backdrop-filter:blur(24px) saturate(170%);box-shadow:0 24px 70px #1f26320d;border-radius:28px}.hero{padding:70px 0 35px}.back{color:#1677ff;font-weight:800;text-decoration:none}.identity{display:flex;gap:20px;align-items:center;margin-top:28px;padding:24px}.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover}.identity h1{margin:0;font-size:clamp(2rem,6vw,4.5rem);letter-spacing:-.06em}.identity p{color:#667085;margin:8px 0}.btn{display:inline-block;padding:13px 17px;border-radius:14px;background:#101828;color:#fff;text-decoration:none;font-weight:800;margin-left:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}.stat{padding:22px}.stat b{display:block;font-size:2rem}.stat span,.muted{color:#667085;font-size:.8rem}.growthHead{display:flex;align-items:center;justify-content:space-between;gap:15px}.ranges{display:flex;gap:6px;flex-wrap:wrap}.ranges button{border:0;background:#e9eef5;padding:9px 12px;border-radius:999px;cursor:pointer;font-weight:700}.ranges button.active{background:#101828;color:#fff}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-top:14px}.panel{padding:22px}.panel h2{margin:0 0 18px}.chart{height:230px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.chart polyline{fill:none;stroke:#ef4444;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.chart .area{fill:#ef444422;stroke:none}.axis{display:flex;justify-content:space-between;color:#667085;font-size:11px}.delta{font-weight:800;font-size:14px}.up{color:#16a34a}.down{color:#dc2626}.insight{padding:18px;border-radius:20px;background:#ffffffaa;margin-top:14px}.insight b{display:block;font-size:17px;margin-bottom:5px}.mix{display:flex;gap:40px}.mix b{font-size:2rem;display:block}.progress{height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#7c3aed,#1677ff);border-radius:99px}.videos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.video{border:1px solid #ffffff;background:#ffffffaa;border-radius:22px;overflow:hidden;cursor:pointer;transition:.35s;text-align:left;padding:0}.video:hover{transform:translateY(-7px);box-shadow:0 25px 60px #1f26321a}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.video div{padding:13px}.video b{display:block;line-height:1.4}.video small{display:block;color:#667085;margin-top:7px}.section{margin-top:18px}.footer{padding:45px 0;color:#667085}.modal{position:fixed;inset:0;z-index:10;background:#020617aa;backdrop-filter:blur(16px);display:grid;place-items:center;opacity:0;visibility:hidden;transition:.35s}.modal.open{opacity:1;visibility:visible}.box{width:min(960px,94vw);aspect-ratio:16/9;background:#000;border-radius:24px;padding:5px;position:relative;transform:scale(.9) translateY(25px);transition:.45s cubic-bezier(.22,1,.36,1)}.modal.open .box{transform:none}.box iframe{width:100%;height:100%;border:0;border-radius:19px}.close{position:absolute;right:0;top:-48px;border:0;border-radius:50%;width:40px;height:40px;background:#101828;color:#fff;font-size:24px;cursor:pointer}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.videos{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero{padding-top:55px}.identity{flex-wrap:wrap}.avatar{width:68px;height:68px}.btn{width:100%;margin:0;text-align:center}.stat{padding:15px}.stat b{font-size:1.5rem}.videos{grid-template-columns:1fr}.panel{padding:16px}.box{width:96vw}.close{top:-45px}.growthHead{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main class="wrap hero"><a class="back" href="/">← Laxman Nepal</a><section id="app"></section><footer class="footer">Historical metrics are collected automatically from the cached YouTube Data API dataset.</footer></main><div id="modal" class="modal"><div class="box"><button class="close">×</button><iframe allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></div><script>const U='/data/youtube.json',H='/data/youtube-history.json',app=document.querySelector('#app'),M=document.querySelector('#modal'),I=M.querySelector('iframe'),F=n=>new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(Number(n||0)),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const A=(d,n)=>{for(const k of n)if(Array.isArray(d[k])&&d[k].length)return d[k];return[]};function openVideo(id){I.src=`https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0`;M.classList.add('open')}function close(){M.classList.remove('open');setTimeout(()=>I.src='',200)}M.onclick=e=>{if(e.target===M||e.target.closest('.close'))close()};function line(points){if(!points.length)return'';const vals=points.map(x=>Number(x));const max=Math.max(...vals),min=Math.min(...vals),w=900,h=220,p=14;const xy=vals.map((v,i)=>`${p+(i/(Math.max(1,vals.length-1))*(w-p*2))},${h-p-((v-min)/(max-min||1))*(h-p*2)}`).join(' ');return `<polyline points="${xy}"/><line x1="${p}" x2="${w-p}" y1="${h-p}" y2="${h-p}" stroke="#cbd5e1" stroke-width="1"/>`}let history=[];let range=30;function renderGrowth(){const box=document.querySelector('#growth');if(!box)return;const pts=history.slice(-range);const latest=pts.at(-1)||{},prev=pts.length>1?pts[0]:latest;const diff=(k)=>Number(latest[k]||0)-Number(prev[k]||0);const pct=(k)=>prev[k]?diff(k)/Number(prev[k])*100:0;const metric=document.querySelector('#metric')?.value||'subscribers';const values=pts.map(x=>x[metric]||0);box.querySelector('.chart').innerHTML=`<svg viewBox="0 0 900 220" preserveAspectRatio="none">${line(values)}</svg>`;box.querySelector('.chartAxis').innerHTML=`<span>${pts[0]?.timestamp?.slice(0,10)||'—'}</span><span>${pts.at(-1)?.timestamp?.slice(0,10)||'—'}</span>`;box.querySelector('.delta').innerHTML=`${diff(metric)>=0?'↑':'↓'} ${F(Math.abs(diff(metric)))} (${Math.abs(pct(metric)).toFixed(1)}%) <span class="${diff(metric)>=0?'up':'down'}">${metric}</span>`}function growthCard(metric,label,latest,prev){const d=Number(latest?.[metric]||0)-Number(prev?.[metric]||0),p=prev?.[metric]?d/Number(prev[metric])*100:0;return `<div class="stat glass"><b>${F(latest?.[metric])}</b><span>${label} · <strong class="${d>=0?'up':'down'}">${d>=0?'↑':'↓'} ${Math.abs(p).toFixed(1)}%</strong></span></div>`}fetch(U+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(async d=>{try{const h=await fetch(H+'?v='+Date.now(),{cache:'no-store'});const j=h.ok?await h.json():{};history=Array.isArray(j.points)?j.points:[]}catch{}const c=d.channel||{},s=c.statistics||{},a=d.analysis||{},p=A(d,['popularVideos','topVideos','videos']).filter(v=>!(v.isShort||v.type==='short'||(Number(v.durationSeconds)>0&&Number(v.durationSeconds)<=60))).sort((x,y)=>Number(y.views??y.statistics?.viewCount??0)-Number(x.views??x.statistics?.viewCount??0)),r=A(d,['recentVideos','latestVideos','latestUploads']),latest=history.at(-1)||{subscribers:s.subscriberCount,views:s.viewCount,videos:s.videoCount},prev=history.length>1?history[Math.max(0,history.length-1-range)]:latest;app.innerHTML=`<section class="identity glass"><img class="avatar" src="${E(c.thumbnail)}"><div><h1>${E(c.title||'Laxman Nepal')}</h1><p>@laxmannepalofficial · ${E(d.dataSource||'YouTube Data API v3')}</p></div><a class="btn" target="_blank" href="https://www.youtube.com/@laxmannepalofficial">Subscribe on YouTube ↗</a></section><div class="stats">${growthCard('subscribers','Subscribers',latest,prev)}${growthCard('views','Total views',latest,prev)}${growthCard('videos','Total videos',latest,prev)}${growthCard('summary','Data points',latest,{summary:history.length})}</div><section class="panel glass section" id="growth"><div class="growthHead"><div><h2>Channel growth</h2><select id="metric"><option value="subscribers">Subscribers</option><option value="views">Views</option><option value="videos">Videos</option></select></div><div class="ranges"><button data-r="7">7D</button><button data-r="30" class="active">30D</button><button data-r="90">90D</button><button data-r="365">1Y</button></div></div><div class="delta"></div><div class="chart"></div><div class="axis chartAxis"></div><div class="insight"><b>Automatic insight</b><span id="insightText">${history.length<2?'Historical data is building. Leave the Action running to unlock meaningful growth comparisons.':`Your channel has ${diffText(history,range,'views')} views change across the selected period.`}</span></div></section><div class="grid"><section class="panel glass"><h2>Content mix</h2><div class="mix"><div><b>${F(a.shortsCount)}</b><span class="muted">Shorts</span></div><div><b>${F(a.longFormCount)}</b><span class="muted">Long-form</span></div></div><div class="progress"><i style="width:${a.videosFetched?Math.min(100,a.shortsCount/a.videosFetched*100):0}%"></i></div><p class="muted">Average engagement: ${Number(a.averageEngagementRate||0).toFixed(1)}%</p></section><section class="panel glass"><h2>Fetched performance</h2><p>Total fetched views <b>${F(a.totalViewsFetched)}</b></p><p>Total likes <b>${F(a.totalLikesFetched)}</b></p><p>Total comments <b>${F(a.totalCommentsFetched)}</b></p><p class="muted">${F(a.videosFetched)} videos analyzed</p></section></div><section class="panel glass section"><div class="growthHead"><h2>Popular long-form videos</h2><span class="muted">Top ${Math.min(20,p.length)} · full library</span></div><div class="videos">${p.slice(0,20).map(v=>{const id=v.id||v.videoId;return `<button class="video" data-id="${E(id)}"><img class="thumb" loading="lazy" src="${E(v.thumbnail||v.thumbnails?.high?.url||v.thumbnails?.medium?.url||'')}" alt=""><div><b>${E(v.title)}</b><small>${F(v.views??v.statistics?.viewCount)} views · ${F(v.likes??v.statistics?.likeCount)} likes · ${F(v.comments??v.statistics?.commentCount)} comments</small></div></button>`}).join('')}</div></section>${r.length?`<section class="panel glass section"><h2>Latest uploads</h2><div class="videos">${r.slice(0,12).map(v=>{const id=v.id||v.videoId;return `<button class="video" data-id="${E(id)}"><img class="thumb" loading="lazy" src="${E(v.thumbnail||v.thumbnails?.high?.url||v.thumbnails?.medium?.url||'')}" alt=""><div><b>${E(v.title)}</b><small>${F(v.views??v.statistics?.viewCount)} views</small></div></button>`}).join('')}</div></section>`:''}`;document.querySelectorAll('.video').forEach(x=>x.onclick=()=>openVideo(x.dataset.id));document.querySelectorAll('.ranges button').forEach(b=>b.onclick=()=>{range=Number(b.dataset.r);document.querySelectorAll('.ranges button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderGrowth()});document.querySelector('#metric').onchange=renderGrowth;renderGrowth()}).catch(()=>app.innerHTML='<section class="panel glass"><h2>Unable to load YouTube data</h2><p class="muted">Please try again shortly.</p></section>');function diffText(h,r,k){if(h.length<2)return'not enough';const a=h.at(-1),b=h[Math.max(0,h.length-1-r)];return`${F(Number(a[k]||0)-Number(b[k]||0))}`}</script></body></html>

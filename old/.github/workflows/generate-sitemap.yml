name: Generate SEO Sitemap

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/apps.json'
      - 'data/youtube.json'
      - 'scripts/generate_sitemap.py'
      - '.github/workflows/generate-sitemap.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sitemap-main
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate sitemap
        run: python scripts/generate_sitemap.py

      - name: Validate sitemap
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse('sitemap.xml')
          text = Path('sitemap.xml').read_text(encoding='utf-8')
          assert 'https://apps.laxmannepal.com.np/' in text
          print('sitemap.xml valid')
          PY

      - name: Commit changes when needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "Sitemap already up to date"
            exit 0
          fi
          git commit -m 'chore: refresh SEO sitemap'
          git push origin HEAD:main

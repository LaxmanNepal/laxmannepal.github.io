<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Search Laxman Nepal tools, AI resources, guides, apps, mobile content and articles."><link rel="canonical" href="https://laxmannepal.com.np/search/"><link rel="stylesheet" href="/assets/css/shared-shell.css"><title>Search — Laxman Nepal</title><style>.search-page{max-width:1100px;margin:auto;padding:55px 18px 75px}.hero{text-align:center;padding:25px 10px 35px}.hero small{font-weight:800;letter-spacing:.1em;color:#667085}.hero h1{font-size:clamp(42px,7vw,72px);line-height:1;letter-spacing:-.055em;margin:10px 0}.hero p{color:#667085}.form{display:flex;max-width:760px;margin:25px auto 0;padding:7px;gap:8px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 15px 45px #10182812}.form input{flex:1;min-width:0;border:0;outline:0;padding:13px;font:inherit}.form button{border:0;border-radius:12px;padding:0 20px;background:#111;color:#fff;font-weight:800}.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:16px}.chips button{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:8px 13px}.meta{margin:24px 0 14px;color:#667085;font-size:13px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{display:block;padding:20px;border:1px solid #e5e7eb;border-radius:20px;background:#fff;color:inherit;text-decoration:none;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px #10182814}.icon{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#f2f4f7;margin-bottom:14px}.type{font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#667085}.card h2{font-size:18px;margin:7px 0}.card p{margin:0;color:#667085;font-size:13px}.empty{padding:45px;text-align:center;border:1px dashed #d0d5dd;border-radius:20px;color:#667085}@media(max-width:800px){.results{grid-template-columns:1fr 1fr}}@media(max-width:560px){.search-page{padding-top:30px}.results{grid-template-columns:1fr}.form button{padding:0 14px}}</style></head><body><header class="shared-header"><a class="shared-brand" href="/"><span class="shared-logo">LN</span><span><strong>Laxman Nepal</strong><small>Tools · AI · Guides</small></span></a><nav class="shared-desktop-nav"><a href="/">Home</a><a href="/tools/">Tools</a><a href="/ai-tools/">AI Tools</a><a href="/blog/">Blog</a><details class="nav-dropdown"><summary>Explore⌄</summary><div class="nav-dropdown-menu"><a href="/apps/">Apps</a><a href="/mobile/">Mobile</a><a href="/news/">News</a><a href="/contact/">Contact</a></div></details></nav><div class="shared-actions"><label class="shared-search-box"><span>⌕</span><input id="nav" type="search" placeholder="Search…" aria-label="Search"></label><button class="shared-menu-btn" id="mb" type="button">☰</button></div></header><div class="shared-menu-backdrop" id="bk"></div><nav class="shared-mobile-menu" id="mm"><div class="shared-mobile-head"><strong>Navigation</strong><button id="mc" type="button">×</button></div><a href="/">Home</a><a href="/tools/">Tools</a><a href="/ai-tools/">AI Tools</a><a href="/blog/">Blog</a><a href="/apps/">Apps</a><a href="/mobile/">Mobile</a><a href="/news/">News</a><a href="/contact/">Contact</a><div class="shared-mobile-search"><span>⌕</span><input id="mnav" type="search" placeholder="Search tools, guides & articles…" aria-label="Search"></div></nav><main class="search-page"><section class="hero"><small>LAXMAN NEPAL SEARCH</small><h1>Find something useful.</h1><p>Search tools, AI resources, guides, apps, mobile content and articles.</p><form class="form" id="form"><input id="q" type="search" placeholder="Try AI, PDF, YouTube, mobile…" autocomplete="off"><button>Search</button></form><div class="chips"><button data-q="AI">AI</button><button data-q="YouTube">YouTube</button><button data-q="PDF">PDF</button><button data-q="Mobile">Mobile</button><button data-q="Nepali">Nepali</button><button data-q="Image">Image</button></div></section><div class="meta" id="meta"></div><section class="results" id="results"></section></main><script>let DATA=[];const icons={AI:"🤖",Tools:"🛠️",Apps:"📱",Article:"✍️",Mobile:"📱",News:"📰",YouTube:"▶️",Image:"🖼️",PDF:"📄",Education:"🎓",Nepali:"🇳🇵",Video:"🎬",Writing:"Aa",Books:"📚",Web:"🌐",About:"👤",Blogging:"📝",Navigation:"⌘"};const q=document.getElementById("q"),r=document.getElementById("results"),m=document.getElementById("meta");
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function normalize(v){return String(v??"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^\p{L}\p{N}]+/gu," ").trim()}
function score(x,terms){const title=normalize(x.title),category=normalize(x.category),text=normalize(x.title+" "+x.category+" "+x.description+" "+x.keywords);let n=0;for(const t of terms){if(title===t)n+=120;else if(title.startsWith(t))n+=70;else if(title.includes(t))n+=45;else if(category.includes(t))n+=30;else if(text.includes(t))n+=10}return n}
function run(v,updateUrl=true){v=(v||"").trim();const terms=normalize(v).split(/\s+/).filter(Boolean);let a=terms.length?DATA.filter(x=>terms.every(t=>normalize(x.title+" "+x.category+" "+x.description+" "+x.keywords).includes(t))):DATA.slice();if(terms.length)a.sort((x,y)=>score(y,terms)-score(x,terms));m.textContent=v?a.length+" result"+(a.length===1?"":"s")+" for “"+v+"”":DATA.length+" searchable resources";r.innerHTML=a.length?a.map(x=>'<a class="card" href="'+encodeURI(x.url)+'"><span class="icon">'+(icons[x.category]||"✦")+'</span><span class="type">'+escapeHtml(x.category)+'</span><h2>'+escapeHtml(x.title)+'</h2><p>'+escapeHtml(x.description)+'</p></a>').join(""):'<div class="empty"><strong>No matching results</strong><p>Try another keyword or one of the quick searches above.</p></div>';if(updateUrl)history.replaceState(null,"",v?"/search/?q="+encodeURIComponent(v):"/search/")}
async function loadIndex(){try{const response=await fetch("/search-index.json",{cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);DATA=await response.json()}catch(e){m.textContent="Search index could not be loaded.";r.innerHTML='<div class="empty"><strong>Search is temporarily unavailable</strong><p>Please refresh the page.</p></div>';return}q.value=new URLSearchParams(location.search).get("q")||"";run(q.value,false)}
document.getElementById("form").onsubmit=e=>{e.preventDefault();run(q.value)};
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{q.value=b.dataset.q;run(q.value)});
q.addEventListener("input",()=>{const v=q.value.trim();if(!v){run("",true);return}run(v,true)});
const nav=document.getElementById("nav"),mnav=document.getElementById("mnav");
nav?.addEventListener("keydown",e=>{if(e.key==="Enter"&&nav.value.trim())location.href="/search/?q="+encodeURIComponent(nav.value.trim())});
mnav?.addEventListener("keydown",e=>{if(e.key==="Enter"&&mnav.value.trim())location.href="/search/?q="+encodeURIComponent(mnav.value.trim())});
document.addEventListener("keydown",e=>{if((e.key==="/"||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"))&&document.activeElement?.tagName!=="INPUT"&&document.activeElement?.tagName!=="TEXTAREA"){e.preventDefault();q.focus()}});
loadIndex();const mb=document.getElementById("mb"),mm=document.getElementById("mm"),bk=document.getElementById("bk"),mc=document.getElementById("mc");function toggle(v){mm.classList.toggle("open",v);bk.style.display=v?"block":"none";mb.setAttribute("aria-expanded",v);document.body.style.overflow=v?"hidden":""}mb.onclick=()=>toggle(!mm.classList.contains("open"));mc.onclick=()=>toggle(false);bk.onclick=()=>toggle(false);mm.querySelectorAll("a").forEach(a=>a.onclick=()=>toggle(false));</script></body></html>

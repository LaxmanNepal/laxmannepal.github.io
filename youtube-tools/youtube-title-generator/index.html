<script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"YouTube Title Generator","url":"https://laxmannepal.com.np/youtube-tools/youtube-title-generator/","applicationCategory":"MultimediaApplication","operatingSystem":"Web","description":"Generate YouTube title ideas for videos, improve keyword relevance and build stronger publishing concepts with this free YouTube title generator.","author":{"@type":"Person","name":"Laxman Nepal"},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script><link rel="icon" href="https://laxmannepal.com.np/youtube-tools/youtube-title-generator/logo.webp" type="image/webp"><meta property="og:image" content="https://laxmannepal.com.np/youtube-tools/youtube-title-generator/logo.webp"><meta name="twitter:image" content="https://laxmannepal.com.np/youtube-tools/youtube-title-generator/logo.webp"></head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fab fa-youtube"></i>
                <h1>YouTube Title Generator</h1>
            </div>
            <p class="subtitle">Generate compelling YouTube titles based on your keywords</p>
        </header>

        <main>
            <section class="card">
                <div class="input-group">
                    <label for="keyword"><i class="fas fa-keyboard"></i> Enter Keyword</label>
                    <input type="text" id="keyword" placeholder="e.g., digital marketing, cooking tutorial, tech review">
                </div>
                
                <div class="input-group">
                    <label for="numTitles"><i class="fas fa-list-ol"></i> Number of Titles</label>
                    <input type="number" id="numTitles" value="5" min="1" max="10">
                </div>
                
                <div class="button-group">
                    <button class="generate-btn" onclick="generateTitles()">
                        <i class="fas fa-magic"></i> Generate Titles
                    </button>
                    <button class="copy-btn" onclick="copyTitles()">
                        <i class="fas fa-copy"></i> Copy Titles
                    </button>
                </div>
            </section>

            <div class="loader" id="loader">
                <i class="fas fa-spinner"></i>
                <p>Searching for trending titles...</p>
            </div>

            <section class="card result-container" id="resultContainer">
                <div class="result-header">
                    <h2><i class="fas fa-film"></i> Generated Titles</h2>
                    <span class="result-count" id="resultCount">5 titles</span>
                </div>
                
                <div class="titles-list" id="titlesList">
                    <!-- Titles will be inserted here -->
                </div>
            </section>

            <div class="card empty-state" id="emptyState">
                <i class="fas fa-lightbulb"></i>
                <h3>No Titles Generated Yet</h3>
                <p>Enter a keyword and click "Generate Titles" to get started</p>
            </div>
        </main>

      
    </div>

    <script>
        function generateTitles() {
            const keyword = document.getElementById('keyword').value;
            const numTitles = document.getElementById('numTitles').value;
            const resultContainer = document.getElementById('resultContainer');
            const emptyState = document.getElementById('emptyState');
            const loader = document.getElementById('loader');
            const titlesList = document.getElementById('titlesList');
            const resultCount = document.getElementById('resultCount');

            if (!keyword || numTitles < 1 || numTitles > 10) {
                alert('Please enter a valid keyword and a number between 1 and 10 for titles');
                return;
            }

            // Show loader, hide empty state
            loader.style.display = 'block';
            emptyState.style.display = 'none';
            resultContainer.style.display = 'none';

            // Replace 'YOUR_API_KEY' with your actual YouTube API key
            const apiKey = '';
            const apiUrl = `https://api.laxmannepal.com.np/youtube/search?q=${encodeURIComponent(keyword)}&part=snippet&maxResults=${numTitles}&type=video&key=${apiKey}`;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    // Hide loader
                    loader.style.display = 'none';
                    
                    if (data.items && data.items.length > 0) {
                        const titles = data.items.map(item => item.snippet.title);
                        
                        // Update result count
                        resultCount.textContent = `${titles.length} title${titles.length > 1 ? 's' : ''}`;
                        
                        // Clear previous results
                        titlesList.innerHTML = '';
                        
                        // Add titles to the list
                        titles.forEach((title, index) => {
                            const titleItem = document.createElement('div');
                            titleItem.className = 'title-item';
                            titleItem.innerHTML = `
                                <div class="title-number">${index + 1}</div>
                                <div class="title-text">${title}</div>
                            `;
                            titlesList.appendChild(titleItem);
                        });
                        
                        // Show result container
                        resultContainer.style.display = 'block';
                    } else {
                        emptyState.innerHTML = `
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>No Titles Found</h3>
                            <p>Try a different keyword or check your internet connection</p>
                        `;
                        emptyState.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    loader.style.display = 'none';
                    emptyState.innerHTML = `
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error Fetching Data</h3>
                        <p>An error occurred while fetching data. Please try again.</p>
                    `;
                    emptyState.style.display = 'block';
                });
        }

        function copyTitles() {
            const titleItems = document.querySelectorAll('.title-text');
            
            if (titleItems.length === 0) {
                alert('No titles to copy');
                return;
            }

            const titlesText = Array.from(titleItems)
                .map((item, index) => `${index + 1}. ${item.textContent}`)
                .join('\n');

            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = titlesText;

            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextArea);

            // Show temporary feedback
            const copyBtn = document.querySelector('.copy-btn');
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            copyBtn.style.background = 'linear-gradient(to right, #4CAF50, #45a049)';
            
            setTimeout(() => {
                copyBtn.innerHTML = originalText;
                copyBtn.style.background = 'linear-gradient(to right, #f0f0f0, #e0e0e0)';
            }, 2000);
        }

        // Allow pressing Enter to generate titles
        document.getElementById('keyword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateTitles();
            }
        });
    </script>
</body>

<body>
    <div class="container">
        <div class="card">
            <h1><i class="fas fa-robot" style="margin-right: 10px;"></i> AI-Powered YouTube SEO Deep Analyzer</h1>
            
            <div class="api-quota">

    <script>
        // YouTube Data API Key
        const API_KEYS = [
            '',
            '',
            ''
        ];
        let currentApiKeyIndex = 0;

        function getApiKey() {
            return API_KEYS[currentApiKeyIndex];
        }

        function rotateApiKey() {
            currentApiKeyIndex = (currentApiKeyIndex + 1) % API_KEYS.length;
            return getApiKey();
        }

        function updateApiStatus(message, type) {
            const apiStatus = document.getElementById('apiStatus');
            apiStatus.innerHTML = `<div class="api-status ${type}"><i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i> ${message}</div>`;
        }

        async function analyzeVideoSEO() {
            const videoUrlInput = document.getElementById('videoUrlInput').value.trim();
            const loadingIndicator = document.getElementById('loadingIndicator');
            const seoAnalysisResult = document.getElementById('seoAnalysisResult');
            const analyzeButton = document.getElementById('analyzeButton');

            if (!isValidYouTubeUrl(videoUrlInput)) {
                alert('Please enter a valid YouTube video URL.');
                return;
            }

            // Show loading indicator and disable button
            loadingIndicator.style.display = 'block';
            analyzeButton.disabled = true;
            analyzeButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AI Analyzing...';
            seoAnalysisResult.innerHTML = '';
            updateApiStatus('Initializing AI models and deep data analysis...', '');

            const videoId = extractVideoId(videoUrlInput);

            try {
                // Fetch video data from YouTube API
                const videoData = await fetchVideoData(videoId);
                
                if (videoData.error) {
                    throw new Error(videoData.error);
                }

                // Fetch channel data for additional insights
                const channelData = await fetchChannelData(videoData.snippet.channelId);
                
                // Simulate AI processing time
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                loadingIndicator.style.display = 'none';
                analyzeButton.disabled = false;
                analyzeButton.innerHTML = '<i class="fas fa-brain"></i> Deep Analyze';
                
                updateApiStatus('AI analysis completed successfully', 'success');
                
                displaySEOAnalysis(videoData, channelData, videoUrlInput, videoId);
            } catch (error) {
                loadingIndicator.style.display = 'none';
                analyzeButton.disabled = false;
                analyzeButton.innerHTML = '<i class="fas fa-brain"></i> Deep Analyze';
                
                updateApiStatus(`AI Analysis Error: ${error.message}`, 'error');
                
                seoAnalysisResult.innerHTML = `
                    <div class="error-message">
                        <h3><i class="fas fa-exclamation-triangle"></i> AI Analysis Failed</h3>
                        <p>${error.message}</p>
                        <p>Please check your URL or try again later. The AI system may be experiencing high load.</p>
                    </div>
                `;
            }
        }

        async function fetchVideoData(videoId) {
            const apiKey = getApiKey();
            const response = await fetch(`https://api.laxmannepal.com.np/youtube/videos?part=snippet,statistics,contentDetails,player,topicDetails&id=${videoId}&key=${apiKey}`);
            
            if (!response.ok) {
                if (response.status === 403) {
                    rotateApiKey();
                    return await fetchVideoData(videoId);
                }
                throw new Error(`YouTube API error: ${response.status} ${response.statusText}`);
            }
            
            const data = await response.json();
            
            if (!data.items || data.items.length === 0) {
                throw new Error('No video found with the provided ID');
            }
            
            return data.items[0];
        }

        async function fetchChannelData(channelId) {
            const apiKey = getApiKey();
            const response = await fetch(`https://api.laxmannepal.com.np/youtube/channels?part=snippet,statistics,brandingSettings&id=${channelId}&key=${apiKey}`);
            
            if (!response.ok) {
                console.error('Failed to fetch channel data:', response.status);
                return null;
            }
            
            const data = await response.json();
            return data.items && data.items.length > 0 ? data.items[0] : null;
        }

        function isValidYouTubeUrl(url) {
            const pattern = /^(https?\:\/\/)?(www\.youtube\.com|youtu\.?be)\/.+$/;
            return pattern.test(url);
        }

        function extractVideoId(url) {
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[7].length === 11) ? match[7] : null;
        }

        function formatDuration(duration) {
            const match = duration.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
            if (!match) return 'Unknown';
            
            const hours = (match[1] || '').replace('H', '');
            const minutes = (match[2] || '').replace('M', '');
            const seconds = (match[3] || '').replace('S', '');
            
            let result = '';
            if (hours) result += `${hours}h `;
            if (minutes) result += `${minutes}m `;
            if (seconds) result += `${seconds}s`;
            
            return result.trim() || '0s';
        }

        function formatCount(count) {
            if (!count) return '0';
            
            const num = parseInt(count);
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        // Advanced AI Analysis Functions
        function calculateEngagementMetrics(statistics) {
            const views = parseInt(statistics.viewCount) || 0;
            const likes = parseInt(statistics.likeCount) || 0;
            const comments = parseInt(statistics.commentCount) || 0;
            const favorites = parseInt(statistics.favoriteCount) || 0;
            
            if (views === 0) return {
                engagementRate: 0,
                likeRatio: 0,
                commentRatio: 0,
                favoriteRatio: 0,
                totalEngagement: 0
            };
            
            return {
                engagementRate: ((likes + comments + favorites) / views * 100).toFixed(2),
                likeRatio: (likes / views * 100).toFixed(2),
                commentRatio: (comments / views * 100).toFixed(2),
                favoriteRatio: (favorites / views * 100).toFixed(2),
                totalEngagement: likes + comments + favorites
            };
        }

        function calculatePerformanceScore(statistics, publishedAt) {
            const views = parseInt(statistics.viewCount) || 0;
            const likes = parseInt(statistics.likeCount) || 0;
            const comments = parseInt(statistics.commentCount) || 0;
            
            const publishDate = new Date(publishedAt);
            const currentDate = new Date();
            const daysSincePublish = Math.floor((currentDate - publishDate) / (1000 * 60 * 60 * 24));
            
            if (daysSincePublish === 0) return 0;
            
            const dailyViews = views / daysSincePublish;
            const dailyLikes = likes / daysSincePublish;
            const dailyComments = comments / daysSincePublish;
            
            const viewScore = Math.min(dailyViews / 1000, 100);
            const likeScore = Math.min(dailyLikes / 50, 100);
            const commentScore = Math.min(dailyComments / 10, 100);
            
            return Math.round((viewScore * 0.5) + (likeScore * 0.3) + (commentScore * 0.2));
        }

        function generateAIPredictions(videoData, channelData) {
            const snippet = videoData.snippet;
            const statistics = videoData.statistics;
            
            // Calculate current metrics
            const currentViews = parseInt(statistics.viewCount) || 0;
            const currentLikes = parseInt(statistics.likeCount) || 0;
            const engagementMetrics = calculateEngagementMetrics(statistics);
            
            // Generate predictions based on AI models
            const daysSincePublish = Math.floor((new Date() - new Date(snippet.publishedAt)) / (1000 * 60 * 60 * 24));
            const growthFactor = engagementMetrics.engagementRate > 5 ? 1.5 : engagementMetrics.engagementRate > 3 ? 1.2 : 0.8;
            
            return {
                // 30-day predictions
                views30Days: Math.round(currentViews * (1 + (growthFactor * 30 / daysSincePublish))),
                likes30Days: Math.round(currentLikes * (1 + (growthFactor * 30 / daysSincePublish))),
                
                // 90-day predictions
                views90Days: Math.round(currentViews * (1 + (growthFactor * 90 / daysSincePublish))),
                likes90Days: Math.round(currentLikes * (1 + (growthFactor * 90 / daysSincePublish))),
                
                // Revenue predictions (estimated)
                estimatedRevenue30Days: Math.round(currentViews * 0.01 * growthFactor),
                estimatedRevenue90Days: Math.round(currentViews * 0.03 * growthFactor),
                
                // Growth trajectory
                growthTrajectory: growthFactor > 1.2 ? 'Exponential' : growthFactor > 0.9 ? 'Linear' : 'Declining',
                
                // AI Confidence Score
                confidenceScore: Math.round(Math.min(95, 70 + (engagementMetrics.engagementRate * 5)))
            };
        }

        function generateContentAnalysis(snippet) {
            const title = snippet.title;
            const description = snippet.description || '';
            const tags = snippet.tags || [];
            
            // Advanced NLP-like analysis
            const titleWords = title.toLowerCase().split(/\s+/);
            const descriptionWords = description.toLowerCase().split(/\s+/);
            
            // Calculate keyword density
            const allWords = [...titleWords, ...descriptionWords, ...tags];
            const wordFrequency = {};
            allWords.forEach(word => {
                if (word.length > 3) {
                    wordFrequency[word] = (wordFrequency[word] || 0) + 1;
                }
            });
            
            // Sentiment analysis (simulated)
            const positiveWords = ['great', 'amazing', 'best', 'excellent', 'awesome', 'perfect', 'love', 'good', 'nice', 'wonderful'];
            const negativeWords = ['bad', 'terrible', 'worst', 'awful', 'hate', 'dislike', 'poor', 'horrible', 'negative'];
            
            let positiveScore = 0;
            let negativeScore = 0;
            
            allWords.forEach(word => {
                if (positiveWords.includes(word)) positiveScore++;
                if (negativeWords.includes(word)) negativeScore++;
            });
            
            const sentimentScore = positiveScore - negativeScore;
            
            return {
                keywordDensity: wordFrequency,
                sentiment: {
                    score: sentimentScore,
                    label: sentimentScore > 2 ? 'Positive' : sentimentScore < -2 ? 'Negative' : 'Neutral',
                    positiveWords: positiveScore,
                    negativeWords: negativeScore
                },
                readability: {
                    score: Math.min(100, Math.max(30, 70 - (titleWords.length / 2) + (description.length / 100))),
                    grade: description.length > 500 ? 'Advanced' : description.length > 200 ? 'Intermediate' : 'Basic'
                },
                seoOptimization: {
                    titleLength: title.length,
                    descriptionLength: description.length,
                    tagCount: tags.length,
                    optimalTitle: title.length >= 50 && title.length <= 60,
                    optimalDescription: description.length >= 250
                }
            };
        }

            const inputs = [
                parseInt(videoData.statistics.viewCount) || 0,
                parseInt(videoData.statistics.likeCount) || 0,
                parseInt(videoData.statistics.commentCount) || 0,
                videoData.snippet.title.length,
                (videoData.snippet.description || '').length,
                (videoData.snippet.tags || []).length
            ];
            
            // Simulate neural network processing
            const weights = [0.3, 0.25, 0.2, 0.1, 0.1, 0.05];
            let weightedSum = 0;
            
            inputs.forEach((input, index) => {
                weightedSum += input * weights[index];
            });
            
            // Apply activation function (sigmoid)
            const activation = 1 / (1 + Math.exp(-weightedSum / 1000000));
            
            return {
                neuralScore: Math.round(activation * 100),
                activationLevel: activation > 0.7 ? 'High' : activation > 0.4 ? 'Medium' : 'Low',
                featureImportance: {
                    views: 30,
                    likes: 25,
                    comments: 20,
                    title: 10,
                    description: 10,
                    tags: 5
                },
                recommendation: activation > 0.7 ? 
                    'Content is well-optimized. Focus on promotion.' : 
                    activation > 0.4 ? 
                    'Moderate optimization. Consider improving engagement.' : 
                    'Needs significant optimization. Review content strategy.'
            };
        }

        function generateCompetitiveAnalysis(videoData) {
            // Simulated competitive analysis
            const views = parseInt(videoData.statistics.viewCount) || 0;
            const likes = parseInt(videoData.statistics.likeCount) || 0;
            
            return {
                marketPosition: views > 100000 ? 'Leader' : views > 50000 ? 'Strong' : views > 10000 ? 'Moderate' : 'Emerging',
                competitiveIndex: Math.min(100, Math.round((views / 100000) * 100)),
                shareOfVoice: Math.min(100, Math.round((views / 500000) * 100)),
                growthPotential: 100 - Math.min(100, Math.round((views / 100000) * 100))
            };
        }

        function calculateAdvancedSEOScore(videoData, channelData) {
            const snippet = videoData.snippet;
            const statistics = videoData.statistics;
            
            const engagementMetrics = calculateEngagementMetrics(statistics);
            const performanceScore = calculatePerformanceScore(statistics, snippet.publishedAt);
            const contentAnalysis = generateContentAnalysis(snippet);
            const neuralInsights = generateNeuralNetworkInsights(videoData, channelData);
            
            let totalScore = 0;
            let maxScore = 0;
            
            const scores = {
                content: { 
                    score: Math.round(
                        (contentAnalysis.seoOptimization.optimalTitle ? 20 : 10) +
                        (contentAnalysis.seoOptimization.optimalDescription ? 20 : 10) +
                        (contentAnalysis.seoOptimization.tagCount >= 5 ? 20 : 10) +
                        contentAnalysis.readability.score * 0.4
                    ), 
                    weight: 25 
                },
                engagement: { 
                    score: Math.round(
                        Math.min(100, engagementMetrics.engagementRate * 10) * 0.6 +
                        performanceScore * 0.4
                    ), 
                    weight: 30 
                },
                technical: { 
                    score: Math.round(
                        (snippet.thumbnails ? 25 : 0) +
                        (snippet.categoryId ? 25 : 0) +
                        (snippet.defaultLanguage ? 25 : 0) +
                        (videoData.contentDetails ? 25 : 0)
                    ), 
                    weight: 20 
                },
                neural: { 
                    score: neuralInsights.neuralScore, 
                    weight: 25 
                }
            };
            
            // Calculate total weighted score
            for (const category in scores) {
                totalScore += scores[category].score * (scores[category].weight / 100);
                maxScore += 100 * (scores[category].weight / 100);
            }
            
            const finalScore = Math.round(totalScore);
            
            return {
                overall: finalScore,
                breakdown: scores,
                engagementMetrics: engagementMetrics,
                performanceScore: performanceScore,
                contentAnalysis: contentAnalysis,
                neuralInsights: neuralInsights,
                competitiveAnalysis: generateCompetitiveAnalysis(videoData)
            };
        }

                            position: 'bottom'
                        }
                    }
                }
            });

            // Performance Chart
            const performanceCtx = document.getElementById('performanceChart').getContext('2d');
            new Chart(performanceCtx, {
                type: 'radar',
                data: {
                    labels: ['Content', 'Engagement', 'Technical', 'AI Score', 'Growth'],
                    datasets: [{
                        label: 'Your Video',
                        data: [
                            seoScore.breakdown.content.score,
                            seoScore.breakdown.engagement.score,
                            seoScore.breakdown.technical.score,
                            seoScore.breakdown.neural.score,
                            seoScore.performanceScore
                        ],
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        borderColor: 'rgb(54, 162, 235)',
                        pointBackgroundColor: 'rgb(54, 162, 235)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgb(54, 162, 235)'
                    }, {
                        label: 'Industry Average',
                        data: [65, 60, 70, 55, 50],
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderColor: 'rgb(255, 99, 132)',
                        pointBackgroundColor: 'rgb(255, 99, 132)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgb(255, 99, 132)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: {
                                display: true
                            },
                            suggestedMin: 0,
                            suggestedMax: 100
                        }
                    }
                }
            });

            // Competitive Chart
            const competitiveCtx = document.getElementById('competitiveChart').getContext('2d');
            new Chart(competitiveCtx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: 'Your Video',
                        data: [{
                            x: seoScore.competitiveAnalysis.competitiveIndex,
                            y: seoScore.performanceScore
                        }],
                        backgroundColor: 'rgb(255, 99, 132)',
                        pointRadius: 10
                    }, {
                        label: 'Competitors',
                        data: [
                            { x: 45, y: 40 },
                            { x: 60, y: 55 },
                            { x: 75, y: 65 },
                            { x: 30, y: 35 },
                            { x: 85, y: 70 },
                            { x: 50, y: 45 },
                            { x: 65, y: 60 }
                        ],
                        backgroundColor: 'rgb(54, 162, 235)',
                        pointRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Competitive Index'
                            },
                            min: 0,
                            max: 100
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Performance Score'
                            },
                            min: 0,
                            max: 100
                        }
                    }
                }
            });
        }

        function switchTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show the selected tab content
            document.getElementById(tabName).classList.add('active');
            
            // Add active class to the clicked tab
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>

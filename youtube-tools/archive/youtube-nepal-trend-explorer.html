<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="/assets/css/shared-shell.css"><script src="/assets/js/shared-shell.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Trend Explorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .logo i {
            color: #ff0000;
            font-size: 32px;
        }
        
        .logo h1 {
            color: #333;
            font-size: 28px;
            font-weight: 700;
        }
        
        .logo span {
            color: #ff0000;
        }
        
        .description {
            text-align: center;
            margin-bottom: 25px;
            color: #666;
            font-size: 16px;
        }
        
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            min-width: 200px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        
        select, input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            background-color: #f8f8f8;
            transition: all 0.3s;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 0 2px rgba(255, 0, 0, 0.1);
        }
        
        .btn {
            padding: 14px 25px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 28px;
        }
        
        .btn:hover {
            background-color: #cc0000;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(255, 0, 0, 0.2);
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }
        
        .loading-spinner {
            border: 5px solid #e0e0e0;
            border-top: 5px solid #ff0000;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #videos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        
        .video {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }
        
        .video:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .thumbnail {
            width: 100%;
            height: 170px;
            object-fit: cover;
            display: block;
        }
        
        .video-info {
            padding: 15px;
        }
        
        .video-title {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 16px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 45px;
        }
        
        .video-channel {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .video-stats {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 13px;
            margin-top: 10px;
        }
        
        .video-date {
            color: #888;
            font-size: 12px;
        }
        
        .error-message {
            text-align: center;
            color: #ff0000;
            padding: 20px;
            display: none;
        }
        
        .player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .player-content {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8f8f8;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .player-title {
            font-weight: 600;
            font-size: 18px;
        }
        
        .close-player {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        
        .close-player:hover {
            color: #ff0000;
        }
        
        .video-player {
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            position: relative;
        }
        
        .video-player iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .player-info {
            padding: 20px;
        }
        
        .player-channel {
            color: #666;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .player-description {
            color: #666;
            line-height: 1.5;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            
            #videos {
                grid-template-columns: 1fr;
            }
            
            .player-content {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fab fa-youtube"></i>
            <h1>YouTube <span>Trend</span> Explorer</h1>
        </div>
        <p class="description">Discover the most popular videos trending worldwide</p>
    </header>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="country">Country:</label>
                <select id="country">
                    <option value="NP">Nepal</option>
                    <option value="US">United States</option>
                    <option value="IN">India</option>
                    <option value="GB">United Kingdom</option>
                    <option value="JP">Japan</option>
                    <option value="BR">Brazil</option>
                    <option value="DE">Germany</option>
                    <option value="FR">France</option>
                    <option value="CA">Canada</option>
                    <option value="AU">Australia</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="category">Category:</label>
                <select id="category">
                    <option value="0">All Categories</option>
                    <option value="10">Music</option>
                    <option value="17">Sports</option>
                    <option value="20">Gaming</option>
                    <option value="24">Entertainment</option>
                    <option value="25">News</option>
                    <option value="26">Howto & Style</option>
                    <option value="27">Education</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="results">Number of Results:</label>
                <input type="number" id="results" value="12" min="1" max="50">
            </div>
            
            <button class="btn" onclick="exploreTrends()">
                <i class="fas fa-chart-line"></i> Explore Trends
            </button>
        </div>
        
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Loading trending videos...</p>
        </div>
        
        <div class="error-message" id="error-message"></div>
        
        <div id="videos"></div>
    </div>

    <div class="player-container" id="playerContainer">
        <div class="player-content">
            <div class="player-header">
                <h3 class="player-title" id="playerTitle">Video Title</h3>
                <button class="close-player" id="closePlayer">&times;</button>
            </div>
            <div class="video-player" id="videoPlayer">
                <!-- YouTube iframe will be inserted here -->
            </div>
            <div class="player-info">
                <div class="player-channel" id="playerChannel">Channel Name</div>
                <div class="player-description" id="playerDescription">Video description will appear here.</div>
            </div>
        </div>
    </div>

    <script>
        // YouTube Data API key from your previous code
        const apiKey = '';
        
        // Global variables
        let currentVideos = [];
        
        // Explore trends function - uses YouTube Data API v3
        function exploreTrends() {
            const country = document.getElementById('country').value;
            const category = document.getElementById('category').value;
            const results = document.getElementById('results').value;
            
            // Show loading indicator
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
            
            // Build API URL for trending videos
            let url = `https://api.laxmannepal.com.np/youtube/videos?part=snippet,statistics,contentDetails&chart=mostPopular&regionCode=${country}&maxResults=${results}&key=${apiKey}`;
            
            if (category !== '0') {
                url += `&videoCategoryId=${category}`;
            }
            
            // Fetch trending videos from YouTube Data API
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    
                    if (data.items && data.items.length > 0) {
                        currentVideos = data.items;
                        displayVideos(currentVideos);
                    } else {
                        showError('No trending videos found for the selected criteria. Trying sample data...');
                        // Fallback to sample data
                        currentVideos = getSampleData(country);
                        displayVideos(currentVideos);
                    }
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    console.error('Error fetching data:', error);
                    showError('Failed to load trending videos. Showing sample data instead.');
                    
                    // Fallback to sample data
                    currentVideos = getSampleData(country);
                    displayVideos(currentVideos);
                });
        }
        
        // Display videos in the UI
        function displayVideos(videos) {
            const videosContainer = document.getElementById('videos');
            videosContainer.innerHTML = ''; // Clear previous results

            videos.forEach(video => {
                const videoElement = createVideoElement(video);
                videosContainer.appendChild(videoElement);
            });
        }
        
        // Create HTML element for a video
        function createVideoElement(videoData) {
            const videoElement = document.createElement('div');
            videoElement.classList.add('video');
            
            const snippet = videoData.snippet;
            const statistics = videoData.statistics || {};
            const contentDetails = videoData.contentDetails || {};
            
            const thumbnailUrl = snippet.thumbnails.medium.url;
            const videoTitle = snippet.title;
            const channelTitle = snippet.channelTitle;
            const publishDate = new Date(snippet.publishedAt).toLocaleDateString();
            const viewCount = statistics.viewCount ? formatNumber(statistics.viewCount) : 'N/A';
            const likeCount = statistics.likeCount ? formatNumber(statistics.likeCount) : 'N/A';
            const duration = contentDetails.duration ? formatDuration(contentDetails.duration) : 'N/A';
            
            videoElement.innerHTML = `
                <img src="${thumbnailUrl}" alt="${videoTitle}" class="thumbnail">
                <div class="video-info">
                    <div class="video-title">${videoTitle}</div>
                    <div class="video-channel">${channelTitle}</div>
                    <div class="video-stats">
                        <span><i class="fas fa-eye"></i> ${viewCount}</span>
                        <span><i class="fas fa-thumbs-up"></i> ${likeCount}</span>
                    </div>
                    <div class="video-date">Published: ${publishDate}</div>
                </div>
            `;
            
            // Add click event to play the video
            videoElement.addEventListener('click', function() {
                playVideo(videoData);
            });
            
            return videoElement;
        }
        
        // Play video in the embedded player
        function playVideo(videoData) {
            const playerContainer = document.getElementById('playerContainer');
            const playerTitle = document.getElementById('playerTitle');
            const playerChannel = document.getElementById('playerChannel');
            const playerDescription = document.getElementById('playerDescription');
            const videoPlayer = document.getElementById('videoPlayer');
            
            // Set video information
            playerTitle.textContent = videoData.snippet.title;
            playerChannel.textContent = videoData.snippet.channelTitle;
            playerDescription.textContent = videoData.snippet.description || 'No description available.';
            
            // Create the YouTube iframe player
            videoPlayer.innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/${videoData.id}?autoplay=1&rel=0" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
            
            // Show the player
            playerContainer.style.display = 'flex';
            
            // Add event listener to close button
            document.getElementById('closePlayer').onclick = function() {
                playerContainer.style.display = 'none';
                // Stop the video when closing
                videoPlayer.innerHTML = '';
            };
            
            // Close player when clicking outside the content
            playerContainer.onclick = function(event) {
                if (event.target === playerContainer) {
                    playerContainer.style.display = 'none';
                    videoPlayer.innerHTML = '';
                }
            };
        }
        
        // Show error message
        function showError(message) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
        
        // Format large numbers with commas
        function formatNumber(num) {
            return parseInt(num).toLocaleString();
        }
        
        // Format duration from ISO 8601
        function formatDuration(duration) {
            const match = duration.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
            
            if (!match) return 'N/A';
            
            const hours = (match[1] || '').replace('H', '');
            const minutes = (match[2] || '').replace('M', '');
            const seconds = (match[3] || '').replace('S', '');
            
            let result = '';
            
            if (hours) result += `${hours}:`;
            if (minutes) result += `${minutes.padStart(2, '0')}:`;
            else result += '00:';
            
            if (seconds) result += seconds.padStart(2, '0');
            else result += '00';
            
            return result;
        }
        
        // Sample data for fallback
        function getSampleData(country) {
            if (country === 'NP') {
                return [
                    {
                        id: 'nepal1',
                        snippet: {
                            title: 'Nepali Traditional Music Performance',
                            channelTitle: 'Nepali Culture Channel',
                            publishedAt: new Date().toISOString(),
                            thumbnails: {
                                medium: {
                                    url: 'https://via.placeholder.com/320x180/DC143C/ffffff?text=Nepali+Music'
                                }
                            },
                            description: 'Traditional Nepali folk music performance with beautiful Himalayan scenery.'
                        },
                        statistics: {
                            viewCount: '1250000',
                            likeCount: '65000'
                        },
                        contentDetails: {
                            duration: 'PT8M45S'
                        }
                    },
                    {
                        id: 'nepal2',
                        snippet: {
                            title: 'Exploring Kathmandu - Travel Vlog',
                            channelTitle: 'Nepal Travel Guide',
                            publishedAt: new Date(Date.now() - 86400000).toISOString(),
                            thumbnails: {
                                medium: {
                                    url: 'https://via.placeholder.com/320x180/003893/ffffff?text=Kathmandu+Tour'
                                }
                            },
                            description: 'A day exploring the ancient temples and streets of Kathmandu.'
                        },
                        statistics: {
                            viewCount: '980000',
                            likeCount: '42000'
                        },
                        contentDetails: {
                            duration: 'PT22M15S'
                        }
                    }
                ];
            } else {
                return [
                    {
                        id: 'sample1',
                        snippet: {
                            title: 'Sample Video 1 - Amazing Tech Review',
                            channelTitle: 'Tech Channel',
                            publishedAt: new Date().toISOString(),
                            thumbnails: {
                                medium: {
                                    url: 'https://via.placeholder.com/320x180/ff0000/ffffff?text=Tech+Video'
                                }
                            },
                            description: 'This is a sample video description for demonstration purposes.'
                        },
                        statistics: {
                            viewCount: '1500000',
                            likeCount: '75000'
                        },
                        contentDetails: {
                            duration: 'PT15M30S'
                        }
                    },
                    {
                        id: 'sample2',
                        snippet: {
                            title: 'Sample Video 2 - Cooking Tutorial',
                            channelTitle: 'Cooking Channel',
                            publishedAt: new Date(Date.now() - 86400000).toISOString(),
                            thumbnails: {
                                medium: {
                                    url: 'https://via.placeholder.com/320x180/00ff00/ffffff?text=Cooking+Video'
                                }
                            },
                            description: 'This is a sample video description for demonstration purposes.'
                        },
                        statistics: {
                            viewCount: '850000',
                            likeCount: '42000'
                        },
                        contentDetails: {
                            duration: 'PT22M15S'
                        }
                    }
                ];
            }
        }
        
        // Load trends when page loads
        document.addEventListener('DOMContentLoaded', function() {
            exploreTrends();
        });
    </script>
</body>
</html>

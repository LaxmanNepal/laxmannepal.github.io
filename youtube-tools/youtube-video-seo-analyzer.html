<body>
    <div class="container">
        <div class="card">
            <h1><i class="fab fa-youtube" style="margin-right: 10px;"></i> Advanced YouTube Video SEO Analyzer</h1>
            
            <div class="api-quota">
                <i class="fas fa-info-circle"></i> This tool uses the YouTube Data API. Free tier allows approximately 100 requests per day.
            </div>
            
            <div class="input-section">
                <label for="videoUrlInput">Enter YouTube Video URL:</label>
                <input type="text" id="videoUrlInput" placeholder="e.g., https://www.youtube.com/watch?v=your_video_id">
                <button onclick="analyzeVideoSEO()" id="analyzeButton">
                    <i class="fas fa-chart-line"></i> Analyze SEO
                </button>
            </div>
            
            <div class="loading" id="loadingIndicator">
                <div class="loading-spinner"></div>
                <p>Fetching data from YouTube API and generating comprehensive analysis...</p>
            </div>
            
            <div id="apiStatus"></div>
        </div>
        
        <div id="seoAnalysisResult"></div>
    </div>

    <script>
        // YouTube Data API is accessed through the central Laxman Nepal API.
        const API_BASE = (window.LAXMAN_YOUTUBE_API_BASE || 'https://api.laxmannepal.com.np/youtube').replace(/\\/$/, '');

        async function apiFetch(path, params = {}) {
            const query = new URLSearchParams(params);
            const url = API_BASE + path + (query.toString() ? '?' + query.toString() : '');
            const response = await fetch(url, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });

            let data = {};
            try { data = await response.json(); } catch (_) {}

            if (!response.ok) {
                throw new Error(data.error || `YouTube service returned HTTP ${response.status}.`);
            }
            return data;
        }

        function updateApiStatus(message, type) {
            const apiStatus = document.getElementById('apiStatus');
            apiStatus.innerHTML = `<div class="api-status ${type}"><i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i> ${message}</div>`;
        }

        async function analyzeVideoSEO() {
            const videoUrlInput = document.getElementById('videoUrlInput').value.trim();
            const loadingIndicator = document.getElementById('loadingIndicator');
            const seoAnalysisResult = document.getElementById('seoAnalysisResult');
            const analyzeButton = document.getElementById('analyzeButton');

            if (!isValidYouTubeUrl(videoUrlInput)) {
                alert('Please enter a valid YouTube video URL.');
                return;
            }

            // Show loading indicator and disable button
            loadingIndicator.style.display = 'block';
            analyzeButton.disabled = true;
            analyzeButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';
            seoAnalysisResult.innerHTML = '';
            updateApiStatus('Connecting to YouTube API...', '');

            const videoId = extractVideoId(videoUrlInput);

            try {
                // Fetch video data from YouTube API
                const videoData = await fetchVideoData(videoId);
                
                if (videoData.error) {
                    throw new Error(videoData.error);
                }

                // Fetch channel data for additional insights
                const channelData = await fetchChannelData(videoData.snippet.channelId);
                
                // Fetch related videos for competitor analysis
                const relatedVideos = await fetchRelatedVideos(videoId);
                
                loadingIndicator.style.display = 'none';
                analyzeButton.disabled = false;
                analyzeButton.innerHTML = '<i class="fas fa-chart-line"></i> Analyze SEO';
                
                updateApiStatus('Successfully fetched data from YouTube API', 'success');
                
                displaySEOAnalysis(videoData, channelData, relatedVideos, videoUrlInput, videoId);
            } catch (error) {
                loadingIndicator.style.display = 'none';
                analyzeButton.disabled = false;
                analyzeButton.innerHTML = '<i class="fas fa-chart-line"></i> Analyze SEO';
                
                updateApiStatus(`API Error: ${error.message}`, 'error');
                
                seoAnalysisResult.innerHTML = `
                    <div class="error-message">
                        <h3><i class="fas fa-exclamation-triangle"></i> Error Fetching Data</h3>
                        <p>${error.message}</p>
                        <p>Please check your URL or try again later. If the problem persists, the YouTube API quota may have been exceeded.</p>
                    </div>
                `;
            }
        }

        async function fetchVideoData(videoId) {
            const data = await apiFetch('/videos', {
                part: 'snippet,statistics,contentDetails,player,topicDetails',
                id: videoId
            });

            if (!data.items || data.items.length === 0) {
                throw new Error('No video found with the provided ID');
            }

            return data.items[0];
        }

        async function fetchChannelData(channelId) {
            try {
                const data = await apiFetch('/channels', {
                    part: 'snippet,statistics,brandingSettings',
                    id: channelId

                });

        function isValidYouTubeUrl(url) {
            const pattern = /^(https?\:\/\/)?(www\.youtube\.com|youtu\.?be)\/.+$/;
            return pattern.test(url);
        }

        function extractVideoId(url) {
            // Handle various YouTube URL formats
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[7].length === 11) ? match[7] : null;
        }

        function formatDuration(duration) {
            // Parse ISO 8601 duration format (PT#H#M#S)
            const match = duration.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
            if (!match) return 'Unknown';
            
            const hours = (match[1] || '').replace('H', '');
            const minutes = (match[2] || '').replace('M', '');
            const seconds = (match[3] || '').replace('S', '');
            
            let result = '';
            if (hours) result += `${hours}h `;
            if (minutes) result += `${minutes}m `;
            if (seconds) result += `${seconds}s`;
            
            return result.trim() || '0s';
        }

        function formatCount(count) {
            if (!count) return '0';
            
            const num = parseInt(count);
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        function calculateEngagementRate(statistics) {
            const views = parseInt(statistics.viewCount) || 0;
            const likes = parseInt(statistics.likeCount) || 0;
            const comments = parseInt(statistics.commentCount) || 0;
            
            if (views === 0) return 0;
            
            return ((likes + comments) / views * 100).toFixed(2);
        }

        function calculatePerformanceScore(statistics, publishedAt) {
            const views = parseInt(statistics.viewCount) || 0;
            const likes = parseInt(statistics.likeCount) || 0;
            const comments = parseInt(statistics.commentCount) || 0;
            
            // Calculate days since publication
            const publishDate = new Date(publishedAt);
            const currentDate = new Date();
            const daysSincePublish = Math.floor((currentDate - publishDate) / (1000 * 60 * 60 * 24));
            
            if (daysSincePublish === 0) return 0;
            
            // Calculate daily averages
            const dailyViews = views / daysSincePublish;
            const dailyLikes = likes / daysSincePublish;
            const dailyComments = comments / daysSincePublish;
            
            // Normalize scores (these thresholds can be adjusted)
            const viewScore = Math.min(dailyViews / 1000, 100);
            const likeScore = Math.min(dailyLikes / 50, 100);
            const commentScore = Math.min(dailyComments / 10, 100);
            
            // Weighted average
            return Math.round((viewScore * 0.5) + (likeScore * 0.3) + (commentScore * 0.2));
        }

        function generateContentGapAnalysis(videoData, relatedVideos) {
            const gaps = [];
            const snippet = videoData.snippet;
            
            // Check title length
            if (snippet.title.length < 50) {
                gaps.push({
                    type: 'title',
                    issue: 'Title is too short',
                    recommendation: 'Expand title to 50-60 characters for better SEO',
                    priority: 'high'
                });
            } else if (snippet.title.length > 60) {
                gaps.push({
                    type: 'title',
                    issue: 'Title is too long',
                    recommendation: 'Shorten title to 50-60 characters for optimal display',
                    priority: 'medium'
                });
            }
            
            // Check description
            if (!snippet.description || snippet.description.length < 200) {
                gaps.push({
                    type: 'description',
                    issue: 'Description is too short',
                    recommendation: 'Expand description to at least 200-300 characters with relevant keywords',
                    priority: 'high'
                });
            }
            
            // Check tags
            if (!snippet.tags || snippet.tags.length < 5) {
                gaps.push({
                    type: 'tags',
                    issue: 'Insufficient tags',
                    recommendation: 'Add 5-15 relevant tags to improve discoverability',
                    priority: 'medium'
                });
            }
            
            // Check for timestamps in description
            if (!snippet.description || !snippet.description.match(/\d+:\d+/)) {
                gaps.push({
                    type: 'description',
                    issue: 'No timestamps found',
                    recommendation: 'Add timestamps to improve user experience and retention',
                    priority: 'medium'
                });
            }
            
            // Compare with related videos
            if (relatedVideos && relatedVideos.length > 0) {
                const avgTitleLength = relatedVideos.reduce((sum, video) => sum + video.snippet.title.length, 0) / relatedVideos.length;
                if (snippet.title.length < avgTitleLength * 0.8) {
                    gaps.push({
                        type: 'title',
                        issue: 'Title shorter than competitors',
                        recommendation: `Competitor titles average ${Math.round(avgTitleLength)} characters - consider expanding yours`,
                        priority: 'medium'
                    });
                }
            }
            
            return gaps;
        }

        function generateKeywordResearch(snippet) {
            const title = snippet.title;
            const description = snippet.description || '';
            const tags = snippet.tags || [];
            
            // Extract keywords from title
            const titleWords = title.toLowerCase().split(/\s+/).filter(word => word.length > 3);
            
            // Extract keywords from description (first 200 chars)
            const descPreview = description.substring(0, 200).toLowerCase();
            const descWords = descPreview.split(/\s+/).filter(word => word.length > 3);
            
            // Combine and count frequency
            const allWords = [...titleWords, ...descWords, ...tags];
            const wordFrequency = {};
            allWords.forEach(word => {
                wordFrequency[word] = (wordFrequency[word] || 0) + 1;
            });
            
            // Get top keywords
            const topKeywords = Object.entries(wordFrequency)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10)
                .map(entry => entry[0]);
            
            // Generate related keywords
            const keywordSuggestions = {};
            topKeywords.forEach(keyword => {
                const prefixes = ['how to', 'best', 'top', 'easy', 'quick', 'simple', 'advanced'];
                const suffixes = ['tutorial', 'guide', 'tips', 'tricks', 'techniques', 'for beginners'];
                
                const suggestions = [];
                
                // Add prefixes
                prefixes.forEach(prefix => {
                    suggestions.push(`${prefix} ${keyword}`);
                });
                
                // Add suffixes
                suffixes.forEach(suffix => {
                    suggestions.push(`${keyword} ${suffix}`);
                });
                
                // Add question formats
                suggestions.push(`what is ${keyword}`);
                suggestions.push(`how does ${keyword} work`);
                
                keywordSuggestions[keyword] = suggestions.slice(0, 8);
            });
            
            return {
                primaryKeywords: topKeywords,
                suggestions: keywordSuggestions,
                searchVolume: topKeywords.reduce((acc, keyword) => {
                    acc[keyword] = Math.floor(Math.random() * 50000) + 5000;
                    return acc;
                }, {}),
                competition: topKeywords.reduce((acc, keyword) => {
                    acc[keyword] = (Math.random() * 0.8 + 0.2).toFixed(2);
                    return acc;
                }, {})
            };
        }

        function calculateSEOScore(snippet, statistics, contentDetails) {
            let totalScore = 0;
            let maxScore = 0;
            
            const scores = {
                title: { score: 0, weight: 15 },
                description: { score: 0, weight: 20 },
                tags: { score: 0, weight: 10 },
                engagement: { score: 0, weight: 25 },
                metadata: { score: 0, weight: 10 },
                performance: { score: 0, weight: 20 }
            };
            
            // Title score (optimal 50-60 characters)
            const titleLength = snippet.title ? snippet.title.length : 0;
            if (titleLength >= 50 && titleLength <= 60) {
                scores.title.score = 100;
            } else if (titleLength >= 40 && titleLength <= 70) {
                scores.title.score = 80;
            } else if (titleLength >= 30 && titleLength <= 80) {
                scores.title.score = 60;
            } else {
                scores.title.score = 30;
            }
            
            // Description score (optimal > 250 characters)
            const descLength = snippet.description ? snippet.description.length : 0;
            if (descLength > 500) {
                scores.description.score = 100;
            } else if (descLength > 300) {
                scores.description.score = 85;
            } else if (descLength > 200) {
                scores.description.score = 70;
            } else if (descLength > 100) {
                scores.description.score = 50;
            } else {
                scores.description.score = 20;
            }
            
            // Tags score (optimal: 5-15 tags)
            const tagCount = snippet.tags ? snippet.tags.length : 0;
            if (tagCount >= 8 && tagCount <= 15) {
                scores.tags.score = 100;
            } else if (tagCount >= 5 && tagCount <= 20) {
                scores.tags.score = 80;
            } else if (tagCount >= 3 && tagCount <= 25) {
                scores.tags.score = 60;
            } else if (tagCount > 0) {
                scores.tags.score = 40;
            } else {
                scores.tags.score = 0;
            }
            
            // Engagement score
            const viewCount = statistics.viewCount ? parseInt(statistics.viewCount) : 0;
            const likeCount = statistics.likeCount ? parseInt(statistics.likeCount) : 0;
            const commentCount = statistics.commentCount ? parseInt(statistics.commentCount) : 0;
            
            if (viewCount > 0) {
                const likeRatio = likeCount / viewCount;
                const commentRatio = commentCount / viewCount;
                const engagementRate = calculateEngagementRate(statistics);
                
                let engagementScore = 0;
                
                if (likeRatio > 0.05) {
                    engagementScore += 50;
                } else if (likeRatio > 0.03) {
                    engagementScore += 40;
                } else if (likeRatio > 0.01) {
                    engagementScore += 30;
                } else {
                    engagementScore += 15;
                }
                
                if (commentRatio > 0.01) {
                    engagementScore += 30;
                } else if (commentRatio > 0.005) {
                    engagementScore += 20;
                } else if (commentRatio > 0.001) {
                    engagementScore += 15;
                } else {
                    engagementScore += 10;
                }
                
                if (engagementRate > 5) {
                    engagementScore += 20;
                } else if (engagementRate > 3) {
                    engagementScore += 15;
                } else if (engagementRate > 1) {
                    engagementScore += 10;
                } else {
                    engagementScore += 5;
                }
                
                scores.engagement.score = engagementScore;
            } else {
                scores.engagement.score = 0;
            }
            
            // Performance score
            scores.performance.score = calculatePerformanceScore(statistics, snippet.publishedAt);
            
            // Metadata score
            let metadataScore = 0;
            if (snippet.thumbnails && snippet.thumbnails.standard) metadataScore += 25;
            if (snippet.categoryId) metadataScore += 25;
            if (snippet.tags && snippet.tags.length > 0) metadataScore += 25;
            if (snippet.description && snippet.description.length > 100) metadataScore += 25;
            scores.metadata.score = metadataScore;
            
            // Calculate total weighted score
            for (const category in scores) {
                totalScore += scores[category].score * (scores[category].weight / 100);
                maxScore += 100 * (scores[category].weight / 100);
            }
            
            const finalScore = Math.round(totalScore);
            
            return {
                overall: finalScore,
                breakdown: scores,
                engagementRate: calculateEngagementRate(statistics),
                performanceScore: scores.performance.score
            };
        }

                                <div class="analysis-icon">
                                    <i class="fas fa-comment"></i>
                                </div>
                                <div class="analysis-title">Comment Ratio</div>
                                <div class="analysis-value">${statistics.viewCount && statistics.commentCount ? (parseInt(statistics.commentCount) / parseInt(statistics.viewCount) * 100).toFixed(2) : 0}%</div>
                                <div class="analysis-description">Percentage of viewers who commented</div>
                            </div>
                            
                            <div class="analysis-card">
                                <div class="analysis-icon">
                                    <i class="fas fa-share"></i>
                                </div>
                                <div class="analysis-title">Shareability Score</div>
                                <div class="analysis-value">${Math.min(100, Math.round((parseInt(statistics.likeCount || 0) + parseInt(statistics.commentCount || 0)) / Math.max(1, parseInt(statistics.viewCount || 0)) * 1000))}/100</div>
                                <div class="analysis-description">Likelihood of viewers sharing</div>
                            </div>
                        </div>
                        
                        <h3>Engagement Metrics</h3>
                        <div class="charts-container">
                            <div class="chart-card">
                                <div class="chart-container">
                                    <canvas id="engagementChart"></canvas>
                                </div>
                            </div>
                            <div class="chart-card">
                                <div class="chart-container">
                                    <canvas id="ratioChart"></canvas>
                                </div>
                            </div>
                        </div>
                        
                        <h3>Performance Over Time</h3>
                        <div class="progress-bars">
                            <div class="progress-item">
                                <div class="progress-label">
                                    <span>Initial Performance (First 48 hours)</span>
                                    <span>${seoScore.performanceScore >= 70 ? 'Excellent' : seoScore.performanceScore >= 50 ? 'Good' : 'Needs Improvement'}</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill ${seoScore.performanceScore >= 70 ? 'progress-excellent' : seoScore.performanceScore >= 50 ? 'progress-good' : 'progress-poor'}" 
                                         style="width: ${seoScore.performanceScore}%"></div>
                                </div>
                            </div>
                            
                            <div class="progress-item">
                                <div class="progress-label">
                                    <span>Sustained Performance (First 30 days)</span>
                                    <span>${seoScore.overall >= 70 ? 'Excellent' : seoScore.overall >= 50 ? 'Good' : 'Needs Improvement'}</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill ${seoScore.overall >= 70 ? 'progress-excellent' : seoScore.overall >= 50 ? 'progress-good' : 'progress-poor'}" 
                                         style="width: ${seoScore.overall}%"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="keywords" class="tab-content">
                        <div class="keyword-research">
                            <h3><i class="fas fa-search"></i> Keyword Research & Search Terms</h3>
                            <p>Based on your video content, here are relevant keywords and search terms that viewers might use to find content like yours.</p>
                            
                            <div class="keyword-tabs">
                                <div class="keyword-tab active" onclick="switchKeywordTab('primaryKeywords')">Primary Keywords</div>
                                <div class="keyword-tab" onclick="switchKeywordTab('longTail')">Long-Tail Keywords</div>
                                <div class="keyword-tab" onclick="switchKeywordTab('questions')">Question-Based</div>
                            </div>
                            
                            <div id="primaryKeywords" class="keyword-content active">
                                <h4>Primary Keywords</h4>
                                <p>These are the main keywords extracted from your video title, description, and tags.</p>
                                
                                <div class="keyword-grid">
                                    ${keywordResearch.primaryKeywords.map(keyword => `
                                        <div class="keyword-card">
                                            <div class="keyword-main">${keyword}</div>
                                            <div class="keyword-suggestions">
                                                ${keywordResearch.suggestions[keyword].map(suggestion => `
                                                    <span class="keyword-suggestion">${suggestion}</span>
                                                `).join('')}
                                            </div>
                                            <div class="keyword-metrics">
                                                <span>Search Volume: ${keywordResearch.searchVolume[keyword].toLocaleString()}</span>
                                                <span>Competition: ${keywordResearch.competition[keyword]}</span>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <div id="longTail" class="keyword-content">
                                <h4>Long-Tail Keywords</h4>
                                <p>These are more specific, longer keyword phrases that often have higher conversion rates.</p>
                                
                                <div class="tags-container">
                                    ${keywordResearch.primaryKeywords.flatMap(keyword => 
                                        keywordResearch.suggestions[keyword].slice(0, 3)
                                    ).map(term => `
                                        <span class="tag">${term}</span>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <div id="questions" class="keyword-content">
                                <h4>Question-Based Searches</h4>
                                <p>These are questions that viewers might ask related to your video content.</p>
                                
                                <div class="tags-container">
                                    ${[
                                        'how to ' + keywordResearch.primaryKeywords[0],
                                        'what is ' + keywordResearch.primaryKeywords[0],
                                        'why use ' + keywordResearch.primaryKeywords[0],
                                        'best way to ' + keywordResearch.primaryKeywords[0],
                                        keywordResearch.primaryKeywords[0] + ' for beginners',
                                        'advanced ' + keywordResearch.primaryKeywords[0],
                                        keywordResearch.primaryKeywords[0] + ' tutorial',
                                        'how does ' + keywordResearch.primaryKeywords[0] + ' work'
                                    ].map(question => `
                                        <span class="tag">${question}?</span>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                        
                        <h3>Keyword Optimization Tips</h3>
                        <div class="recommendations">
                            <ul>
                                <li>Include your primary keywords in your video title, preferably at the beginning</li>
                                <li>Use 2-3 of your top keywords in the first 150 characters of your description</li>
                                <li>Add relevant keywords to your video tags</li>
                                <li>Create custom thumbnails that visually represent your main keywords</li>
                                <li>Use question-based keywords in your video content to answer viewer queries</li>
                                <li>Monitor your video performance for these keywords in YouTube Analytics</li>
                                <li>Create follow-up videos based on your most successful keywords</li>
                            </ul>
                        </div>
                    </div>
                    
                    <div id="competitors" class="tab-content">
                        <h3>Competitor Analysis</h3>
                        <p>Comparison with similar videos in your niche to identify opportunities and benchmarks.</p>
                        
                        ${relatedVideos && relatedVideos.length > 0 ? `
                        <div class="competitor-analysis">
                            <h4>Top Related Videos</h4>
                            <p>These videos are ranking for similar keywords and topics.</p>
                            
                            ${relatedVideos.map((video, index) => `
                                <div class="competitor-card">
                                    <img src="${video.snippet.thumbnails.medium.url}" alt="${video.snippet.title}" class="competitor-thumbnail">
                                    <div class="competitor-info">
                                        <div class="competitor-title">${video.snippet.title}</div>
                                        <div class="competitor-stats">
                                            <span>Channel: ${video.snippet.channelTitle}</span>
                                            <span>Published: ${new Date(video.snippet.publishedAt).toLocaleDateString()}</span>
                                        </div>
                                    </div>
                                    <div style="text-align: center;">
                                        <div style="font-weight: 700; font-size: 1.1rem;">#${index + 1}</div>
                                        <div style="font-size: 0.8rem; color: var(--gray);">Rank</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        ` : '<p>No competitor data available at this time.</p>'}
                        
                        <h3>Competitive Insights</h3>
                        <div class="analysis-grid">
                            <div class="analysis-card">
                                <div class="analysis-icon">
                                    <i class="fas fa-bullseye"></i>
                                </div>
                                <div class="analysis-title">Competitive Position</div>
                                <div class="analysis-value">${seoScore.overall >= 70 ? 'Strong' : seoScore.overall >= 50 ? 'Moderate' : 'Weak'}</div>
                                <div class="analysis-description">Your position relative to competitors</div>
                            </div>
                            
                            <div class="analysis-card">
                                <div class="analysis-icon">
                                    <i class="fas fa-chart-bar"></i>
                                </div>
                                <div class="analysis-title">Market Saturation</div>
                                <div class="analysis-value">${seoScore.overall >= 70 ? 'Low' : 'Medium'}</div>
                                <div class="analysis-description">Competition level in your niche</div>
                            </div>
                            
                            <div class="analysis-card">
                                <div class="analysis-icon">
                                    <i class="fas fa-lightbulb"></i>
                                </div>
                                <div class="analysis-title">Opportunity Score</div>
                                <div class="analysis-value">${100 - seoScore.overall}/100</div>
                                <div class="analysis-description">Potential for improvement</div>
                            </div>
                            
                            <div class="analysis-card">
                                <div class="analysis-icon">
                                    <i class="fas fa-trending-up"></i>
                                </div>
                                <div class="analysis-title">Growth Trend</div>
                                <div class="analysis-value">${seoScore.performanceScore >= 70 ? 'Rapid' : seoScore.performanceScore >= 50 ? 'Steady' : 'Slow'}</div>
                                <div class="analysis-description">Current performance trajectory</div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="recommendations" class="tab-content">
                        <h3>Actionable SEO Recommendations</h3>
                        <p>Specific steps you can take to improve your video's SEO performance.</p>
                        
                        <div class="recommendations">
                            <h4>Immediate Actions (High Impact)</h4>
                            <ul>
                                ${seoScore.breakdown.title.score < 80 ? `
                                <li><strong>Optimize Your Title:</strong> ${snippet.title.length < 50 ? 'Expand your title to 50-60 characters with primary keywords at the beginning' : 'Shorten your title to 50-60 characters while keeping important keywords'}</li>
                                ` : ''}
                                
                                ${seoScore.breakdown.description.score < 80 ? `
                                <li><strong>Enhance Your Description:</strong> Expand your description to at least 250-300 characters with relevant keywords, timestamps, and links</li>
                                ` : ''}
                                
                                ${seoScore.breakdown.tags.score < 80 ? `
                                <li><strong>Improve Your Tags:</strong> ${!snippet.tags || snippet.tags.length < 5 ? 'Add 5-15 relevant tags including variations of your main keywords' : 'Review and refine your tags to focus on the most relevant keywords'}</li>
                                ` : ''}
                                
                                ${seoScore.engagementRate < 3 ? `
                                <li><strong>Boost Engagement:</strong> Add clear calls-to-action in your video and description to encourage likes and comments</li>
                                ` : ''}
                                
                                <li><strong>Thumbnail Optimization:</strong> Create a custom thumbnail with high contrast, minimal text, and visual appeal</li>
                            </ul>
                            
                            <h4>Strategic Improvements (Medium Impact)</h4>
                            <ul>
                                <li><strong>Content Upgrades:</strong> Add timestamps, chapters, and end screens to improve viewer experience</li>
                                <li><strong>Keyword Expansion:</strong> Create follow-up videos targeting the suggested long-tail keywords</li>
                                <li><strong>Cross-Promotion:</strong> Share your video across relevant platforms and communities</li>
                                <li><strong>Audience Interaction:</strong> Respond to comments and create community posts to build engagement</li>
                            </ul>
                            
                            <h4>Long-Term Strategy (Sustained Impact)</h4>
                            <ul>
                                <li><strong>Content Series:</strong> Develop a series of related videos to build a loyal audience</li>
                                <li><strong>SEO Monitoring:</strong> Regularly track your video performance and adjust your strategy</li>
                                <li><strong>Competitor Analysis:</strong> Continuously monitor top-performing videos in your niche</li>
                                <li><strong>Algorithm Alignment:</strong> Stay updated with YouTube algorithm changes and best practices</li>
                            </ul>
                        </div>
                        
                        <h3>Implementation Timeline</h3>
                        <div class="progress-bars">
                            <div class="progress-item">
                                <div class="progress-label">
                                    <span>Week 1: Immediate Optimizations</span>
                                    <span>High Priority</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill progress-excellent" style="width: 25%"></div>
                                </div>
                            </div>
                            
                            <div class="progress-item">
                                <div class="progress-label">
                                    <span>Weeks 2-4: Strategic Improvements</span>
                                    <span>Medium Priority</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill progress-good" style="width: 50%"></div>
                                </div>
                            </div>
                            
                            <div class="progress-item">
                                <div class="progress-label">
                                    <span>Month 2+: Long-Term Strategy</span>
                                    <span>Ongoing</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill progress-average" style="width: 75%"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Display charts
            displayCharts(statistics, seoScore);
        }

        function displayCharts(statistics, seoScore) {
            // Performance Metrics Chart
            const performanceCtx = document.getElementById('performanceChart').getContext('2d');
            new Chart(performanceCtx, {
                type: 'bar',
                data: {
                    labels: ['Views', 'Likes', 'Comments'],
                    datasets: [{
                        label: 'Count',
                        data: [
                            statistics.viewCount ? parseInt(statistics.viewCount) : 0,
                            statistics.likeCount ? parseInt(statistics.likeCount) : 0,
                            statistics.commentCount ? parseInt(statistics.commentCount) : 0
                        ],
                        backgroundColor: [
                            'rgba(54, 162, 235, 0.7)',
                            'rgba(75, 192, 192, 0.7)',
                            'rgba(153, 102, 255, 0.7)',
                        ],
                        borderColor: [
                            'rgba(54, 162, 235, 1)',
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)',
                        ],
                        borderWidth: 1,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    if (value >= 1000000) {
                                        return (value / 1000000).toFixed(1) + 'M';
                                    } else if (value >= 1000) {
                                        return (value / 1000).toFixed(1) + 'K';
                                    }
                                    return value;
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });

            // SEO Score Breakdown Chart
            const seoBreakdownCtx = document.getElementById('seoBreakdownChart').getContext('2d');
            new Chart(seoBreakdownCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Title', 'Description', 'Tags', 'Engagement', 'Performance', 'Metadata'],
                    datasets: [{
                        data: [
                            seoScore.breakdown.title.score,
                            seoScore.breakdown.description.score,
                            seoScore.breakdown.tags.score,
                            seoScore.breakdown.engagement.score,
                            seoScore.breakdown.performance.score,
                            seoScore.breakdown.metadata.score
                        ],
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.7)',
                            'rgba(54, 162, 235, 0.7)',
                            'rgba(255, 206, 86, 0.7)',
                            'rgba(75, 192, 192, 0.7)',
                            'rgba(153, 102, 255, 0.7)',
                            'rgba(255, 159, 64, 0.7)'
                        ],
                        borderColor: [
                            'rgba(255, 99, 132, 1)',
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 206, 86, 1)',
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)',
                            'rgba(255, 159, 64, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });

            // Engagement Chart
            const engagementCtx = document.getElementById('engagementChart').getContext('2d');
            new Chart(engagementCtx, {
                type: 'pie',
                data: {
                    labels: ['Likes', 'Comments', 'Other Engagement'],
                    datasets: [{
                        data: [
                            statistics.likeCount ? parseInt(statistics.likeCount) : 0,
                            statistics.commentCount ? parseInt(statistics.commentCount) : 0,
                            (statistics.viewCount ? parseInt(statistics.viewCount) : 0) - 
                            ((statistics.likeCount ? parseInt(statistics.likeCount) : 0) + 
                             (statistics.commentCount ? parseInt(statistics.commentCount) : 0))
                        ],
                        backgroundColor: [
                            'rgba(75, 192, 192, 0.7)',
                            'rgba(153, 102, 255, 0.7)',
                            'rgba(201, 203, 207, 0.7)'
                        ],
                        borderColor: [
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)',
                            'rgba(201, 203, 207, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });

            // Ratio Chart
            const ratioCtx = document.getElementById('ratioChart').getContext('2d');
            new Chart(ratioCtx, {
                type: 'bar',
                data: {
                    labels: ['Like/View Ratio', 'Comment/View Ratio', 'Engagement Rate'],
                    datasets: [{
                        label: 'Percentage',
                        data: [
                            statistics.viewCount && statistics.likeCount ? (parseInt(statistics.likeCount) / parseInt(statistics.viewCount) * 100).toFixed(2) : 0,
                            statistics.viewCount && statistics.commentCount ? (parseInt(statistics.commentCount) / parseInt(statistics.viewCount) * 100).toFixed(2) : 0,
                            parseFloat(seoScore.engagementRate)
                        ],
                        backgroundColor: [
                            'rgba(75, 192, 192, 0.7)',
                            'rgba(153, 102, 255, 0.7)',
                            'rgba(255, 159, 64, 0.7)'
                        ],
                        borderColor: [
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)',
                            'rgba(255, 159, 64, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function switchTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show the selected tab content
            document.getElementById(tabName).classList.add('active');
            
            // Add active class to the clicked tab
            event.currentTarget.classList.add('active');
        }

        function switchKeywordTab(tabName) {
            // Hide all keyword tab contents
            document.querySelectorAll('.keyword-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all keyword tabs
            document.querySelectorAll('.keyword-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show the selected keyword tab content
            document.getElementById(tabName).classList.add('active');
            
            // Add active class to the clicked keyword tab
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>

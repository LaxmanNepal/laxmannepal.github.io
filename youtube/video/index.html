<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video — Laxman Nepal YouTube</title><meta name="description" content="Watch and explore a Laxman Nepal YouTube video with detailed public statistics."><link rel="canonical" href="https://apps.laxmannepal.com.np/youtube/video/"><style>body{margin:0;font-family:Inter,system-ui,sans-serif;color:#101828;background:radial-gradient(circle at 10% 0,#dbeafe,transparent 35%),radial-gradient(circle at 90% 10%,#ede9fe,transparent 35%),#f5f7fb}.wrap{width:min(1050px,calc(100% - 24px));margin:auto;padding:80px 0}.glass{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(24px);border-radius:28px;box-shadow:0 25px 80px rgba(31,38,50,.12)}.hero{padding:18px}.player{width:100%;aspect-ratio:16/9;border:0;border-radius:20px;background:#0b1020}.meta{padding:24px}.title{font-size:clamp(1.6rem,4vw,2.7rem);margin:0 0 10px;letter-spacing:-.04em}.muted{color:#667085;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{padding:16px;border-radius:18px;background:rgba(255,255,255,.5)}.stat b{display:block;font-size:1.4rem}.stat span{font-size:.75rem;color:#667085}.back{display:inline-block;margin-bottom:18px;color:#1677ff;font-weight:800;text-decoration:none}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.wrap{padding:70px 0}.meta{padding:18px}}</style></head><body><main class="wrap"><a class="back" href="/youtube/">← Back to YouTube</a><section class="glass hero"><div id="app">Loading video…</div></section></main><script>(async()=>{const q=new URLSearchParams(location.search),id=q.get('v');const app=document.getElementById('app');if(!id){app.innerHTML='<div class="meta"><h1 class="title">Video not specified</h1><p class="muted">Choose a video from the YouTube dashboard.</p></div>';return}try{const r=await fetch('/data/youtube.json?v='+Date.now(),{cache:'no-store'}),d=await r.json(),all=[...(d.popularVideos||[]),...(d.recentVideos||[]),...(d.latestVideos||[])],v=all.find(x=>(x.id||x.videoId)===id)||{};const title=v.title||'Laxman Nepal YouTube Video',views=Number(v.views||v.statistics?.viewCount||0),likes=Number(v.likes||v.statistics?.likeCount||0),comments=Number(v.comments||v.statistics?.commentCount||0);document.title=title+' — Laxman Nepal';document.querySelector('meta[name=description]').content=title+' — Laxman Nepal YouTube';app.innerHTML='<iframe class="player" src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'?rel=0" title="'+title.replace(/"/g,'&quot;')+'" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe><div class="meta"><h1 class="title">'+title.replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))+'</h1><p class="muted">Explore the video with cached public YouTube statistics from Laxman Nepal's channel.</p><div class="stats"><div class="stat"><b>'+views.toLocaleString()+'</b><span>Views</span></div><div class="stat"><b>'+likes.toLocaleString()+'</b><span>Likes</span></div><div class="stat"><b>'+comments.toLocaleString()+'</b><span>Comments</span></div><div class="stat"><b>'+(v.publishDate||v.publishedAt||'—').toString().slice(0,10)+'</b><span>Published</span></div></div></div>'}catch(e){app.innerHTML='<div class="meta"><h1 class="title">Unable to load video</h1><p class="muted">The cached YouTube dataset is temporarily unavailable.</p></div>'}})()</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Laxman Nepal YouTube channel dashboard — subscribers, views, videos, popular uploads and channel data."><link rel="canonical" href="https://apps.laxmannepal.com.np/youtube/"><title>Laxman Nepal YouTube — Channel Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:#101828;background:radial-gradient(circle at 10% 0,#dbeafe,transparent 30%),radial-gradient(circle at 90% 10%,#ede9fe,transparent 30%),#f5f7fb}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.glass{background:#ffffff9c;border:1px solid #ffffffdd;backdrop-filter:blur(24px) saturate(170%);box-shadow:0 24px 70px #1f26320d;border-radius:28px}.hero{padding:90px 0 35px}.back{color:#1677ff;font-weight:800;text-decoration:none}.identity{display:flex;gap:20px;align-items:center;margin-top:28px;padding:24px}.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover}.identity h1{margin:0;font-size:clamp(2rem,6vw,4.5rem);letter-spacing:-.06em}.identity p{color:#667085;margin:8px 0}.btn{display:inline-block;padding:13px 17px;border-radius:14px;background:#101828;color:#fff;text-decoration:none;font-weight:800;margin-left:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}.stat{padding:22px}.stat b{display:block;font-size:2rem}.stat span,.muted{color:#667085;font-size:.8rem}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-top:14px}.panel{padding:22px}.panel h2{margin:0 0 18px}.bars{display:flex;align-items:end;gap:8px;height:150px}.bar{flex:1;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#ef4444,#7c3aed,#1677ff);animation:rise .9s cubic-bezier(.22,1,.36,1)}@keyframes rise{from{height:0!important}}.mix{display:flex;gap:40px}.mix b{font-size:2rem;display:block}.progress{height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#7c3aed,#1677ff);border-radius:99px}.videos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.video{border:1px solid #ffffff;background:#ffffffaa;border-radius:22px;overflow:hidden;cursor:pointer;transition:.35s;text-align:left;padding:0}.video:hover{transform:translateY(-7px);box-shadow:0 25px 60px #1f26321a}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.video div{padding:13px}.video b{display:block;line-height:1.4}.video small{display:block;color:#667085;margin-top:7px}.section{margin-top:18px}.footer{padding:45px 0;color:#667085}.modal{position:fixed;inset:0;z-index:10;background:#020617aa;backdrop-filter:blur(16px);display:grid;place-items:center;opacity:0;visibility:hidden;transition:.35s}.modal.open{opacity:1;visibility:visible}.box{width:min(960px,94vw);aspect-ratio:16/9;background:#000;border-radius:24px;padding:5px;position:relative;transform:scale(.9) translateY(25px);transition:.45s cubic-bezier(.22,1,.36,1)}.modal.open .box{transform:none}.box iframe{width:100%;height:100%;border:0;border-radius:19px}.close{position:absolute;right:0;top:-48px;border:0;border-radius:50%;width:40px;height:40px;background:#101828;color:#fff;font-size:24px;cursor:pointer}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.videos{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero{padding-top:70px}.identity{flex-wrap:wrap}.avatar{width:68px;height:68px}.btn{width:100%;margin:0;text-align:center}.stat{padding:15px}.stat b{font-size:1.5rem}.videos{grid-template-columns:1fr}.panel{padding:16px}.box{width:96vw}.close{top:-45px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main class="wrap hero"><a class="back" href="/">← Laxman Nepal</a><section id="app"></section><footer class="footer">Data automatically refreshed from the site's cached YouTube Data API v3 JSON.</footer></main><div id="modal" class="modal"><div class="box"><button class="close">×</button><iframe allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></div><script>const U='/data/youtube.json',app=document.querySelector('#app'),M=document.querySelector('#modal'),I=M.querySelector('iframe'),F=n=>new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(Number(n||0)),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const A=(d,n)=>{for(const k of n)if(Array.isArray(d[k])&&d[k].length)return d[k];return[]};function openVideo(id){I.src=`https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0`;M.classList.add('open')}function close(){M.classList.remove('open');I.src=''}M.onclick=e=>{if(e.target===M||e.target.closest('.close'))close()};fetch(U+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{const c=d.channel||{},s=c.statistics||{},a=d.analysis||{},p=A(d,['popularVideos','topVideos','videos']),r=A(d,['recentVideos','latestVideos','latestUploads']),vals=[a.totalViewsFetched||0,a.totalLikesFetched||0,a.totalCommentsFetched||0,a.videosFetched||0];app.innerHTML=`<section class="identity glass"><img class="avatar" src="${E(c.thumbnail)}"><div><h1>${E(c.title||'Laxman Nepal')}</h1><p>@laxmannepalofficial · ${E(d.dataSource||'YouTube Data API v3')}</p></div><a class="btn" target="_blank" href="https://www.youtube.com/@laxmannepalofficial">Subscribe on YouTube ↗</a></section><div class="stats"><div class="stat glass"><b>${F(s.subscriberCount)}</b><span>Subscribers</span></div><div class="stat glass"><b>${F(s.viewCount)}</b><span>Total views</span></div><div class="stat glass"><b>${F(s.videoCount)}</b><span>Total videos</span></div><div class="stat glass"><b>${F(a.videosFetched)}</b><span>Videos analyzed</span></div></div><div class="grid"><section class="panel glass"><h2>Channel performance</h2><div class="bars">${vals.map(v=>`<i class="bar" style="height:${Math.max(10,Math.min(100,Math.log10(v+1)*18))}%"></i>`).join('')}</div><div class="muted">Views · Likes · Comments · Videos analyzed</div></section><section class="panel glass"><h2>Content mix</h2><div class="mix"><div><b>${F(a.shortsCount)}</b><span class="muted">Shorts</span></div><div><b>${F(a.longFormCount)}</b><span class="muted">Long-form</span></div></div><div class="progress"><i style="width:${a.videosFetched?Math.min(100,a.shortsCount/a.videosFetched*100):0}%"></i></div><p class="muted">Average engagement: ${Number(a.averageEngagementRate||0).toFixed(1)}%</p></section></div><section class="panel glass section"><h2>Popular videos</h2><div class="videos">${p.slice(0,20).map(v=>{const id=v.id||v.videoId;return `<button class="video" data-id="${E(id)}"><img class="thumb" src="${E(v.thumbnail||v.thumbnails?.high?.url||v.thumbnails?.medium?.url||'')}" alt=""><div><b>${E(v.title)}</b><small>${F(v.views??v.statistics?.viewCount)} views · ${F(v.likes??v.statistics?.likeCount)} likes · ${F(v.comments??v.statistics?.commentCount)} comments</small></div></button>`}).join('')}</div></section>${r.length?`<section class="panel glass section"><h2>Latest uploads</h2><div class="videos">${r.slice(0,12).map(v=>{const id=v.id||v.videoId;return `<button class="video" data-id="${E(id)}"><img class="thumb" src="${E(v.thumbnail||v.thumbnails?.high?.url||v.thumbnails?.medium?.url||'')}" alt=""><div><b>${E(v.title)}</b><small>${F(v.views??v.statistics?.viewCount)} views</small></div></button>`}).join('')}</div></section>`:''}`;document.querySelectorAll('.video').forEach(x=>x.onclick=()=>openVideo(x.dataset.id))}).catch(()=>app.innerHTML='<section class="panel glass"><h2>Unable to load YouTube data</h2><p class="muted">Please try again shortly.</p></section>');</script></body></html>

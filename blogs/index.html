<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Laxman Nepal practical tutorials about YouTube, AI, Windows, command-line tools and useful digital workflows.">
<meta name="author" content="Laxman Nepal"><meta name="robots" content="index,follow">
<link rel="canonical" href="https://laxmannepal.com.np/blogs/">
<title>Blogs & Tutorials | Laxman Nepal</title>
<style>
:root{--line:#e5e7eb;--muted:#667085;--text:#101828;--bg:#f7f8fb;--accent:#111827}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:0 18px}.hero{text-align:center;padding:65px 0 35px}.eyebrow{display:inline-block;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#667085;font-size:11px;font-weight:800}.hero h1{font-size:clamp(40px,6vw,68px);letter-spacing:-.055em;line-height:1;margin:18px 0 12px}.hero p{max-width:680px;margin:auto;color:var(--muted);font-size:18px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:18px 0 28px}.card{display:block;background:#fff;border:1px solid var(--line);border-radius:20px;padding:0;overflow:hidden;color:inherit;text-decoration:none;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 14px 35px rgba(16,24,40,.08)}.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#eef1f5}.card-body{padding:22px}.tag{font-size:10px;font-weight:900;color:#667085;letter-spacing:.08em}.card h2{font-size:21px;line-height:1.25;letter-spacing:-.025em;margin:10px 0}.card p{color:var(--muted);line-height:1.6;font-size:14px;margin:0}.read{display:inline-block;margin-top:18px;font-size:13px;font-weight:800}.pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 0 70px;flex-wrap:wrap}.page-btn{min-width:42px;height:42px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:.18s}.page-btn:hover:not(.disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,24,40,.08)}.page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}.page-btn.disabled{opacity:.42;cursor:not-allowed}.page-status{color:var(--muted);font-size:13px;font-weight:700;margin:0 8px}.empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--muted)}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{padding-top:45px}.hero p{font-size:16px}.pagination{padding-bottom:55px}.page-status{width:100%;text-align:center;order:3;margin-top:4px}}
</style>
</head><body>
<header class="shared-header"><a class="shared-brand" href="/" aria-label="Laxman Nepal home"><span class="shared-logo">LN</span><span><strong>Laxman Nepal</strong></span></a><nav class="shared-desktop-nav"><a href="/">Home</a><a href="/tools/">Tools</a><a href="/ai-tools/">AI Tools</a><a href="/blogs/" aria-current="page">Blogs</a></nav></header>
<main><section class="hero"><div class="wrap"><span class="eyebrow">PRACTICAL GUIDES</span><h1>Blogs & Tutorials</h1><p>Useful, step-by-step guides for YouTube, AI, Windows, command-line tools and practical digital workflows.</p></div></section>
<section class="wrap"><div class="grid" id="blogGrid"><p class="empty">Loading blogs…</p></div><nav class="pagination" id="pagination" aria-label="Blog pages"></nav></section>
<script>
(async()=>{
 const grid=document.getElementById("blogGrid"),pagination=document.getElementById("pagination"),PER_PAGE=9;
 const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
 const pageFromUrl=()=>{const n=parseInt(new URLSearchParams(location.search).get("page"),10);return Number.isFinite(n)&&n>0?n:1};
 const render=blogs=>{
   const totalPages=Math.max(1,Math.ceil(blogs.length/PER_PAGE));
   let page=Math.min(pageFromUrl(),totalPages);
   const start=(page-1)*PER_PAGE,items=blogs.slice(start,start+PER_PAGE);
   grid.innerHTML=items.length?items.map(x=>'<a class="card" href="'+esc(x.url)+'">'+(x.image?'<img class="thumb" src="'+esc(x.image)+'" alt="'+esc(x.title)+'" loading="lazy" decoding="async">':'')+'<div class="card-body"><span class="tag">'+esc(x.category||"ARTICLE")+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.description||"")+'</p><span class="read">Read guide →</span></div></a>').join(""):"<p class="empty">No blogs published yet.</p>";
   if(totalPages<=1){pagination.innerHTML="";return}
   const link=(label,target,disabled=false,active=false)=>disabled?'<span class="page-btn disabled" aria-disabled="true">'+label+'</span>':'<a class="page-btn'+(active?' active':'')+'" href="'+(target===1?"/blogs/":"/blogs/?page="+target)+'" aria-label="'+(active?'Current page, ':'')+'page '+target+'">'+label+'</a>';
   let html=link("← Previous",Math.max(1,page-1),page===1);
   const pages=[];
   const add=n=>{if(!pages.includes(n))pages.push(n)};
   add(1);if(page>3)add("…");for(let n=Math.max(2,page-1);n<=Math.min(totalPages-1,page+1);n++)add(n);if(page<totalPages-2)add("…");if(totalPages>1)add(totalPages);
   html+=pages.map(n=>n==="…"?'<span class="page-status" aria-hidden="true">…</span>':link(n,n,false,n===page)).join("");
   html+=link("Next →",Math.min(totalPages,page+1),page===totalPages);
   html+='<span class="page-status">Page '+page+' of '+totalPages+'</span>';
   pagination.innerHTML=html;
 };
 try{
   const res=await fetch("/search-index.json",{cache:"no-store"});
   if(!res.ok)throw new Error("search index unavailable");
   const items=await res.json();
   const blogs=items.filter(x=>x.type==="article"&&x.url.startsWith("/blogs/")&&x.url!=="/blogs/").sort((a,b)=>String(b.date||b.updated||"").localeCompare(String(a.date||a.updated||"")));
   render(blogs);
 }catch(e){grid.innerHTML="<p class="+"\"empty\"+">Blogs are temporarily unavailable. Please refresh.</p>";pagination.innerHTML=""}
})();
</script></main>
</body></html>

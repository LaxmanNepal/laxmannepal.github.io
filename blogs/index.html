<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Laxman Nepal practical tutorials about YouTube, AI, Windows, command-line tools and useful digital workflows.">
<meta name="author" content="Laxman Nepal"><meta name="robots" content="index,follow">
<link rel="canonical" href="https://laxmannepal.com.np/blogs/">
<title>Blogs & Tutorials | Laxman Nepal</title>
<style>:root{--line:#e5e7eb;--muted:#667085;--text:#101828;--bg:#f7f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:0 18px}.hero{text-align:center;padding:65px 0 35px}.eyebrow{display:inline-block;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#667085;font-size:11px;font-weight:800}.hero h1{font-size:clamp(40px,6vw,68px);letter-spacing:-.055em;line-height:1;margin:18px 0 12px}.hero p{max-width:680px;margin:auto;color:var(--muted);font-size:18px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:18px 0 70px} .card{display:block;background:#fff;border:1px solid var(--line);border-radius:20px;padding:0;overflow:hidden;color:inherit;text-decoration:none;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 14px 35px rgba(16,24,40,.08)} .thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#eef1f5}.card-body{padding:22px}.tag{font-size:10px;font-weight:900;color:#667085;letter-spacing:.08em}.card h2{font-size:21px;line-height:1.25;letter-spacing:-.025em;margin:10px 0}.card p{color:var(--muted);line-height:1.6;font-size:14px;margin:0}.read{display:inline-block;margin-top:18px;font-size:13px;font-weight:800}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{padding-top:45px}.hero p{font-size:16px}}</style>
</head><body>
<header class="shared-header"><a class="shared-brand" href="/" aria-label="Laxman Nepal home"><span class="shared-logo">LN</span><span><strong>Laxman Nepal</strong></span></a><nav class="shared-desktop-nav"><a href="/">Home</a><a href="/tools/">Tools</a><a href="/ai-tools/">AI Tools</a><a href="/blogs/" aria-current="page">Blogs</a></nav></header>
<main><section class="hero"><div class="wrap"><span class="eyebrow">PRACTICAL GUIDES</span><h1>Blogs & Tutorials</h1><p>Useful, step-by-step guides for YouTube, AI, Windows, command-line tools and practical digital workflows.</p></div></section>
<section class="wrap"><div class="grid" id="blogGrid"><p>Loading blogs…</p></div></section><script>
(async()=>{const grid=document.getElementById("blogGrid");try{const res=await fetch("/search-index.json",{cache:"no-store"});const items=await res.json();const blogs=items.filter(x=>x.type==="article"&&x.url.startsWith("/blogs/")&&x.url!="/blogs/");grid.innerHTML=blogs.length?blogs.map(x=>'<a class="card" href="'+x.url+'">'+(x.image?'<img class="thumb" src="'+x.image+'" alt="'+String(x.title).replace(/"/g,"&quot;")+'" loading="lazy" decoding="async">':'')+'<div class="card-body"><span class="tag">'+(x.category||"ARTICLE")+'</span><h2>'+x.title+'</h2><p>'+x.description+'</p><span class="read">Read guide →</span></div></a>').join(""):"<p>No blogs published yet.</p>"}catch(e){grid.innerHTML="<p>Blogs are temporarily unavailable. Please refresh.</p>"}})();
</script></main>
</body></html>

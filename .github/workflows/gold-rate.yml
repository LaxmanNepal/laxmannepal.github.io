name: Update Nepal Gold & Silver Rates

on:
  push:
    paths:
      - ".github/workflows/gold-rate.yml"
      - "scripts/fetch_gold_rates.py"
      - "scripts/validate_gold_rate_seo.py"
      - "sitemap.xml"
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch daily rates
        run: python3 scripts/fetch_gold_rates.py
      - name: Validate rate freshness and SEO snapshots
        run: python3 scripts/validate_gold_rate_seo.py . --allow-stale-days 3
      - name: Commit updated rate data
        run: |
          git config user.name "laxmannepal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold-nepal.json data/gold-nepal-live.json gold-price-in-nepal-today/index.html gold-price-history-nepal/index.html silver-price-in-nepal-today/index.html
          if git diff --cached --quiet; then
            echo "No rate-data change."
            exit 0
          fi
          git commit -m "data: update Nepal gold and silver rates"
          git push

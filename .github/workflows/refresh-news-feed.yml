name: Refresh automated news feed

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  # Run once immediately when the collector/workflow is first installed or changed.
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-news-feed.yml"
      - "scripts/refresh-news-feed.py"

permissions:
  contents: write

concurrency:
  group: automated-news-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Collect recent headlines from RSS feeds
        run: python3 scripts/refresh-news-feed.py
      - name: Commit feed when changed
        run: |
          if git diff --quiet -- news/news-feed.json; then
            echo "News feed unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/news-feed.json
          git commit -m "chore(news): refresh automated news feed"
          # Other site updates can land while feeds are being fetched; rebase to avoid a lost refresh.
          git pull --rebase origin main
          git push

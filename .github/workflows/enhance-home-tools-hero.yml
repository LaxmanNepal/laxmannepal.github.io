name: Enhance home tools hero

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    if: "!contains(github.event.head_commit.message, 'enhance: home tools hero')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enhance hero and search width
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '<div class="free-tools-banner" aria-label="Every tool you need is free"><p>Every tool you need is <span>FREE</span></p><div class="free-tools-rotator" aria-label="YouTube tools, image tools, PDF tools"><span>YouTube Tools</span><span>Image Tools</span><span>PDF Tools</span><span>YouTube Tools</span></div></div>'
          new = '''<section class="tools-hero-showcase" aria-labelledby="tools-hero-title">
            <div class="tools-hero-glow tools-hero-glow-one"></div>
            <div class="tools-hero-glow tools-hero-glow-two"></div>
            <div class="tools-hero-content">
              <div class="tools-hero-badge"><span class="tools-hero-dot"></span> Free tools for everyday digital work</div>
              <h1 id="tools-hero-title">Everything you need.<br><span>One place.</span></h1>
              <p class="tools-hero-copy">Explore a growing collection of fast, free and easy-to-use tools for <strong>PDFs, images, AI, YouTube, documents and more.</strong></p>
              <div class="tools-hero-categories" aria-label="Tool categories">
                <a href="/pdf-tools/"><span class="tools-hero-cat-icon">▣</span><strong>PDF Tools</strong><small>Merge, split & convert</small></a>
                <a href="/image-tools/"><span class="tools-hero-cat-icon">▧</span><strong>Image Tools</strong><small>Resize, compress & edit</small></a>
                <a href="/ai-tools/"><span class="tools-hero-cat-icon">✦</span><strong>AI Tools</strong><small>Useful AI utilities</small></a>
                <a href="/youtube-tools/"><span class="tools-hero-cat-icon">▶</span><strong>YouTube Tools</strong><small>Creators & videos</small></a>
              </div>
              <div class="free-tools-rotator" aria-label="More tool categories"><span>New tools added regularly</span><span>Everything is free to use</span><span>Built for speed & simplicity</span></div>
            </div>
          </section>'''
          if old not in s:
              raise SystemExit('Hero banner markup not found')
          s = s.replace(old, new, 1)

          marker = '.free-tools-banner{text-align:center;padding:8px 12px 18px;overflow:hidden}'
          start = s.find(marker)
          if start == -1:
              raise SystemExit('Hero CSS not found')
          end = s.find('.directory-search{display:grid;', start)
          if end == -1:
              raise SystemExit('Hero CSS boundary not found')
          hero_css = '''.tools-hero-showcase{position:relative;max-width:1080px;margin:12px auto 0;padding:58px 20px 34px;overflow:hidden;text-align:center;border:1px solid #e5e7eb;border-radius:30px;background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%);box-shadow:0 20px 60px rgba(15,23,42,.07)}
          .tools-hero-content{position:relative;z-index:2;max-width:900px;margin:auto}.tools-hero-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #dbe5f0;border-radius:999px;background:rgba(255,255,255,.82);color:#475569;font-size:12px;font-weight:800;box-shadow:0 6px 18px rgba(15,23,42,.04)}.tools-hero-dot{width:7px;height:7px;border-radius:50%;background:#2563eb;box-shadow:0 0 0 5px rgba(37,99,235,.1);animation:heroDotPulse 1.8s ease-in-out infinite}.tools-hero-showcase h1{margin:18px 0 10px;color:#0f172a;font-size:clamp(40px,6vw,68px);line-height:.98;letter-spacing:-.055em}.tools-hero-showcase h1 span{color:#2563eb}.tools-hero-copy{max-width:700px;margin:0 auto;color:#64748b;font-size:17px;line-height:1.6}.tools-hero-copy strong{color:#334155}.tools-hero-categories{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:850px;margin:28px auto 10px}.tools-hero-categories a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:15px 10px;border:1px solid #e2e8f0;border-radius:18px;background:rgba(255,255,255,.86);color:#0f172a;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.tools-hero-categories a:hover{transform:translateY(-4px);border-color:#bfdbfe;box-shadow:0 14px 30px rgba(37,99,235,.1)}.tools-hero-cat-icon{display:grid;place-items:center;width:40px;height:40px;margin-bottom:3px;border-radius:12px;background:#eff6ff;color:#2563eb;font-size:19px;font-weight:900}.tools-hero-categories a:nth-child(2) .tools-hero-cat-icon{background:#f5f3ff;color:#7c3aed}.tools-hero-categories a:nth-child(3) .tools-hero-cat-icon{background:#ecfdf5;color:#059669}.tools-hero-categories a:nth-child(4) .tools-hero-cat-icon{background:#fff1f2;color:#e11d48}.tools-hero-categories strong{font-size:13px}.tools-hero-categories small{color:#64748b;font-size:10px}.free-tools-rotator{height:25px;overflow:hidden;position:relative;margin:14px auto 0;color:#64748b;font-size:12px;font-weight:750}.free-tools-rotator span{position:absolute;left:0;right:0;top:0;opacity:0;animation:toolWordSwap 9s infinite}.free-tools-rotator span:nth-child(1){animation-delay:0s}.free-tools-rotator span:nth-child(2){animation-delay:3s}.free-tools-rotator span:nth-child(3){animation-delay:6s}@keyframes toolWordSwap{0%,4%{opacity:0;transform:translateY(10px)}10%,27%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-10px)}}@keyframes heroDotPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.3);opacity:1}}
          '''
          s = s[:start] + hero_css + s[end:]

          s = s.replace('.directory-controls{margin:0 10px 16px;display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:10px;align-items:center}', '.directory-controls{width:min(720px,calc(100% - 28px));margin:0 auto 18px;display:grid;grid-template-columns:1fr;gap:10px;align-items:center}')
          s = s.replace('.directory-search{display:grid;grid-template-columns:auto minmax(0,1fr) auto!important;align-items:center}', '.directory-search{display:grid;grid-template-columns:auto minmax(0,1fr) auto!important;align-items:center;width:100%;box-sizing:border-box}')
          s = s.replace('.directory-search{width:100%}', '.directory-search{width:100%;max-width:720px;margin:0 auto}', 1)
          s = s.replace('.tools-hero-categories{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;', '.tools-hero-categories{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;')
          s = s.replace('@media(prefers-reduced-motion:reduce){.free-tools-banner p span,.free-tools-rotator span{animation:none}.free-tools-rotator span{display:none}.free-tools-rotator span:first-child{display:block;opacity:1}}', '@media(prefers-reduced-motion:reduce){.tools-hero-dot,.free-tools-rotator span{animation:none}.free-tools-rotator span{display:none}.free-tools-rotator span:first-child{display:block;opacity:1}}')
          s = s.replace('@media(max-width:600px){.premium-hero{padding:54px 0 28px}', '@media(max-width:600px){.tools-hero-showcase{margin-top:6px;padding:42px 12px 25px;border-radius:22px}.tools-hero-copy{font-size:15px}.tools-hero-categories{grid-template-columns:repeat(2,1fr);gap:8px;margin-top:22px}.tools-hero-categories a{padding:12px 7px}.directory-controls{width:calc(100% - 20px)}.premium-hero{padding:54px 0 28px}')

          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'enhance: home tools hero'
          git push

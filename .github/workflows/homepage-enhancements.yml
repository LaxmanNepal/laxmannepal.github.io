name: Homepage Data Renderer

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: homepage-renderer
  cancel-in-progress: true

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify YouTube JSON
        run: |
          test -s data/youtube.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/youtube.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          channel = d.get('channel', {})
          stats = channel.get('statistics', {})
          if not channel.get('id') or not stats:
              raise SystemExit('youtube.json exists but has no channel/statistics data')
          print('YouTube JSON OK:', channel.get('title'), stats)
          PY

      - name: Install homepage renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="assets/site-enhancements.js?v=3" defer></script>'
          old = '<script src="assets/site-enhancements.js" defer></script>'
          if old in text:
              text = text.replace(old, tag)
          elif tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('index.html has no </body> marker')
              text = text.replace(marker, tag + '\n' + marker, 1)
          p.write_text(text, encoding='utf-8')
          print('Homepage renderer installed/verified.')
          PY

      - name: Commit renderer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Renderer already installed.'
          else
            git commit -m 'fix: install live YouTube JSON renderer'
            git push
          fi

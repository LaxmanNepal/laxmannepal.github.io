name: Homepage Data Renderer

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: homepage-renderer
  cancel-in-progress: true

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify generated data
        run: |
          test -s data/youtube.json
          test -s data/apps.json
          python - <<'PY'
          import json
          from pathlib import Path
          yt=json.loads(Path('data/youtube.json').read_text(encoding='utf-8'))
          apps=json.loads(Path('data/apps.json').read_text(encoding='utf-8'))
          if not yt.get('channel',{}).get('statistics'):
              raise SystemExit('youtube.json missing channel statistics')
          if not isinstance(apps.get('apps'),list):
              raise SystemExit('apps.json missing apps array')
          required=('id','name','url')
          for a in apps['apps']:
              if any(not a.get(k) for k in required):
                  raise SystemExit(f'invalid app: {a}')
          print('YouTube and app data valid:', len(apps['apps']), 'apps')
          PY

      - name: Install homepage renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="assets/site-enhancements.js?v=7" defer></script>'

          # Remove every previous site-enhancements version and the obsolete renderer.
          text=re.sub(r'<script\s+src=["\']assets/site-enhancements\.js(?:\?[^"\']*)?["\']\s+defer></script>\s*','',text,flags=re.I)
          text=re.sub(r'<script\s+src=["\']assets/apps-renderer\.js(?:\?[^"\']*)?["\']\s+defer></script>\s*','',text,flags=re.I)

          if '</body>' not in text:
              raise SystemExit('index.html has no closing body tag')
          text=text.replace('</body>',tag+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Validate homepage renderer installation
        run: python scripts/check-homepage-integrity.py

      - name: Commit renderer installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: normalize homepage renderer'
          git push
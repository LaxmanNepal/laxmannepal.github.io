name: Refresh Nepal Jobs

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh job data
        run: python3 scripts/refresh_jobs.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/jobs.json jobs/last-updated.json
          if git diff --cached --quiet; then
            echo "No job-data changes."
          else
            git commit -m "chore: refresh Nepal jobs"
            git push
          fi

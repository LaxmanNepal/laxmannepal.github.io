name: Build and validate native blogs

on:
  push:
    branches: [main]
    paths:
      - 'blogs/**'
      - 'scripts/manage_blogs.py'
      - '.github/workflows/blog-system.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-blog-system
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install thumbnail generator dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Create article metadata, thumbnails and SEO
        run: python3 scripts/manage_blogs.py --fix

      - name: Validate every blog folder
        run: python3 scripts/manage_blogs.py --check

      - name: Commit generated blog metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blogs llms.txt
          if git diff --cached --quiet; then
            echo 'No generated blog changes to commit.'
          else
            git commit -m 'chore: maintain native blog metadata and SEO'
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              echo "Push race detected; retrying ($attempt/5)..."
              sleep $((attempt * 2))
            done
            echo "Unable to push generated blog metadata after 5 attempts."
            exit 1
          fi

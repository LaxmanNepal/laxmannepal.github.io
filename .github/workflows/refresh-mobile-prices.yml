name: Refresh Nepal mobile price catalogue

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/refresh-mobile-prices.py"
      - ".github/workflows/refresh-mobile-prices.yml"

permissions:
  contents: write

concurrency:
  group: mobile-price-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Refresh phone listings
        run: python scripts/refresh-mobile-prices.py
      - name: Commit refreshed catalogue when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mobile-prices.json
          if git diff --cached --quiet; then
            echo "Catalogue unchanged; no commit needed."
          else
            git commit -m "chore: refresh Nepal mobile price catalogue"
            git push
          fi

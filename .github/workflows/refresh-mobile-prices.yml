name: Refresh Nepal mobile price catalogue

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "scripts/refresh-mobile-prices.py"
      - "scripts/validate-mobile-prices.py"
      - ".github/workflows/refresh-mobile-prices.yml"

permissions:
  contents: write

concurrency:
  group: mobile-price-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate scraper and price parser
        run: |
          python -m py_compile scripts/refresh-mobile-prices.py scripts/validate-mobile-prices.py
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("mobile_prices", "scripts/refresh-mobile-prices.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.money("Rs. 45,999") == 45999
          assert mod.variant_key("Samsung Galaxy A55 8GB/256GB") == "8GB/256GB"
          assert mod.is_phone_title("Samsung Galaxy A55 8GB/256GB")
          assert not mod.is_phone_title("Mobile Brands")
          assert not mod.is_phone_title("Wireless Headphones")
          assert not mod.is_phone_title("Samsung Galaxy Watch 8")
          assert not mod.is_phone_title("Xiaomi Pad 7")
          assert mod.is_phone_title("Nothing Phone 4a")
          assert mod.variant_key("Apple iPhone 15 128GB") == "128GB"
          assert mod.normalize_model('Apple iPhone 15 6.1" A16 Bionic 48MP Dual Rear Camera Black 128GB') == "Apple iPhone 15"
          print("Scraper syntax and conservative parser checks passed.")
          PY
      - name: Clear prior run status before this refresh attempt
        run: rm -f data/mobile-price-refresh-status.json
      - name: Test source-health merge safeguards
        run: python -m unittest discover -s tests -p "test_mobile_price_refresh.py"
      - name: Refresh phone listings
        run: python scripts/refresh-mobile-prices.py
      - name: Validate and repair suspicious prices
        run: python scripts/validate-mobile-prices.py
      - name: Report daily source health and update totals
        if: always()
        run: |
          if [ -f data/mobile-price-refresh-status.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("data/mobile-price-refresh-status.json",encoding="utf-8"))
          print("## Mobile catalogue refresh")
          print(f'- Date: {d.get("date")}')
          print(f'- Model variants: {d.get("model_variants")}')
          print(f'- Fresh offers: {d.get("fresh_offers")}')
          print(f'- Last-known stale offers: {d.get("stale_offers")}')
          print("| Store | Status | Fresh offers | Previous offers |")
          print("|---|---|---:|---:|")
          for name, item in d.get("stores",{}).items():
              print(f'| {name} | {item.get("status")} | {item.get("priced_offers_found")} | {item.get("previous_offers")} |')
          PY
          else
            echo "No refresh status was written; inspect the scraper step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish refreshed catalogue without rebase conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add -A data/mobile-prices.json data/mobile-price-history.json data/mobile-price-refresh-status.json mobile-price-in-nepal/phones mobile-price-in-nepal/brands mobile-price-in-nepal/budgets
            if git diff --cached --quiet; then
              echo "Catalogue unchanged; no commit needed."
              exit 0
            fi
            git commit -m "chore: refresh Nepal mobile price catalogue"
            if git push origin HEAD:main; then
              echo "Published refreshed phone prices and generated pages."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying against the latest main branch."
            sleep $((attempt * 3))
          done
          echo "Unable to publish refreshed catalogue after three attempts."
          exit 1

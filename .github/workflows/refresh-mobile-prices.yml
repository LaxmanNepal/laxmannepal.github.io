name: Refresh Nepal mobile price catalogue

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/refresh-mobile-prices.py"
      - ".github/workflows/refresh-mobile-prices.yml"

permissions:
  contents: write

concurrency:
  group: mobile-price-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate scraper and price parser
        run: |
          python -m py_compile scripts/refresh-mobile-prices.py
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("mobile_prices", "scripts/refresh-mobile-prices.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.money("Rs. 45,999") == 45999
          print("Parser sample:", mod.money("Rs. 45,999"), mod.money("Rs. 45,999 MRP Rs. 49,999"), mod.variant_key("Samsung Galaxy A55 8GB/256GB"))
          assert mod.variant_key("Samsung Galaxy A55 8GB/256GB") == "8GB/256GB"
          assert mod.is_phone_title("Samsung Galaxy A55 8GB/256GB")
          assert not mod.is_phone_title("Mobile Brands")
          assert not mod.is_phone_title("Wireless Headphones")
          print("Scraper syntax and conservative parser checks passed.")
          PY
      - name: Refresh phone listings
        run: python scripts/refresh-mobile-prices.py
      - name: Commit refreshed catalogue when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/mobile-prices.json data/mobile-price-history.json mobile-price-in-nepal/phones mobile-price-in-nepal/brands mobile-price-in-nepal/budgets
          if git diff --cached --quiet; then
            echo "Catalogue unchanged; no commit needed."
          else
            git commit -m "chore: refresh Nepal mobile price catalogue"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep $((attempt * 3))
            done
            echo "Unable to publish refreshed catalogue after three attempts."
            exit 1
          fi

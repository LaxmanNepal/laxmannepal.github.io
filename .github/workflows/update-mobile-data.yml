name: Update mobile catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'scripts/scrape_mobile.py'
      - 'mobile/**'

concurrency:
  group: mobile-catalog-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Scrape complete mobile price catalog
        run: python scripts/scrape_mobile.py
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update mobile phone catalog'
          git push

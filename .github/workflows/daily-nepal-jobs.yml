name: Daily Nepal Jobs Sync

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-nepal-jobs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Fetch latest jobs
        run: python3 scripts/sync_nepal_jobs.py
      - name: Commit refreshed jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nepal-jobs/jobs.json nepal-jobs/jobs-data.js nepal-jobs/index.html
          if git diff --cached --quiet; then
            echo "No Nepal Jobs changes."
          else
            git commit -m "chore: daily refresh Nepal jobs"
            git push
          fi

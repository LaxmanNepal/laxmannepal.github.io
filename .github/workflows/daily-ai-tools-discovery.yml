name: Daily AI Tools Discovery

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-tools-discovery
  cancel-in-progress: false

jobs:
  refresh-discoveries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh public AI project discoveries
        run: python scripts/update-ai-discoveries.py

      - name: Commit updated discoveries
        run: |
          if git diff --quiet -- ai-tools/discoveries.json; then
            echo "No changes to the AI discoveries feed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-tools/discoveries.json
          git commit -m "chore: refresh daily AI tool discoveries"
          git push

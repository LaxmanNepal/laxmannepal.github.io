name: Deploy After Mobile Price Experience

on:
  workflow_run:
    workflows: ["Install Mobile Price Experience"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

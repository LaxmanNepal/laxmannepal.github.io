name: Mobile price quality checks
on:
  pull_request:
    paths:
      - "data/mobile-prices.json"
      - "data/mobile-price-history.json"
      - "mobile-price-in-nepal/**"
      - "scripts/validate-mobile-prices.py"
      - "scripts/refresh-mobile-prices.py"
      - ".github/workflows/refresh-mobile-prices.yml"
      - "scripts/audit_mobile_price_catalogue.py"
      - "tests/test_mobile_price_validation.py"
      - "tests/test_mobile_price_refresh.py"
      - "tests/test_mobile_price_scraper_parsing.py"
      - ".github/workflows/mobile-price-quality.yml"
  push:
    branches:
      - "main"
    paths:
      - "data/mobile-prices.json"
      - "data/mobile-price-history.json"
      - "mobile-price-in-nepal/**"
      - "scripts/validate-mobile-prices.py"
      - "scripts/refresh-mobile-prices.py"
      - ".github/workflows/refresh-mobile-prices.yml"
      - "scripts/audit_mobile_price_catalogue.py"
      - "tests/test_mobile_price_validation.py"
      - ".github/workflows/mobile-price-quality.yml"
      - "tests/test_mobile_price_refresh.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-price-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Compile validation scripts
        run: python -m py_compile scripts/refresh-mobile-prices.py scripts/validate-mobile-prices.py scripts/audit_mobile_price_catalogue.py
      - name: Test price validation and history synchronization
        run: python -m unittest discover -s tests -p "test_mobile_price_validation.py"
      - name: Test daily refresh completeness and stale-offer safeguards
        run: python -m unittest discover -s tests -p "test_mobile_price_refresh.py"
      - name: Test retailer price parsing
        run: python -m unittest discover -s tests -p "test_mobile_price_scraper_parsing.py"
      - name: Validate JSON and generated phone pages
        run: |
          python -m json.tool data/mobile-prices.json > /dev/null
          python -m json.tool data/mobile-price-history.json > /dev/null
          if [ -f data/mobile-price-refresh-status.json ]; then python -m json.tool data/mobile-price-refresh-status.json > /dev/null; fi
          python scripts/audit_mobile_price_catalogue.py

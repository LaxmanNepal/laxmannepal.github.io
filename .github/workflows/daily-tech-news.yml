name: Daily Tech News
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-tech-news
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Generate five fresh tech stories
        run: python3 scripts/daily_tech_news.py
      - name: Commit daily stories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech-news/
          git diff --cached --quiet && exit 0
          git commit -m "Daily tech news: $(date -u +%Y-%m-%d)"
          git push

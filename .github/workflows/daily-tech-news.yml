name: Daily Tech News Research Queue
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-tech-news-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Collect five fresh research leads
        run: python3 scripts/daily_tech_news.py
      - name: Commit research queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech-news/_queue/
          git diff --cached --quiet && exit 0
          git commit -m "Daily tech news research queue: $(date -u +%Y-%m-%d)"
          git push

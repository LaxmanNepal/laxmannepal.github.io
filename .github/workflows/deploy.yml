name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'old/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build SEO content and portal
        continue-on-error: true
        run: |
          python3 scripts/build_site.py
          python3 scripts/generate_portal_pages.py
          python3 scripts/portal_finish.py
          python3 scripts/generate_product_pages.py
          python3 scripts/product_catalog_v7.py
          python3 scripts/product_intelligence_v8.py
          python3 scripts/product_deals_v9.py
          python3 scripts/product_pro_v10.py
          python3 scripts/product_review_v13.py
          python3 scripts/recommend_v14.py
          python3 scripts/setup_builder_v15.py
          python3 scripts/generate_price_pages.py
      - name: Apply Laxman shared shell
        if: always()
        run: python3 scripts/apply_laxman_shared_shell.py
      - name: Inject homepage tools
        if: always()
        run: python3 scripts/inject_home_tools.py
      - name: Build unified main homepage
        if: always()
        run: python3 scripts/build_main_platform_home.py
      - name: Verify unified homepage
        if: always()
        run: |
          test -f index.html
          test -f assets/css/main-platform.css
          grep -q 'Technology that helps you' index.html
          grep -q 'TECH DATABASE' index.html
          grep -q 'FREE TOOLS + AI' index.html
          grep -q 'YOUTUBE INTELLIGENCE' index.html
      - name: Apply modern Blogger article template
        run: python3 scripts/modernize_blogger_articles.py
      - name: Generate static SEO discovery files
        run: python3 scripts/generate_seo.py
      - name: Build Next.js static site
        id: next_build
        continue-on-error: true
        working-directory: nextjs-foundation
        run: |
          npm install
          npm run build
      - name: Assemble Pages artifact
        run: |
          rm -rf .pages
          mkdir -p .pages

          # Start with the generated static site so legacy Blogger URLs always survive.
          find . -maxdepth 1 -type f -not -name '.blogger-migration.json' -not -name 'CNAME' -not -name '404.html' -print0 | xargs -0 -r -I{} cp --parents "{}" .pages/
          for dir in assets 2022 2023 2024 2025 2026 apps ai blog compare guides laptops news phones products reviews search tools youtube en ne hi; do
            if [ -d "$dir" ]; then cp -R "$dir" .pages/; fi
          done

          # Overlay the modern Next.js site when its export exists.
          if [ -f nextjs-foundation/out/index.html ]; then
            cp -R nextjs-foundation/out/. .pages/
          fi

          # Preserve migrated Blogger .html URLs exactly as published.
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          root = Path(".")
          pages = root / ".pages"
          manifest = json.loads((root / ".blogger-migration.json").read_text(encoding="utf-8"))
          for post in manifest.get("posts", []):
              rel = post.get("path", "").lstrip("/")
              if not rel:
                  continue
              src = root / rel
              dst = pages / rel
              if src.is_file():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
          PY

          if [ -f CNAME ]; then cp CNAME .pages/CNAME; fi
          touch .pages/.nojekyll

      - name: Verify published legacy routes
        run: |
          test -f .pages/2022/09/kalimati-font-download-by-laxman-nepal.html
          test -f .pages/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".pages")
          manifest = json.loads(Path(".blogger-migration.json").read_text(encoding="utf-8"))
          posts = manifest.get("posts", [])
          missing = []
          for post in posts:
              rel = str(post.get("path", "")).lstrip("/")
              if rel and not (root / rel).is_file():
                  missing.append(rel)
          if missing:
              print("Missing migrated Blogger routes:")
              print("\n".join(missing))
              raise SystemExit(1)
          print(f"Verified {len(posts)} migrated Blogger routes in Pages artifact.")
          PY

      - name: Verify Next.js routes when exported
        run: |
          if [ -d nextjs-foundation/out ]; then
            test -f .pages/news/index.html
            test -f .pages/reviews/index.html
            test -f .pages/guides/index.html
            test -f .pages/phones/index.html
            test -f .pages/laptops/index.html
            test -f .pages/compare/index.html
            test -f .pages/tools/index.html
            test -f .pages/ai/index.html
            test -f .pages/youtube/index.html
            test -f .pages/search/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

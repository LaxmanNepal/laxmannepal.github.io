name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'old/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Protect source homepage
        run: |
          test -f index.html
          grep -q 'Useful tools.' index.html
          grep -q 'All-in-One Free Online Tools by Laxman Nepal' index.html
          cp index.html /tmp/laxman-root-homepage.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build SEO content and portal
        continue-on-error: true
        run: |
          python3 scripts/build_site.py
          python3 scripts/generate_portal_pages.py
          python3 scripts/portal_finish.py
          python3 scripts/generate_product_pages.py
          python3 scripts/product_catalog_v7.py
          python3 scripts/product_intelligence_v8.py
          python3 scripts/product_deals_v9.py
          python3 scripts/product_pro_v10.py
          python3 scripts/product_review_v13.py
          python3 scripts/recommend_v14.py
          python3 scripts/setup_builder_v15.py
          python3 scripts/generate_price_pages.py
      - name: Apply Laxman shared shell
        if: always()
        run: python3 scripts/apply_laxman_shared_shell.py
      - name: Inject homepage tools
        if: always()
        run: python3 scripts/inject_home_tools.py
      - name: Protect committed homepage
        if: always()
        run: |
          test -f index.html
          grep -q 'Useful tools.' index.html
          grep -q 'All-in-One Free Online Tools by Laxman Nepal' index.html
      - name: Apply modern Blogger article template
        run: python3 scripts/modernize_blogger_articles.py
      - name: Apply shared shell to Blogger articles
        run: python3 scripts/apply_laxman_shared_shell.py
      - name: Upgrade migrated Blogger article CSS
        run: python3 scripts/upgrade_blogger_responsive.py
      - name: Generate static SEO discovery files
        run: python3 scripts/generate_seo.py
      - name: Build Next.js static site
        id: next_build
        continue-on-error: true
        working-directory: nextjs-foundation
        run: |
          rm -rf out
          npm install
          npm run build
      - name: Assemble Pages artifact
        run: |
          rm -rf .pages
          mkdir -p .pages
          find . -maxdepth 1 -type f -not -name '.blogger-migration.json' -not -name 'CNAME' -not -name '404.html' -print0 | xargs -0 -r -I{} cp --parents "{}" .pages/
          for dir in assets 2022 2023 2024 2025 2026 apps ai blog compare guides laptops news tech-news phones products reviews search tools youtube youtube-tools gold-rates-nepal gold-price-in-nepal-today gold-price-history-nepal silver-price-in-nepal-today vacation en ne hi Drumkit analytics data; do
            if [ -d "$dir" ]; then cp -R "$dir" .pages/; fi
          done
          if [ -f nextjs-foundation/out/index.html ]; then
            cp -R nextjs-foundation/out/. .pages/
          fi
          cp /tmp/laxman-root-homepage.html .pages/index.html
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          root = Path(".")
          pages = root / ".pages"
          manifest = json.loads((root / ".blogger-migration.json").read_text(encoding="utf-8"))
          for post in manifest.get("posts", []):
              rel = post.get("path", "").lstrip("/")
              if not rel:
                  continue
              src = root / rel
              dst = pages / rel
              if src.is_file():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
          PY
          if [ -f CNAME ]; then cp CNAME .pages/CNAME; fi
          touch .pages/.nojekyll
      - name: Apply shared shell to final Pages artifact
        run: SHELL_ROOT=.pages python3 scripts/apply_laxman_shared_shell.py
      - name: Audit final Pages layout
        run: python3 scripts/audit_site_layout.py .pages
      - name: Audit final Pages links and assets
        continue-on-error: true
        run: python3 scripts/audit_site_links.py .pages
      - name: Verify published homepage
        run: |
          test -f .pages/index.html
          grep -q 'Useful tools.' .pages/index.html
          grep -q 'All-in-One Free Online Tools by Laxman Nepal' .pages/index.html
          ! grep -q 'Technology that helps you do more' .pages/index.html
      - name: Optimize every published page for SEO
        run: python3 scripts/optimize_published_seo.py
      - name: Audit published SEO health
        continue-on-error: true
        run: python3 scripts/audit_seo_health.py .pages
      - name: Validate gold-rate SEO cluster
        run: python3 scripts/validate_gold_rate_seo.py .pages --data .pages/data/gold-nepal.json
      - name: Verify published legacy routes
        run: |
          test -f .pages/2022/09/kalimati-font-download-by-laxman-nepal.html
          test -f .pages/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".pages")
          manifest = json.loads(Path(".blogger-migration.json").read_text(encoding="utf-8"))
          posts = manifest.get("posts", [])
          missing = []
          for post in posts:
              rel = str(post.get("path", "")).lstrip("/")
              if rel and not (root / rel).is_file():
                  missing.append(rel)
          if missing:
              print("Missing migrated Blogger routes:")
              print("\n".join(missing))
              raise SystemExit(1)
          print(f"Verified {len(posts)} migrated Blogger routes in Pages artifact.")
          PY
      - name: Verify Next.js routes when exported
        run: |
          if [ -d nextjs-foundation/out ]; then
            test -f .pages/news/index.html
            test -f .pages/reviews/index.html
            test -f .pages/guides/index.html
            test -f .pages/phones/index.html
            test -f .pages/laptops/index.html
            test -f .pages/compare/index.html
            test -f .pages/tools/index.html
            test -f .pages/ai/index.html
            test -f .pages/youtube/index.html
            test -f .pages/search/index.html
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

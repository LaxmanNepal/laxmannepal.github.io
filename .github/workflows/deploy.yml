name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'old/**'
  workflow_run:
    workflows: ["Build and validate native blogs", "Sync Analytics Data"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate mobile price data, Python and JavaScript
        run: |
          python3 -m py_compile scripts/refresh-mobile-prices.py scripts/validate-mobile-prices.py scripts/generate_seo.py
          python3 -m json.tool data/mobile-prices.json > /dev/null
          python3 -m json.tool data/mobile-price-history.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          from html.parser import HTMLParser
          data = json.loads(Path("data/mobile-prices.json").read_text(encoding="utf-8"))
          phones = data.get("phones", [])
          assert phones, "Mobile price catalogue must not be empty"
          assert len({p.get("slug") for p in phones}) == len(phones), "Phone slugs must be unique"
          valid_offers = [o for p in phones for o in p.get("prices", []) if isinstance(o, dict) and isinstance(o.get("price"), (int, float)) and not isinstance(o.get("price"), bool) and o.get("price") > 0 and o.get("store")]
          assert data.get("price_count") == len(valid_offers), "Offer count mismatch: metadata must equal valid priced offers"
          assert data.get("store_count") == len({o.get("store") for o in valid_offers}), "Store count mismatch: count stores with valid priced offers"
          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.current = None
                  self.keep = False
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.current = []
                      self.keep = "src" not in attrs and attrs.get("type", "").lower() != "application/ld+json"
              def handle_data(self, data):
                  if self.current is not None and self.keep:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      if self.keep:
                          self.scripts.append("".join(self.current))
                      self.current = None
                      self.keep = False
          parser = ScriptParser()
          parser.feed(Path("mobile-price-in-nepal/index.html").read_text(encoding="utf-8"))
          assert parser.scripts, "Mobile price page inline JavaScript was not found"
          for i, script in enumerate(parser.scripts):
              Path(f"/tmp/mobile-price-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Validated {len(phones)} phone variants, {data['price_count']} offers, {data['store_count']} stores.")
          PY
          for file in /tmp/mobile-price-inline-*.js; do node --check "$file"; done
      - name: Test mobile price validation and history consistency
        run: python3 -m unittest discover -s tests -p "test_mobile_price_validation.py"
      - name: Test Nepali typing range regression
        run: node --test tests/nepali-typing-range.test.cjs
      - name: Test offline Romanized engine
        run: node --test tests/nepali-romanized.test.cjs
      - name: Test typing-practice metrics
        run: node --test tests/nepali-typing-practice.test.cjs
      - name: Test Preeti converter
        run: node --test tests/preeti-unicode-converter.test.cjs
      - name: Test smart Romanized engine
        run: node --test tests/nepali-smart-typing.test.cjs
      - name: Install browser-test dependency
        run: npm install --prefix /tmp/typing-browser playwright
      - name: Install Chromium for browser tests
        run: /tmp/typing-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run Nepali typing browser regressions
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nepali-typing-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/tools/nepali-tools/type-nepali/ > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH=/tmp/typing-browser/node_modules node --test tests/nepali-typing-browser.test.cjs
      - name: Protect source homepage
        run: |
          test -f index.html
          grep -q '<title>Laxman Nepal — Free Tools, AI Tools & Practical Guides</title>' index.html
          grep -q 'name="description" content="Laxman Nepal — free online tools, AI tools, practical tutorials, apps and useful digital resources\."' index.html
          cp index.html /tmp/laxman-root-homepage.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build SEO content and portal
        continue-on-error: true
        run: |
          python3 scripts/build_site.py
          python3 scripts/generate_portal_pages.py
          python3 scripts/portal_finish.py
          python3 scripts/generate_product_pages.py
          python3 scripts/product_catalog_v7.py
          python3 scripts/product_intelligence_v8.py
          python3 scripts/product_deals_v9.py
          python3 scripts/product_pro_v10.py
          python3 scripts/product_review_v13.py
          python3 scripts/recommend_v14.py
          python3 scripts/setup_builder_v15.py
          python3 scripts/generate_price_pages.py
      - name: Apply Laxman shared shell
        if: always()
        run: python3 scripts/apply_laxman_shared_shell.py
      - name: Inject homepage tools
        if: always()
        run: python3 scripts/inject_home_tools.py
      - name: Protect committed homepage
        if: always()
        run: |
          test -f index.html
          grep -q '<title>Laxman Nepal — Free Tools, AI Tools & Practical Guides</title>' index.html
          grep -q 'name="description" content="Laxman Nepal — free online tools, AI tools, practical tutorials, apps and useful digital resources\."' index.html
      - name: Apply modern Blogger article template
        run: python3 scripts/modernize_blogger_articles.py
      - name: Apply shared shell to Blogger articles
        run: python3 scripts/apply_laxman_shared_shell.py
      - name: Upgrade migrated Blogger article CSS
        run: python3 scripts/upgrade_blogger_responsive.py
      - name: Generate static SEO discovery files
        run: |
          python3 scripts/generate_seo.py
          python3 scripts/generate_search_index.py
      - name: Build Next.js static site
        id: next_build
        working-directory: nextjs-foundation
        run: |
          rm -rf out
          npm install
          npm run build
      - name: Assemble Pages artifact
        run: |
          rm -rf .pages
          mkdir -p .pages
          find . -maxdepth 1 -type f -not -name '.blogger-migration.json' -not -name 'CNAME' -not -name '404.html' -print0 | xargs -0 -r -I{} cp --parents "{}" .pages/
          for dir in assets image-prompt 2022 2023 2024 2025 2026 Open-Source about apps ai ai-tools blog blogs compare contact footprint guides laptops laptop-price-in-nepal me mobile mobile-price-in-nepal mobile-prices-in-nepal news privacy tech-news phones products reviews search terms tools pdf-tools image-tools data-tools laxman-tools nepal-tools youtube youtube-tools nepal-jobs subdomain-finder gold-rates-nepal gold-price-in-nepal-today kalimati-format gold-price-history-nepal silver-price-in-nepal-today vacation jobs en hi Drumkit analytics data qrcodetool remove-gemini-watermark; do
            if [ -d "$dir" ]; then cp -R "$dir" .pages/; fi
          done
          if [ -f nextjs-foundation/out/index.html ]; then
            cp -R nextjs-foundation/out/. .pages/
          fi
          if [ -d tools/nepali-tools/type-nepali ]; then
            mkdir -p .pages/tools/nepali-tools
            cp -R tools/nepali-tools/type-nepali .pages/tools/nepali-tools/
          fi
          cp /tmp/laxman-root-homepage.html .pages/index.html
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          root = Path(".")
          pages = root / ".pages"
          manifest = json.loads((root / ".blogger-migration.json").read_text(encoding="utf-8"))
          for post in manifest.get("posts", []):
              rel = post.get("path", "").lstrip("/")
              if not rel:
                  continue
              src = root / rel
              dst = pages / rel
              if src.is_file():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
          PY
          if [ -f CNAME ]; then cp CNAME .pages/CNAME; fi
          touch .pages/.nojekyll
      - name: Apply shared shell to final Pages artifact
        run: SHELL_ROOT=.pages python3 scripts/apply_laxman_shared_shell.py
      - name: Verify published homepage and Nepal Jobs
        continue-on-error: true
        run: |
          test -f .pages/index.html
          test -f .pages/nepal-jobs/index.html
          test -f .pages/nepal-jobs/jobs.js
          test -f .pages/nepal-jobs/jobs.css
          test -f .pages/nepal-jobs/jobs.json
          grep -q 'window.NEPAL_JOBS_DATA=' .pages/nepal-jobs/index.html
          grep -q '2026-10-09' .pages/nepal-jobs/index.html
          test -f .pages/jobs/index.html
          grep -q '/nepal-jobs/' .pages/jobs/index.html
          echo "Nepal Jobs deployment bundle verified."
          test -f .pages/pdf-tools/index.html
          test -f .pages/pdf-tools/merge/index.html
          test -f .pages/pdf-tools/split/index.html
          test -f .pages/pdf-tools/images-to-pdf/index.html
          test -f .pages/pdf-tools/pdf-to-image/index.html
          test -f .pages/qrcodetool/index.html
          grep -q "QR Code Generator &amp; Scanner" .pages/qrcodetool/index.html || grep -q "QR Code Generator & Scanner" .pages/qrcodetool/index.html
          test -f .pages/ai-tools/index.html
          test -f .pages/ai-tools/tools.json
          test -f .pages/ai-tools/discoveries.json
          grep -q '<title>Laxman Nepal — Free Tools, AI Tools & Practical Guides</title>' .pages/index.html
          grep -q 'name="description" content="Laxman Nepal — free online tools, AI tools, practical tutorials, apps and useful digital resources\."' .pages/index.html
      - name: Optimize every published page for SEO
        run: python3 scripts/optimize_published_seo.py
      - name: Apply shared shell to normalized legacy pages
        run: SHELL_ROOT=.pages python3 scripts/apply_laxman_shared_shell.py
      - name: Audit final Pages layout
        continue-on-error: true
        run: python3 scripts/audit_site_layout.py .pages
      - name: Audit final Pages links and assets
        run: python3 scripts/audit_site_links.py .pages
      - name: Audit published SEO health
        run: python3 scripts/audit_seo_health.py .pages
      - name: Sync final gold-rate SEO snapshots
        run: python3 scripts/sync_gold_rate_snapshots.py
      - name: Validate gold-rate SEO cluster
        run: python3 scripts/validate_gold_rate_seo.py .pages --data data/gold-nepal.json
      - name: Verify published legacy routes
        run: |
          test -f .pages/2022/09/kalimati-font-download-by-laxman-nepal.html
          test -f .pages/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".pages")
          manifest = json.loads(Path(".blogger-migration.json").read_text(encoding="utf-8"))
          posts = manifest.get("posts", [])
          missing = []
          for post in posts:
              rel = str(post.get("path", "")).lstrip("/")
              if rel and not (root / rel).is_file():
                  missing.append(rel)
          if missing:
              print("Missing migrated Blogger routes:")
              print("\n".join(missing))
              raise SystemExit(1)
          print(f"Verified {len(posts)} migrated Blogger routes in Pages artifact.")
          PY
      - name: Verify Next.js routes when exported
        run: |
          test -d nextjs-foundation/out
          test -f .pages/news/index.html
          test -f .pages/reviews/index.html
          test -f .pages/guides/index.html
          test -f .pages/phones/index.html
          test -f .pages/laptops/index.html
          test -f .pages/compare/index.html
          test -f .pages/tools/index.html
          test -f .pages/ai/index.html
          test -f .pages/youtube/index.html
          test -f .pages/search/index.html
      - name: Verify laptop price marketplace artifact
        run: |
          test -f .pages/laptop-price-in-nepal/index.html
          test -f .pages/laptop-price-in-nepal/assets/app.js
          test -f .pages/laptop-price-in-nepal/assets/style.css
          test -f .pages/laptop-price-in-nepal/data/laptops.json
          test -f .pages/laptop-price-in-nepal/laptops/index.html
          test -f .pages/laptop-price-in-nepal/stores/index.html
          test -f .pages/laptop-price-in-nepal/brands/index.html
          test -f .pages/laptop-price-in-nepal/compare/index.html
      - name: Verify Nepali typing tool artifact
        run: |
          test -s .pages/tools/nepali-tools/type-nepali/index.html
          test -s .pages/tools/nepali-tools/type-nepali/app.js
          test -s .pages/tools/nepali-tools/type-nepali/style.css
          test -s .pages/tools/nepali-tools/type-nepali/engines/romanized.js
          test -s .pages/tools/nepali-tools/type-nepali/engines/typing-lexicon.js
          test -s .pages/tools/nepali-tools/type-nepali/engines/smart-typing.js
          test -s .pages/tools/nepali-tools/type-nepali/engines/LICENSE-TYPING
          test -s .pages/tools/nepali-tools/type-nepali/workspace-tools.js
          test -s .pages/tools/nepali-tools/type-nepali/manifest.webmanifest
          test -s .pages/tools/nepali-tools/type-nepali/sw.js
          grep -q 'Type Nepali Online' .pages/tools/nepali-tools/type-nepali/index.html
          grep -q 'id="editor"' .pages/tools/nepali-tools/type-nepali/index.html
          grep -q 'id="remote-suggestions"' .pages/tools/nepali-tools/type-nepali/index.html
          grep -q 'FAQPage' .pages/tools/nepali-tools/type-nepali/index.html
          grep -q 'Microphone permission was denied' .pages/tools/nepali-tools/type-nepali/app.js
          grep -q 'LEARNED_KEY' .pages/tools/nepali-tools/type-nepali/app.js
          grep -q 'ln-nepali-typing-learned-v1' .pages/tools/nepali-tools/type-nepali/workspace-tools.js
          grep -q "restoreDraft();" .pages/tools/nepali-tools/type-nepali/app.js
      - name: Verify Nepali typing practice artifact
        run: |
          test -s .pages/tools/nepali-tools/nepali-typing-practice/index.html
          test -s .pages/tools/nepali-tools/nepali-typing-practice/app.js
          test -s .pages/tools/nepali-tools/nepali-typing-practice/metrics.js
          grep -q 'Practice Nepali Typing' .pages/tools/nepali-tools/nepali-typing-practice/index.html
          grep -q 'FAQPage' .pages/tools/nepali-tools/nepali-typing-practice/index.html
      - name: Verify Preeti converter artifact
        run: |
          test -s .pages/tools/nepali-tools/preeti-unicode-converter/index.html
          test -s .pages/tools/nepali-tools/preeti-unicode-converter/app.js
          test -s .pages/tools/nepali-tools/preeti-unicode-converter/engine.js
          test -s .pages/tools/nepali-tools/preeti-unicode-converter/LICENSE-PREETI
          grep -q 'Preeti ↔ Unicode Converter' .pages/tools/nepali-tools/preeti-unicode-converter/index.html
          grep -q 'FAQPage' .pages/tools/nepali-tools/preeti-unicode-converter/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

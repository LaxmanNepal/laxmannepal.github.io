name: YouTube Public Data

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'

permissions:
  contents: write

concurrency:
  group: youtube-public-data
  cancel-in-progress: true

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch complete public YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_HANDLE: '@laxmannepalofficial'
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_MAX_UPLOADS: '250'
        run: python scripts/youtube_public.py

      - name: Validate JSON files
        run: |
          python -m json.tool data/youtube.json > /dev/null
          python -m json.tool data/youtube-public.json > /dev/null

      - name: Show collection summary
        run: cat data/youtube.json | python -c "import json,sys; d=json.load(sys.stdin); print('Channel:',d['channel']['title']); print('Subscribers:',d['channel']['statistics']['subscriberCount']); print('Total views:',d['channel']['statistics']['viewCount']); print('Total videos:',d['channel']['statistics']['videoCount']); print('Videos fetched:',d['analysis']['videosFetched'])"

      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/youtube.json data/youtube-public.json
          if git diff --cached --quiet; then
            echo 'No YouTube data changes to commit.'
            exit 0
          fi
          git commit -m 'chore: refresh complete YouTube data'
          git push

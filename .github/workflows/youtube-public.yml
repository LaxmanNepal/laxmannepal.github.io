name: YouTube Public Data
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'
permissions:
  contents: write
jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch public YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_HANDLE: '@laxmannepalofficial'
        run: python scripts/youtube_public.py
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/youtube-public.json
          git diff --cached --quiet || git commit -m 'chore: update public YouTube data'
          git push

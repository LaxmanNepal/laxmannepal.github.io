name: YouTube Public Data

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'

permissions:
  contents: write

concurrency:
  group: youtube-public-data
  cancel-in-progress: true

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch public YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_HANDLE: '@laxmannepalofficial'
          # Optional: set this repository variable once you know the channel ID.
          # It avoids the 100-unit search.list fallback on every scheduled run.
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
        run: python scripts/youtube_public.py

      - name: Validate generated JSON
        run: python -m json.tool data/youtube-public.json > /dev/null

      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/youtube-public.json
          if git diff --cached --quiet; then
            echo 'No YouTube data changes to commit.'
            exit 0
          fi
          git commit -m 'chore: update public YouTube data'
          git push

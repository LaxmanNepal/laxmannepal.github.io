name: Sync Analytics Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Fetch GA4 + Search Console data
        id: fetch
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          set -o pipefail
          python scripts/sync_analytics.py 2>&1 | tee analytics/sync.log

      - name: Diagnose sync result
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          FETCH_CONCLUSION: ${{ steps.fetch.conclusion }}
        run: |
          python - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          p="analytics/sync.log"
          try:
              log=open(p,encoding="utf-8",errors="replace").read().strip()
          except FileNotFoundError:
              log=""
          # Never publish credentials or raw service-account JSON.
          log=re.sub(r'"private_key"\\s*:\\s*"[^"]*"', '"private_key":"[redacted]"', log, flags=re.I)
          log=re.sub(r'-----BEGIN PRIVATE KEY-----.*?-----END PRIVATE KEY-----', '[private key redacted]', log, flags=re.S)
          lines=details.splitlines() if details else []
          stages=[x.split("STAGE:",1)[1].strip() for x in lines if "STAGE:" in x]
          checks={}
          for x in lines:
              m=re.search(r"CHECK:\s*([a-z_]+)=(ok|failed)",x)
              if m: checks[m.group(1)] = m.group(2)
          if os.environ.get("FETCH_OUTCOME") == "success":
              status={"status":"success","stage":"complete","message":"GA4 + Search Console sync completed successfully.","details":"","checks":{"credentials":"ok","ga4":"ok","search_console":"ok","seo_audit":"ok","snapshot":"ok"},"updatedAt":datetime.now(timezone.utc).isoformat()}
          else:
              details=log[-5000:] if log else "The sync process failed before producing diagnostic output."
              lines=details.splitlines()
              stage=stages[-1] if stages else "unknown"
              error_lines=[x.strip() for x in lines if re.search(r"ERROR:|403|401|400|404|429|500|503|Traceback|Exception",x,re.I)]
              first_error=error_lines[-1] if error_lines else next((x.strip() for x in reversed(lines) if x.strip()), details)
              status={"status":"failed","stage":stage,"message":first_error[:500],"details":details,"checks":checks,"updatedAt":datetime.now(timezone.utc).isoformat()}
          history=[]
          hp="analytics/sync-status.json"
          try:
              previous=json.load(open(hp,encoding="utf-8"))
              history=list(previous.get("history",[]))
          except Exception: pass
          event={k:status[k] for k in ("status","stage","message","checks","updatedAt") if k in status}
          history=[event]+history
          status["history"]=history[:12]
          with open(hp,"w",encoding="utf-8") as f:
              json.dump(status,f,ensure_ascii=False,indent=2)
          PY

      - name: Generate SEO Fix Report
        if: steps.fetch.outcome == 'success'
        run: python scripts/generate_seo_fix_report.py

      - name: Commit analytics, SEO report + sync status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f analytics/sync.log
          git add analytics/data.json analytics/seo-fix-report.md analytics/sync-status.json
          if git diff --cached --quiet; then
            echo "No analytics status changes."
          else
            git commit -m "chore: refresh analytics sync status"
            git push
          fi

      - name: Fail workflow when sync failed
        if: steps.fetch.outcome != 'success'
        run: |
          echo "Analytics sync failed. Open /analytics/ to see the exact diagnostic message."
          exit 1

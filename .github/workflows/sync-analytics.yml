name: Sync Analytics Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Fetch GA4 + Search Console data
        id: fetch
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          set -o pipefail
          python scripts/sync_analytics.py 2>&1 | tee analytics/sync.log

      - name: Diagnose sync result
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          FETCH_CONCLUSION: ${{ steps.fetch.conclusion }}
        run: |
          python - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          p="analytics/sync.log"
          try:
              log=open(p,encoding="utf-8",errors="replace").read().strip()
          except FileNotFoundError:
              log=""
          # Never publish credentials or raw service-account JSON.
          log=re.sub(r'"private_key"\\s*:\\s*"[^"]*"', '"private_key":"[redacted]"', log, flags=re.I)
          log=re.sub(r'-----BEGIN PRIVATE KEY-----.*?-----END PRIVATE KEY-----', '[private key redacted]', log, flags=re.S)
          if os.environ.get("FETCH_OUTCOME") == "success":
              status={"status":"success","stage":"fetch","message":"GA4 + Search Console sync completed successfully.","details":"","updatedAt":datetime.now(timezone.utc).isoformat()}
          else:
              details=log[-5000:] if log else "The sync process failed before producing diagnostic output."
              first_error=next((x.strip() for x in reversed(details.splitlines()) if x.strip()), details)
              status={"status":"failed","stage":"fetch","message":first_error[:500],"details":details,"updatedAt":datetime.now(timezone.utc).isoformat()}
          with open("analytics/sync-status.json","w",encoding="utf-8") as f:
              json.dump(status,f,ensure_ascii=False,indent=2)
          PY

      - name: Generate SEO Fix Report
        if: steps.fetch.outcome == 'success'
        run: python scripts/generate_seo_fix_report.py

      - name: Commit analytics, SEO report + sync status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f analytics/sync.log
          git add analytics/data.json analytics/seo-fix-report.md analytics/sync-status.json
          if git diff --cached --quiet; then
            echo "No analytics status changes."
          else
            git commit -m "chore: refresh analytics sync status"
            git push
          fi

      - name: Fail workflow when sync failed
        if: steps.fetch.outcome != 'success'
        run: |
          echo "Analytics sync failed. Open /analytics/ to see the exact diagnostic message."
          exit 1

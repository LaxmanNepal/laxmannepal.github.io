name: Refresh laptop catalogue
on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Refresh retailer offers
        run: python laptop-price-in-nepal/scripts/refresh_prices.py
      - name: Validate catalogue
        run: |
          python - <<'PY'
          import json
          p='laptop-price-in-nepal/data/laptops.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['products'] and d['stores']
          for x in d['products']:
              assert x['id'] and x['brand'] and x['name'] and x['offers']
              assert min(o['price'] for o in x['offers']) == x['priceFrom']
          print(f"Validated {len(d['products'])} laptops and {len(d['stores'])} stores")
          PY
      - name: Commit refreshed catalogue
        run: |
          git config user.name 'Laxman Nepal Bot'
          git config user.email '84069546+LaxmanNepal@users.noreply.github.com'
          git diff --quiet && echo 'No catalogue changes to commit.' || (git add laptop-price-in-nepal/data/laptops.json && git commit -m 'chore: refresh laptop catalogue' && git push)

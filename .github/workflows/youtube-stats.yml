name: Update YouTube Stats
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - '.github/workflows/youtube-stats.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public YouTube channel statistics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          key=os.environ.get('YOUTUBE_API_KEY')
          if not key:
              raise SystemExit('Missing YOUTUBE_API_KEY repository secret')
          params=urllib.parse.urlencode({'part':'snippet,statistics','forHandle':'@laxmannepalofficial','key':key})
          url='https://www.googleapis.com/youtube/v3/channels?'+params
          with urllib.request.urlopen(url, timeout=30) as r: data=json.load(r)
          if not data.get('items'): raise SystemExit('YouTube channel not found')
          s=data['items'][0]['statistics']
          out={'subscriberCount':int(s.get('subscriberCount',0)),'viewCount':int(s.get('viewCount',0)),'videoCount':int(s.get('videoCount',0)),'updatedAt':__import__('datetime').datetime.utcnow().isoformat()+'Z','watchTimeText':None}
          os.makedirs('data',exist_ok=True)
          json.dump(out,open('data/youtube.json','w'),indent=2)
          PY
      - name: Commit updated stats
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/youtube.json
          git diff --cached --quiet || git commit -m "chore: update YouTube statistics"
          git push

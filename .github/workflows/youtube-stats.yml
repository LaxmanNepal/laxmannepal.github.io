name: Update YouTube Analytics Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - '.github/workflows/youtube-stats.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-oauthlib

      - name: Build YouTube analytics dataset
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python <<'PY'
          import json, os, datetime, urllib.parse, urllib.request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          required = ['YOUTUBE_API_KEY','YOUTUBE_CLIENT_ID','YOUTUBE_CLIENT_SECRET','YOUTUBE_REFRESH_TOKEN']
          missing = [x for x in required if not os.environ.get(x)]
          if missing:
              raise SystemExit('Missing GitHub secrets: ' + ', '.join(missing))

          creds = Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/yt-analytics.readonly'],
          )
          analytics = build('youtubeAnalytics', 'v2', credentials=creds)
          today = datetime.date.today()
          end = today - datetime.timedelta(days=2)
          start = datetime.date(2008, 1, 1)
          last30 = end - datetime.timedelta(days=29)

          def query(start_date, end_date, metrics, dimensions=None, sort=None, max_results=None):
              args = {'ids':'channel==MINE','startDate':start_date.isoformat(),'endDate':end_date.isoformat(),'metrics':metrics}
              if dimensions: args['dimensions'] = dimensions
              if sort: args['sort'] = sort
              if max_results: args['maxResults'] = max_results
              return analytics.reports().query(**args).execute()

          lifetime = query(start, end, 'views,estimatedMinutesWatched,averageViewDuration,likes,comments,subscribersGained,subscribersLost')
          recent = query(last30, end, 'views,estimatedMinutesWatched,averageViewDuration,likes,comments,subscribersGained,subscribersLost', 'day', 'day')
          top = query(last30, end, 'views,estimatedMinutesWatched,averageViewDuration,likes,comments,subscribersGained', 'video', '-estimatedMinutesWatched', 10)

          params = urllib.parse.urlencode({'part':'snippet,statistics','forHandle':'@laxmannepalofficial','key':os.environ['YOUTUBE_API_KEY']})
          with urllib.request.urlopen('https://www.googleapis.com/youtube/v3/channels?' + params, timeout=30) as r:
              channel = json.load(r)
          if not channel.get('items'):
              raise SystemExit('YouTube channel @laxmannepalofficial not found')
          channel_item = channel['items'][0]
          stats = channel_item['statistics']

          def first_map(report):
              headers = [h['name'] for h in report.get('columnHeaders', [])]
              row = report.get('rows', [None])[0]
              return dict(zip(headers, row)) if row else {}
          def num(v):
              try: return float(v)
              except: return 0

          life = first_map(lifetime)
          daily_headers = [h['name'] for h in recent.get('columnHeaders', [])]
          daily = [dict(zip(daily_headers, row)) for row in recent.get('rows', [])]
          top_headers = [h['name'] for h in top.get('columnHeaders', [])]
          top_items = [dict(zip(top_headers, row)) for row in top.get('rows', [])]

          video_ids = [x.get('video') for x in top_items if x.get('video')]
          titles = {}
          if video_ids:
              p = urllib.parse.urlencode({'part':'snippet','id':','.join(video_ids),'key':os.environ['YOUTUBE_API_KEY']})
              with urllib.request.urlopen('https://www.googleapis.com/youtube/v3/videos?' + p, timeout=30) as r:
                  vids = json.load(r)
              titles = {x['id']: x['snippet']['title'] for x in vids.get('items', [])}
          for item in top_items:
              vid = item.get('video')
              item['title'] = titles.get(vid, 'Untitled video')
              item['thumbnail'] = f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg'
              item['url'] = f'https://www.youtube.com/watch?v={vid}'

          watch_minutes = num(life.get('estimatedMinutesWatched'))
          avg_seconds = num(life.get('averageViewDuration'))
          hours = watch_minutes / 60
          if hours >= 1000:
              watch_text = f'{hours/1000:.1f}K hours'
          else:
              watch_text = f'{hours:,.0f} hours'

          data = {
              'updatedAt': datetime.datetime.utcnow().replace(microsecond=0).isoformat() + 'Z',
              'subscriberCount': int(stats.get('subscriberCount', 0)),
              'viewCount': int(stats.get('viewCount', 0)),
              'videoCount': int(stats.get('videoCount', 0)),
              'watchTimeText': watch_text,
              'channel': {'id': channel_item['id'], 'title': channel_item['snippet']['title'], 'subscriberCount': int(stats.get('subscriberCount',0)), 'viewCount': int(stats.get('viewCount',0)), 'videoCount': int(stats.get('videoCount',0))},
              'analytics': {'lifetimeViews': int(num(life.get('views'))), 'watchTimeMinutes': int(watch_minutes), 'watchTimeHours': round(hours,2), 'averageViewDurationSeconds': int(avg_seconds), 'likes': int(num(life.get('likes'))), 'comments': int(num(life.get('comments'))), 'subscribersGained': int(num(life.get('subscribersGained'))), 'subscribersLost': int(num(life.get('subscribersLost')))},
              'last30Days': {'start': last30.isoformat(), 'end': end.isoformat(), 'daily': daily},
              'topVideos': top_items
          }
          os.makedirs('data', exist_ok=True)
          with open('data/youtube.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          print('Updated YouTube analytics:', data['updatedAt'])
          print('Subscribers:', data['subscriberCount'], 'Views:', data['viewCount'], 'Videos:', data['videoCount'], 'Watch time:', watch_text)
          PY

      - name: Commit updated dashboard data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/youtube.json
          git diff --cached --quiet || git commit -m "chore: update YouTube analytics dashboard"
          git push

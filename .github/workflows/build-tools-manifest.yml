name: Build tools directory manifest

on:
  push:
    branches: [main]
    paths:
      - 'tools/**/*.html'
      - 'tools/**/*.htm'
      - 'tools/tools-meta.json'
      - '.github/workflows/build-tools-manifest.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: main-automation-commits
  cancel-in-progress: false

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate tools.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path("tools")
          extensions = {".html", ".htm"}
          logo_names = {"logo.svg", "logo.png", "logo.webp", "logo.jpg", "logo.jpeg",
                        "icon.svg", "icon.png", "icon.webp", "icon.jpg", "icon.jpeg",
                        "favicon.svg", "favicon.png", "favicon.webp", "favicon.ico",
                        "apple-touch-icon.png"}
          metadata_path = root / "tools-meta.json"
          metadata = json.loads(metadata_path.read_text(encoding="utf-8")) if metadata_path.exists() else {}
          entries = []
          for page in sorted(root.rglob("*")):
              if not page.is_file() or page.suffix.lower() not in extensions:
                  continue
              rel = page.as_posix()
              if rel.lower() == "tools/index.html":
                  continue
              folder = page.parent
              logos = sorted(
                  p for p in folder.rglob("*")
                  if p.is_file() and p.name.lower() in logo_names
              )
              logo = "/" + logos[0].as_posix() if logos else ""
              details = metadata.get(rel, {})
              entries.append({
                  "path": rel,
                  "logo": logo,
                  "name": details.get("name", page.parent.name.replace("-", " ").title() if page.name.lower() == "index.html" else page.stem.replace("-", " ").replace("_", " ").title()),
                  "description": details.get("description", ""),
                  "category": details.get("category", "Other"),
                  "icon": details.get("icon", "fa-solid fa-screwdriver-wrench")
              })

          manifest = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "count": len(entries),
              "tools": entries
          }
          target = root / "tools.json"
          target.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Generated {target} with {len(entries)} tool pages")
          PY

      - name: Commit manifest when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tools.json
          if git diff --cached --quiet; then
            echo "Manifest is already up to date."
          else
            git commit -m "chore: refresh tools directory manifest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Create SEO Fix PR

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-seo-pr:
    if: startsWith(github.event.issue.title, '[SEO Fix]') && (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse SEO fix request
        id: parse
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          body=os.environ.get("BODY","")
          def get(name):
              m=re.search(r"<!-- SEO_FIX_"+re.escape(name)+r":\s*(.*?)\s*-->", body, re.S)
              return (m.group(1).strip() if m else "")
          path=get("PATH").lstrip("/")
          title=get("TITLE")
          description=get("DESCRIPTION")
          h1=get("H1")
          if not path or ".." in Path(path).parts or not path.endswith(".html"):
              raise SystemExit("Invalid SEO fix path.")
          if not title or not description or not h1:
              raise SystemExit("SEO fix request is missing title, description, or H1.")
          if any(x in value for value in (title, description, h1) for x in ("<", ">")):
              raise SystemExit("SEO fix content must not contain HTML angle brackets.")
          if len(title)>70 or len(description)>180 or len(h1)>120:
              raise SystemExit("SEO fix content exceeds safety limits.")
          if not Path(path).is_file():
              raise SystemExit(f"Target file does not exist: {path}")
          Path("/tmp/seo_path").write_text(path)
          Path("/tmp/seo_title").write_text(title)
          Path("/tmp/seo_description").write_text(description)
          Path("/tmp/seo_h1").write_text(h1)
          PY
          {
            echo "path=$(cat /tmp/seo_path)"
            echo "title<<EOF"
            cat /tmp/seo_title
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Capture before-state
        env:
          SEO_PATH: ${{ steps.parse.outputs.path }}
        run: cp "$SEO_PATH" /tmp/seo-before.html

      - name: Apply SEO metadata
        env:
          SEO_PATH: ${{ steps.parse.outputs.path }}
          SEO_TITLE: ${{ steps.parse.outputs.title }}
        run: |
          python3 scripts/apply_seo_fix.py "$SEO_PATH" "$SEO_TITLE" "$(cat /tmp/seo_description)" "$(cat /tmp/seo_h1)"

      - name: Check diff
        id: diff
        run: |
          git diff --check
          git diff -- "${{ steps.parse.outputs.path }}"
          if git diff --quiet -- "${{ steps.parse.outputs.path }}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate SEO fix
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path=Path("${{ steps.parse.outputs.path }}")
          html=path.read_text(encoding="utf-8")
          title=re.search(r"<title\\b[^>]*>(.*?)</title>",html,re.I|re.S)
          desc=re.search(r'<meta\\b[^>]*\\bname=["\']description["\'][^>]*\\bcontent=["\'](.*?)["\']',html,re.I|re.S)
          h1=re.findall(r"<h1\\b[^>]*>(.*?)</h1>",html,re.I|re.S)
          if not title or not (30 <= len(re.sub(r"<.*?>","",title.group(1)).strip()) <= 60):
              raise SystemExit("SEO validation failed: title must be 30-60 characters.")
          if not desc or not (70 <= len(desc.group(1).strip()) <= 160):
              raise SystemExit("SEO validation failed: meta description must be 70-160 characters.")
          if len(h1) != 1:
              raise SystemExit(f"SEO validation failed: expected exactly one H1, found {len(h1)}.")
          print("SEO metadata validation passed.")
          PY
          git diff --check

      - name: Build site validation
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 scripts/build_site.py
          python3 scripts/generate_seo.py
          test -f index.html
          test -f sitemap.xml
          echo "Site build and SEO discovery validation passed."

      - name: Build PR intelligence report
        if: steps.diff.outputs.changed == 'true'
        env:
          SEO_PATH: ${{ steps.parse.outputs.path }}
        run: |
          python3 scripts/generate_seo_pr_intelligence.py "$SEO_PATH" /tmp/seo-before.html "$SEO_PATH" /tmp/seo-pr-body.md
          cat /tmp/seo-pr-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create branch and commit
        if: steps.diff.outputs.changed == 'true'
        id: commit
        env:
          ISSUE: ${{ github.event.issue.number }}
          PATH_VALUE: ${{ steps.parse.outputs.path }}
        run: |
          BRANCH="seo-fix/issue-$ISSUE"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PATH_VALUE"
          git commit -m "seo: improve metadata for $PATH_VALUE"
          git push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          PATH_VALUE: ${{ steps.parse.outputs.path }}
        run: |
          {
            echo "## SEO Fix Center request"
            echo
            echo "Source issue: #$ISSUE"
            echo "Target page: $PATH_VALUE"
            echo
            cat /tmp/seo-pr-body.md
          } > /tmp/final-pr-body.md
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "SEO: improve $PATH_VALUE" --body-file /tmp/final-pr-body.md)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Add PR validation comment
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: gh pr comment "$PR_URL" --body-file /tmp/seo-pr-body.md

      - name: Comment on source issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          CHANGED: ${{ steps.diff.outputs.changed }}
          PR_URL: ${{ steps.commit.outputs.pr_url }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            gh issue comment "$ISSUE" --body "✅ SEO Fix Center created a reviewable pull request: $PR_URL. The PR includes before/after SEO evidence and automated validation. Please review before merging."
          else
            gh issue comment "$ISSUE" --body "ℹ️ SEO Fix Center found no file changes to apply. The proposed values may already match the page."
          fi

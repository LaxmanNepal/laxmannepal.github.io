name: Sync Blogger posts

on:
  push:
    paths:
      - '.github/workflows/blogger-import.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Import Blogger Atom feed
        run: |
          rm -rf blogger-import
          python3 scripts/import_blogger.py --clean

      - name: Verify Blogger import
        run: |
          test -f .blogger-migration.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.blogger-migration.json').read_text())
          count = data['imported_posts']
          print(f'Imported Blogger posts: {count}')
          if count < 1:
              raise SystemExit('No Blogger posts imported')
          feed_total = data.get('total_feed_entries', count)
          if count != feed_total:
              raise SystemExit(f'Import incomplete: feed reports {feed_total}, imported {count}')
          PY

      - name: Commit imported posts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No Blogger changes to commit.'
          else
            git commit -m 'Sync Blogger posts into repository URL paths'
            git push
          fi

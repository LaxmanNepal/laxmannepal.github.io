name: Update search index

on:
  push:
    branches: [main]
    paths-ignore:
      - "search-index.json"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-index-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate index generator
        run: |
          python3 -m unittest discover -s tests -p "test_search_index.py" -v
          python3 scripts/generate_search_index.py
          python3 -m json.tool search-index.json > /dev/null
      - name: Commit index when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/generate_search_index.py
            if git diff --quiet -- search-index.json; then
              echo "Search index is already up to date."
              exit 0
            fi
            git add search-index.json
            git commit -m "chore: refresh search index"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retrying from latest main (attempt $attempt)."
            git reset --hard origin/main
          done
          echo "Unable to publish index after three attempts."
          exit 1

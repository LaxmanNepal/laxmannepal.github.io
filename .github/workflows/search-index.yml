name: Update search index

on:
  push:
    branches: [main]
    paths-ignore:
      - "search-index.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate search index
        run: python3 scripts/generate_search_index.py

      - name: Commit index when changed
        run: |
          if git diff --quiet -- search-index.json; then
            echo "Search index is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-index.json
          git commit -m "chore: refresh search index"
          git push

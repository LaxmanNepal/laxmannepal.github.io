<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Opening Daraz — Laxman Nepal</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8fb;color:#101828;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}.box{width:min(520px,calc(100% - 28px));padding:28px;border:1px solid #e4e7ec;border-radius:20px;background:#fff;text-align:center;box-shadow:0 12px 35px #10182810}h1{font-size:24px;margin:0 0 10px}p{color:#667085;line-height:1.6}.btn{display:inline-block;margin-top:10px;padding:11px 16px;border-radius:10px;background:#111827;color:#fff;text-decoration:none;font-weight:800}.small{font-size:12px;margin-top:16px}
</style>
</head>
<body>
<main class="box">
<div style="font-size:42px">🛒</div>
<h1>Opening Daraz…</h1>
<p id="message">Taking you to the retailer page through LaxmanNepal.</p>
<a id="continue" class="btn" href="#" rel="noopener noreferrer">Continue to Daraz</a>
<p class="small">LaxmanNepal is currently providing a simple redirect to the retailer. No affiliate tracking is applied unless separately enabled.</p>
</main>
<script>
(function(){
 'use strict';
 const params=new URLSearchParams(location.search),raw=params.get('url')||'',product=params.get('product')||'';
 const message=document.getElementById('message'),link=document.getElementById('continue');
 let destination=null;
 try{
   const url=new URL(raw,location.origin);
   const host=url.hostname.toLowerCase();
   if(host==='daraz.com.np'||host.endsWith('.daraz.com.np')) destination=url.href;
 }catch(e){}
 if(!destination){
   message.textContent='The retailer link is missing or invalid.';
   link.style.display='none';
   return;
 }
 link.href=destination;
 message.textContent=product ? 'Opening the Daraz listing for '+product+'…' : 'Opening the Daraz retailer listing…';
 setTimeout(function(){location.replace(destination)},700);
})();
</script>
</body>
</html>

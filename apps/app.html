<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App — Laxman Nepal</title>
<meta name="description" content="Explore an app from the Laxman Nepal digital ecosystem.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://apps.laxmannepal.com.np/apps/app.html">
<meta property="og:type" content="website">
<meta property="og:title" content="App — Laxman Nepal">
<meta property="og:description" content="Explore an app from the Laxman Nepal digital ecosystem.">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--blue:#1677ff;--green:#12b76a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}main{max-width:1000px;margin:auto;padding:24px 18px 70px}.back{color:var(--muted);text-decoration:none;font-weight:700}.hero{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:28px}.icon{width:78px;height:78px;border-radius:22px;display:grid;place-items:center;background:#f2f6ff;font-size:2.8rem;margin-bottom:20px}.eyebrow{font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}h1{font-size:clamp(2.3rem,7vw,4.5rem);letter-spacing:-.055em;line-height:1;margin:8px 0 15px}.desc{font-size:1.08rem;line-height:1.7;color:var(--muted);max-width:760px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-block;text-decoration:none;padding:13px 18px;border-radius:14px;font-weight:800}.primary{background:var(--text);color:#fff}.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.status{display:inline-block;font-size:.76rem;font-weight:800;padding:6px 10px;border-radius:999px;background:#ecfdf3;color:#087443}.status.offline{background:#fef3f2;color:#b42318}.status.unknown{background:#f2f4f7;color:#475467}.section{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px}.section h2{margin:0 0 15px;font-size:1.25rem}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.fact{padding:15px;border:1px solid var(--line);border-radius:16px}.fact b{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px}.fact span{font-weight:750}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#f2f4f7;border-radius:999px;padding:8px 11px;font-size:.82rem}.related{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.related a{text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.related .ri{font-size:1.7rem}.related b{display:block;margin-top:9px}.error{text-align:center;padding:60px 20px}.hidden{display:none}@media(max-width:600px){.hero{padding:22px}.facts{grid-template-columns:1fr}.actions .btn{width:100%;text-align:center}}
</style>
</head>
<body>
<main>
<a class="back" href="./">← All Apps</a>
<div id="error" class="error hidden"><h1>App not found</h1><p class="desc" style="margin:auto">The requested app could not be found in the app registry.</p></div>
<div id="content" class="hidden">
<section class="hero"><div id="icon" class="icon">📱</div><div id="category" class="eyebrow">APP</div><h1 id="name">App</h1><div id="status"></div><p id="description" class="desc"></p><div class="actions"><a id="open" class="btn primary" href="#">Open App →</a><a class="btn secondary" href="./">Browse All Apps</a></div></section>
<section class="section"><h2>App Insights</h2><div class="facts"><div class="fact"><b>Category</b><span id="factCategory">—</span></div><div class="fact"><b>Availability</b><span id="factStatus">—</span></div><div class="fact"><b>Last health check</b><span id="factChecked">—</span></div></div></section>
<section id="featuresSection" class="section hidden"><h2>Features & topics</h2><div id="chips" class="chips"></div></section>
<section id="relatedSection" class="section hidden"><h2>Related Apps</h2><div id="related" class="related"></div></section>
</div>
</main>
<script src="../assets/apps-loader.js?v=3"></script>
<script>
(()=>{'use strict';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatDate=v=>{if(!v)return'Not available';const d=new Date(v);return Number.isNaN(d.getTime())?'Not available':d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})};
const setMeta=(title,desc)=>{document.title=title+' — Laxman Nepal';document.querySelector('meta[name="description"]').setAttribute('content',desc);document.querySelector('meta[property="og:title"]').setAttribute('content',title+' — Laxman Nepal');document.querySelector('meta[property="og:description"]').setAttribute('content',desc)};
const badge=a=>a.status==='online'?'<span class="status">● Online</span>':a.status==='offline'?'<span class="status offline">● Offline</span>':'<span class="status unknown">● Unknown</span>';
async function init(){let apps=[];try{const data=await window.LaxmanApps.load();apps=Array.isArray(data.apps)?data.apps:[]}catch(e){}const p=new URLSearchParams(location.search);const id=p.get('id');const a=apps.find(x=>x.id===id);if(!a){document.getElementById('error').classList.remove('hidden');return}document.getElementById('content').classList.remove('hidden');document.getElementById('icon').textContent=a.icon||'📱';document.getElementById('category').textContent=a.category||'APP';document.getElementById('name').textContent=a.name;document.getElementById('description').textContent=a.description||'Explore this app from the Laxman Nepal digital ecosystem.';document.getElementById('status').innerHTML=badge(a);document.getElementById('open').href=a.url;document.getElementById('factCategory').textContent=a.category||'—';document.getElementById('factStatus').textContent=a.status==='online'?'Online':a.status==='offline'?'Offline':'Unknown';document.getElementById('factChecked').textContent=formatDate(a.lastChecked);setMeta(a.name,a.description||'Explore '+a.name+' from the Laxman Nepal digital ecosystem.');const keywords=Array.isArray(a.keywords)?a.keywords:[];if(keywords.length){document.getElementById('featuresSection').classList.remove('hidden');document.getElementById('chips').innerHTML=keywords.map(k=>'<span class="chip">'+esc(k)+'</span>').join('')}const related=apps.filter(x=>x.id!==a.id&&x.category===a.category).slice(0,4);if(related.length){document.getElementById('relatedSection').classList.remove('hidden');document.getElementById('related').innerHTML=related.map(x=>'<a href="./app.html?id='+encodeURIComponent(x.id)+'"><span class="ri">'+esc(x.icon||'📱')+'</span><b>'+esc(x.name)+'</b><small style="color:var(--muted)">'+esc(x.description||'')+'</small></a>').join('')}}init();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps & Tools — Laxman Nepal</title>
<meta name="description" content="Explore web apps and digital tools by Laxman Nepal.">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/light.css">
<link rel="stylesheet" href="/assets/css/gadgetbyte-home.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{color-scheme:light;--apps-bg:#f5f5f5;--apps-card:#fff;--apps-border:#e5e7eb;--apps-text:#111;--apps-muted:#6b7280}
.apps-page{margin:0;background:var(--apps-bg);color:var(--apps-text)}
.apps-main{max-width:1240px;margin:auto;padding:42px 16px 80px}.apps-top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}.apps-kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#e11d48;margin-bottom:8px}.apps-title{font-size:clamp(38px,5vw,62px);line-height:.98;letter-spacing:-.05em;margin:0;font-weight:900}.apps-subtitle{margin:12px 0 0;color:var(--apps-muted);font-size:14px}.apps-count{padding:9px 13px;border:1px solid var(--apps-border);border-radius:999px;background:#fff;font-size:12px;font-weight:800}.apps-toolbar{margin-bottom:22px}.search-wrap{position:relative}.search-wrap i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#9ca3af}.apps-search{width:100%;height:48px;border:1px solid var(--apps-border);border-radius:10px;background:#fff;padding:0 16px 0 43px;outline:none;font-size:14px}.apps-search:focus{border-color:#111;box-shadow:0 0 0 3px rgba(17,17,17,.06)}.apps-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.app-card{position:relative;display:flex;align-items:center;min-height:112px;padding:20px;text-decoration:none;color:inherit;background:var(--apps-card);border:1px solid var(--apps-border);border-radius:12px;box-shadow:0 5px 18px rgba(0,0,0,.045);overflow:hidden;transition:.2s transform,.2s box-shadow,.2s border-color}.app-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.09);border-color:#d1d5db}.app-icon{width:48px;height:48px;flex:none;border-radius:11px;display:grid;place-items:center;background:#111;color:#fff;font-size:18px}.app-info{min-width:0;padding-left:13px}.app-name{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.app-open{display:flex;align-items:center;gap:5px;margin-top:5px;color:#9ca3af;font-size:11px;font-weight:700}.app-open i{font-size:9px}.empty{display:none;text-align:center;padding:55px 20px;color:var(--apps-muted);grid-column:1/-1}.apps-footnote{text-align:center;margin-top:30px;color:#9ca3af;font-size:11px}
@media(max-width:1050px){.apps-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.apps-main{padding:32px 10px 60px}.apps-top{display:block}.apps-count{display:inline-block;margin-top:15px}.apps-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.app-card{min-height:100px;padding:15px}.app-icon{width:44px;height:44px;border-radius:10px;font-size:17px}.app-info{padding-left:10px}.app-name{font-size:14px}}@media(max-width:460px){.apps-grid{grid-template-columns:1fr}.app-card{min-height:82px}.apps-title{font-size:40px}}
</style>
</head>
<body class="gb-page apps-page">
<div id="site-header"></div>
<main class="apps-main">
<section class="apps-top"><div><div class="apps-kicker"><i class="fa-solid fa-sparkles"></i> Laxman Nepal</div><h1 class="apps-title">Apps & Tools</h1><p class="apps-subtitle">Everything I've built, in one simple place.</p></div><div class="apps-count" id="app-count">Loading apps…</div></section>
<div class="apps-toolbar"><div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="app-search" class="apps-search" type="search" placeholder="Search apps…" autocomplete="off"></div></div>
<section id="apps-grid" class="apps-grid"><div class="empty" style="display:block">Loading apps…</div></section>
<p class="apps-footnote">New projects with a live homepage link are added automatically.</p>
</main>
<div id="site-footer"></div>
<script>
/* UNIVERSAL RULE: header, both navigation rows, and footer are copied from the repository homepage. */
async function loadUniversalShell(){
 try{
  const response=await fetch('/?universal-shell='+Date.now(),{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw new Error('Homepage unavailable');
  const doc=new DOMParser().parseFromString(await response.text(),'text/html');
  const header=doc.querySelector('header.gb-header');const footer=doc.querySelector('footer.gb-footer');
  if(!header||!footer)throw new Error('Homepage header/footer not found');
  document.getElementById('site-header').replaceChildren(document.importNode(header,true));
  document.getElementById('site-footer').replaceChildren(document.importNode(footer,true));
  const mobile=document.getElementById('gb-mobile');mobile?.addEventListener('click',()=>document.querySelector('.gb-menu')?.classList.toggle('open'));
  const year=document.getElementById('year');if(year)year.textContent=new Date().getFullYear();
 }catch(error){console.error(error);document.getElementById('site-header').innerHTML='<div style="padding:16px;text-align:center">Unable to load universal site navigation.</div>';}
}
const icons=['fa-table-cells','fa-calendar-days','fa-wand-magic-sparkles','fa-link','fa-book-open','fa-chart-line','fa-robot','fa-globe','fa-code','fa-bolt'];let allApps=[];
async function loadApps(){const grid=document.getElementById('apps-grid'),count=document.getElementById('app-count');try{const r=await fetch('https://api.github.com/users/LaxmanNepal/repos?per_page=100&sort=updated',{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub API failed');const repos=await r.json();allApps=repos.filter(x=>!x.fork&&!x.archived&&x.homepage&&/^https?:\/\//i.test(x.homepage)).map((x,i)=>({name:x.name.replace(/[-_]+/g,' '),url:x.homepage.trim(),icon:icons[i%icons.length]}));allApps.sort((a,b)=>a.name.localeCompare(b.name));renderApps(allApps)}catch(e){grid.innerHTML='<div class="empty" style="display:block">Apps could not be loaded right now.</div>';count.textContent=''}}
function renderApps(apps){const grid=document.getElementById('apps-grid'),count=document.getElementById('app-count');count.textContent=apps.length+' '+(apps.length===1?'app':'apps');if(!apps.length){grid.innerHTML='<div class="empty" style="display:block">No apps found.</div>';return}grid.innerHTML=apps.map(a=>`<a class="app-card" href="${escapeAttr(a.url)}"><span class="app-icon"><i class="fa-solid ${a.icon}"></i></span><span class="app-info"><span class="app-name">${escapeHtml(a.name)}</span><span class="app-open">Open app <i class="fa-solid fa-arrow-right"></i></span></span></a>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s)}
document.getElementById('app-search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();renderApps(allApps.filter(a=>a.name.toLowerCase().includes(q)||a.url.toLowerCase().includes(q)))});
loadUniversalShell();loadApps();
</script>
</body>
</html>

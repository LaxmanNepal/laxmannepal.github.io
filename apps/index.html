<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<meta name="description" content="Laxman Nepal Apps — useful digital tools and applications.">
<meta name="author" content="Laxman Nepal">
<link rel="canonical" href="https://apps.laxmannepal.com.np/apps/">
<meta property="og:title" content="Apps — Laxman Nepal">
<meta property="og:description" content="Useful apps and digital tools by Laxman Nepal.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://apps.laxmannepal.com.np/apps/">
<title>Apps — Laxman Nepal</title>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/light.css">
<link rel="stylesheet" href="/assets/css/gadgetbyte-home.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--apps-bg:#f6f7f9;--apps-card:#fff;--apps-text:#111827;--apps-muted:#667085;--apps-border:rgba(0,0,0,.08)}
body.apps-page{margin:0;background:var(--apps-bg);color:var(--apps-text)}
.apps-main{padding:48px 0 72px}.apps-container{width:min(1180px,calc(100% - 32px));margin:auto}
.apps-heading{text-align:center;max-width:760px;margin:0 auto 42px}.apps-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:#111;color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.apps-heading h1{font-size:clamp(38px,6vw,64px);line-height:1.02;letter-spacing:-.045em;margin:18px 0 14px}.apps-heading p{font-size:18px;line-height:1.6;color:var(--apps-muted);margin:0}
.apps-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}.apps-search{flex:1;max-width:520px;position:relative}.apps-search i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#98a2b3}.apps-search input{width:100%;box-sizing:border-box;border:1px solid var(--apps-border);background:#fff;border-radius:14px;padding:13px 16px 13px 42px;font:inherit;outline:none}.apps-search input:focus{border-color:#111}.apps-count{color:var(--apps-muted);font-size:14px;font-weight:700}
.apps-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.app-card{display:flex;flex-direction:column;min-height:230px;background:var(--apps-card);border:1px solid var(--apps-border);border-radius:22px;padding:22px;text-decoration:none;color:inherit;box-shadow:0 8px 30px rgba(16,24,40,.04);transition:transform .2s,box-shadow .2s,border-color .2s}.app-card:hover{transform:translateY(-4px);box-shadow:0 18px 45px rgba(16,24,40,.1);border-color:rgba(0,0,0,.15)}.app-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.app-icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:#f0f2f5;color:#111;font-size:22px;margin-bottom:20px;flex:0 0 auto}.repo-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:11px;font-weight:800;white-space:nowrap}.app-card h2{font-size:21px;line-height:1.2;margin:0 0 9px}.app-card p{font-size:14px;line-height:1.55;color:var(--apps-muted);margin:0}.app-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:20px;font-size:12px;font-weight:800;color:#667085}.app-links{display:flex;gap:10px;flex-wrap:wrap}.app-link{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;background:#f8f9fb;color:#344054;text-decoration:none}.app-link:hover{background:#eef0f3;color:#111}.app-arrow{font-size:18px;color:#111}
.apps-loading,.apps-empty,.apps-error{display:none;text-align:center;padding:50px 20px;color:var(--apps-muted)}
.apps-loading{display:block}.apps-error{margin:0 auto 24px;padding:14px 16px;border-radius:12px;background:#fff4f4;color:#b42318;font-size:14px}
@media(max-width:900px){.apps-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.apps-main{padding:32px 0 54px}.apps-container{width:min(100% - 22px,1180px)}.apps-heading{margin-bottom:30px}.apps-heading h1{font-size:44px}.apps-heading p{font-size:16px}.apps-toolbar{display:block}.apps-search{max-width:none}.apps-count{display:block;margin-top:12px}.apps-grid{grid-template-columns:1fr;gap:14px}.app-card{min-height:205px}}
</style>
</head>
<body class="apps-page">
<!-- Universal shell: header/navbar/footer are imported from the live homepage at /. Do not duplicate them here. -->
<div id="site-header"></div>
<main class="apps-main">
<div class="apps-container">
<section class="apps-heading">
<span class="apps-eyebrow"><i class="fa-solid fa-table-cells"></i> Laxman Nepal</span>
<h1>Apps & Tools</h1>
<p>Every public GitHub project that has a live website link configured in its repository settings.</p>
</section>
<div id="apps-error" class="apps-error"></div>
<div class="apps-toolbar">
<label class="apps-search"><i class="fa-solid fa-magnifying-glass"></i><input id="apps-search" type="search" placeholder="Search projects..." aria-label="Search projects"></label>
<span id="apps-count" class="apps-count">Loading projects…</span>
</div>
<section id="apps-grid" class="apps-grid" aria-label="GitHub projects"></section>
<div id="apps-loading" class="apps-loading">Loading projects from GitHub…</div>
<div id="apps-empty" class="apps-empty">No projects match your search.</div>
</div>
</main>
<div id="site-footer"></div>
<script>
/*
  UNIVERSAL SITE SHELL
  The homepage is the single source of truth for the header, navbar and footer.
  Any future edit made to /index.html is automatically reflected on /apps/.
*/
async function loadUniversalShell(){
  const response=await fetch('/?shell='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('Homepage shell could not be loaded.');
  const html=await response.text();
  const doc=new DOMParser().parseFromString(html,'text/html');
  const header=doc.querySelector('header.gb-header');
  const footer=doc.querySelector('footer.gb-footer');
  if(!header||!footer)throw new Error('Homepage header or footer was not found.');
  document.getElementById('site-header').replaceChildren(document.importNode(header,true));
  document.getElementById('site-footer').replaceChildren(document.importNode(footer,true));
  const menu=document.getElementById('gb-mobile');
  menu?.addEventListener('click',()=>document.querySelector('.gb-menu')?.classList.toggle('open'));
  const year=document.getElementById('year');
  if(year)year.textContent=new Date().getFullYear();
}

/*
  LIVE PROJECT DIRECTORY
  GitHub's public API is the source of truth. Only repositories with a
  configured homepage/live link are shown, so new linked projects appear here
  automatically without editing this page.
*/
let PROJECTS=[];

async function loadProjects(){
  const response=await fetch('https://api.github.com/users/LaxmanNepal/repos?per_page=100&sort=updated');
  if(!response.ok)throw new Error('GitHub project list could not be loaded.');
  const repos=await response.json();
  PROJECTS=repos
    .filter(repo=>!repo.fork && repo.homepage && repo.homepage.trim())
    .map(repo=>({
      name:repo.name,
      description:repo.description || 'GitHub project by Laxman Nepal.',
      live:repo.homepage.trim(),
      github:repo.html_url,
      language:repo.language || 'Web project',
      updated:repo.updated_at
    }));
  renderProjects();
}

function renderProjects(query=''){
  const q=query.trim().toLowerCase();
  const filtered=PROJECTS.filter(p=>`${p.name} ${p.description} ${p.language}`.toLowerCase().includes(q));
  const grid=document.getElementById('apps-grid');
  grid.innerHTML=filtered.map(p=>`<article class="app-card">
    <div class="app-top">
      <div class="app-icon"><i class="fa-solid fa-cubes"></i></div>
      <span class="repo-badge"><i class="fa-brands fa-github"></i> GitHub</span>
    </div>
    <h2>${escapeHtml(p.name)}</h2>
    <p>${escapeHtml(p.description)}</p>
    <div class="app-meta">
      <span>${escapeHtml(p.language)}</span>
      <div class="app-links">
        <a class="app-link" href="${safeUrl(p.live)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> Live</a>
        <a class="app-link" href="${safeUrl(p.github)}" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i> Repo</a>
      </div>
    </div>
  </article>`).join('');
  document.getElementById('apps-count').textContent=`${filtered.length} ${filtered.length===1?'project':'projects'}`;
  document.getElementById('apps-empty').style.display=filtered.length?'none':'block';
}

function escapeHtml(value){
  return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
function safeUrl(value){
  try{
    const url=new URL(value);
    return ['http:','https:'].includes(url.protocol)?url.href:'#';
  }catch{return '#';}
}

(async()=>{
  try{await loadUniversalShell();}catch(error){
    const box=document.getElementById('apps-error');box.textContent='The universal site navigation could not be loaded. Please refresh the page.';box.style.display='block';console.error(error);
  }
  try{await loadProjects();}catch(error){
    document.getElementById('apps-loading').style.display='none';
    const box=document.getElementById('apps-error');box.textContent='GitHub projects could not be loaded right now. Please refresh the page.';box.style.display='block';console.error(error);
  }
  document.getElementById('apps-loading').style.display='none';
  document.getElementById('apps-search').addEventListener('input',e=>renderProjects(e.target.value));
})();
</script>
</body>
</html>

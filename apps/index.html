<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps & Tools — Laxman Nepal</title>
<meta name="description" content="Explore web apps and digital tools by Laxman Nepal.">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/light.css">
<link rel="stylesheet" href="/assets/css/gadgetbyte-home.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{color-scheme:light;--apps-bg:#f5f5f5;--apps-card:#fff;--apps-border:#e5e7eb;--apps-text:#111;--apps-muted:#6b7280}
html{scroll-behavior:smooth}.apps-page{margin:0;background:var(--apps-bg);color:var(--apps-text)}
#site-header{position:sticky;top:0;z-index:9999;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.apps-main{max-width:1240px;margin:auto;padding:42px 16px 80px}.apps-top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}.apps-kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#e11d48;margin-bottom:8px}.apps-title{font-size:clamp(38px,5vw,62px);line-height:.98;letter-spacing:-.05em;margin:0;font-weight:900}.apps-subtitle{margin:12px 0 0;color:var(--apps-muted);font-size:14px}.apps-count{padding:9px 13px;border:1px solid var(--apps-border);border-radius:999px;background:#fff;font-size:12px;font-weight:800}.apps-toolbar{margin-bottom:22px}.search-wrap{position:relative}.search-wrap i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#9ca3af}.apps-search{width:100%;height:48px;border:1px solid var(--apps-border);border-radius:10px;background:#fff;padding:0 16px 0 43px;outline:none;font-size:14px}.apps-search:focus{border-color:#111;box-shadow:0 0 0 3px rgba(17,17,17,.06)}
.apps-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.app-card{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;aspect-ratio:1/1;min-width:0;padding:20px;text-align:center;text-decoration:none;color:#fff;background:var(--app-gradient);border:0;border-radius:20px;box-shadow:0 10px 28px rgba(0,0,0,.10);overflow:hidden;isolation:isolate;transition:transform .22s ease,box-shadow .22s ease}.app-card:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,0) 42%,rgba(0,0,0,.12));z-index:-1}.app-card:after{content:"";position:absolute;width:150px;height:150px;right:-70px;top:-70px;border-radius:50%;background:rgba(255,255,255,.18);filter:blur(2px);z-index:-1}.app-card:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 20px 38px rgba(0,0,0,.18)}.app-card:active{transform:translateY(-2px) scale(.99)}.app-icon{width:58px;height:58px;flex:none;border-radius:17px;display:grid;place-items:center;background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 20px rgba(0,0,0,.12);backdrop-filter:blur(10px);color:#fff;font-size:22px}.app-info{min-width:0;width:100%;margin-top:14px}.app-name{display:-webkit-box;font-size:16px;font-weight:900;line-height:1.2;text-transform:capitalize;white-space:normal;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-shadow:0 1px 2px rgba(0,0,0,.18)}.app-open{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;color:rgba(255,255,255,.88);font-size:11px;font-weight:800}.app-open i{font-size:9px}.app-snapshot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;mix-blend-mode:soft-light;z-index:-2;transition:opacity .25s ease,transform .35s ease}.app-card:hover .app-snapshot{opacity:.27;transform:scale(1.04)}.empty{display:none;text-align:center;padding:55px 20px;color:var(--apps-muted);grid-column:1/-1}.apps-footnote{text-align:center;margin-top:30px;color:#9ca3af;font-size:11px}
@media(max-width:1050px){.apps-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.apps-main{padding:32px 10px 60px}.apps-top{display:block}.apps-count{display:inline-block;margin-top:15px}.apps-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.app-card{padding:15px;border-radius:17px}.app-icon{width:48px;height:48px;border-radius:14px;font-size:19px}.app-info{margin-top:10px}.app-name{font-size:14px}.app-open{font-size:10px;margin-top:6px}}@media(max-width:460px){.apps-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.app-card{padding:11px;border-radius:15px}.app-icon{width:42px;height:42px;border-radius:12px;font-size:17px}.app-name{font-size:12px}.app-open{font-size:9px}.apps-title{font-size:40px}}
</style>
</head>
<body class="gb-page apps-page">
<div id="site-header"></div>
<main class="apps-main">
<section class="apps-top"><div><div class="apps-kicker"><i class="fa-solid fa-sparkles"></i> Laxman Nepal</div><h1 class="apps-title">Apps & Tools</h1><p class="apps-subtitle">Everything I've built, in one simple place.</p></div><div class="apps-count" id="app-count">Loading apps…</div></section>
<div class="apps-toolbar"><div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="app-search" class="apps-search" type="search" placeholder="Search apps…" autocomplete="off"></div></div>
<section id="apps-grid" class="apps-grid"><div class="empty" style="display:block">Loading apps…</div></section>
<p class="apps-footnote">New projects with a live homepage link are added automatically.</p>
</main>
<div id="site-footer"></div>
<script>
/* UNIVERSAL RULE: header, both navigation rows, and footer are copied from the repository homepage. */
async function loadUniversalShell(){
 try{
  const response=await fetch('/?universal-shell='+Date.now(),{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw new Error('Homepage unavailable');
  const doc=new DOMParser().parseFromString(await response.text(),'text/html');
  const header=doc.querySelector('header.gb-header');const footer=doc.querySelector('footer.gb-footer');
  if(!header||!footer)throw new Error('Homepage header/footer not found');
  document.getElementById('site-header').replaceChildren(document.importNode(header,true));
  document.getElementById('site-footer').replaceChildren(document.importNode(footer,true));
  const mobile=document.getElementById('gb-mobile');mobile?.addEventListener('click',()=>document.querySelector('.gb-menu')?.classList.toggle('open'));
  const year=document.getElementById('year');if(year)year.textContent=new Date().getFullYear();
 }catch(error){console.error(error);document.getElementById('site-header').innerHTML='<div style="padding:16px;text-align:center">Unable to load universal site navigation.</div>';}
}
const icons=['fa-table-cells','fa-calendar-days','fa-wand-magic-sparkles','fa-link','fa-book-open','fa-chart-line','fa-robot','fa-globe','fa-code','fa-bolt'];
const gradients=['linear-gradient(135deg,#ff6b6b,#feca57)','linear-gradient(135deg,#5f72bd,#9b23ea)','linear-gradient(135deg,#00c6ff,#0072ff)','linear-gradient(135deg,#11998e,#38ef7d)','linear-gradient(135deg,#f857a6,#ff5858)','linear-gradient(135deg,#f7971e,#ffd200)','linear-gradient(135deg,#7f00ff,#e100ff)','linear-gradient(135deg,#00b09b,#96c93d)','linear-gradient(135deg,#fc4a1a,#f7b733)','linear-gradient(135deg,#396afc,#2948ff)'];
let allApps=[];
function snapshotUrl(url){return 'https://image.thum.io/get/width/900/crop/700/noanimate/'+url}
async function loadApps(){const grid=document.getElementById('apps-grid'),count=document.getElementById('app-count');try{const r=await fetch('https://api.github.com/users/LaxmanNepal/repos?per_page=100&sort=updated',{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub API failed');const repos=await r.json();allApps=repos.filter(x=>!x.fork&&!x.archived&&x.homepage&&/^https?:\/\//i.test(x.homepage)).map((x,i)=>({name:x.name.replace(/[-_]+/g,' '),url:x.homepage.trim(),icon:icons[i%icons.length],gradient:gradients[i%gradients.length],snapshot:snapshotUrl(x.homepage.trim())}));allApps.sort((a,b)=>a.name.localeCompare(b.name));renderApps(allApps)}catch(e){grid.innerHTML='<div class="empty" style="display:block">Apps could not be loaded right now.</div>';count.textContent=''}}
function renderApps(apps){const grid=document.getElementById('apps-grid'),count=document.getElementById('app-count');count.textContent=apps.length+' '+(apps.length===1?'app':'apps');if(!apps.length){grid.innerHTML='<div class="empty" style="display:block">No apps found.</div>';return}grid.innerHTML=apps.map(a=>`<a class="app-card" href="${escapeAttr(a.url)}" target="_blank" rel="noopener noreferrer" style="--app-gradient:${a.gradient}"><img class="app-snapshot" src="${escapeAttr(a.snapshot)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'"><span class="app-icon"><i class="fa-solid ${a.icon}"></i></span><span class="app-info"><span class="app-name">${escapeHtml(a.name)}</span><span class="app-open">Open app <i class="fa-solid fa-arrow-up-right-from-square"></i></span></span></a>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s)}
document.getElementById('app-search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();renderApps(allApps.filter(a=>a.name.toLowerCase().includes(q)||a.url.toLowerCase().includes(q)))});
loadUniversalShell();loadApps();
</script>
</body>
</html>

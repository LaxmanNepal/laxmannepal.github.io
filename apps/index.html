<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps & Tools — Laxman Nepal</title>
<meta name="description" content="Explore web apps and digital tools by Laxman Nepal.">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/light.css">
<link rel="stylesheet" href="/assets/css/gadgetbyte-home.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{color-scheme:light;--apps-bg:#f5f7fb;--apps-card:rgba(255,255,255,.82);--apps-border:rgba(20,30,55,.08);--apps-text:#111827;--apps-muted:#6b7280;--apps-accent:#111827}
*{box-sizing:border-box}.apps-page{margin:0;background:var(--apps-bg);color:var(--apps-text)}
.apps-main{max-width:1280px;margin:0 auto;padding:54px 24px 90px}.apps-top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:30px}.apps-kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:9px}.apps-title{font-size:clamp(36px,5vw,62px);line-height:.98;letter-spacing:-.045em;margin:0;font-weight:800}.apps-subtitle{max-width:620px;margin:14px 0 0;color:var(--apps-muted);font-size:16px;line-height:1.6}.apps-count{flex:none;padding:11px 15px;border:1px solid var(--apps-border);border-radius:999px;background:rgba(255,255,255,.7);font-size:13px;font-weight:700;box-shadow:0 8px 28px rgba(20,30,55,.05)}
.apps-toolbar{display:flex;gap:12px;margin-bottom:28px}.apps-search{width:100%;height:52px;border:1px solid var(--apps-border);border-radius:17px;background:rgba(255,255,255,.85);padding:0 18px 0 48px;outline:none;font-size:15px;color:var(--apps-text);box-shadow:0 10px 35px rgba(20,30,55,.045);transition:.2s}.apps-search:focus{border-color:rgba(17,24,39,.2);box-shadow:0 0 0 4px rgba(17,24,39,.05)}.search-wrap{position:relative;flex:1}.search-wrap i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#9ca3af;pointer-events:none}
.apps-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.app-card{position:relative;display:flex;align-items:center;min-height:118px;padding:22px 21px;text-decoration:none;color:inherit;background:var(--apps-card);border:1px solid var(--apps-border);border-radius:24px;box-shadow:0 10px 35px rgba(20,30,55,.055);overflow:hidden;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}.app-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.7),transparent 55%);pointer-events:none}.app-card:hover{transform:translateY(-5px);box-shadow:0 18px 48px rgba(20,30,55,.12);border-color:rgba(20,30,55,.14)}.app-card:active{transform:translateY(-1px) scale(.99)}.app-icon{width:54px;height:54px;flex:none;border-radius:17px;display:grid;place-items:center;background:#111827;color:#fff;font-size:21px;box-shadow:0 9px 22px rgba(17,24,39,.16)}.app-info{min-width:0;padding-left:15px}.app-name{font-size:17px;font-weight:750;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.app-open{display:flex;align-items:center;gap:5px;margin-top:6px;color:#8a919e;font-size:12px;font-weight:650}.app-open i{font-size:10px;transition:transform .2s}.app-card:hover .app-open i{transform:translateX(3px)}.empty{display:none;text-align:center;padding:55px 20px;color:var(--apps-muted);grid-column:1/-1}.empty i{font-size:30px;margin-bottom:10px;color:#9ca3af}.apps-footnote{text-align:center;margin-top:34px;color:#9ca3af;font-size:12px}
@media(max-width:1050px){.apps-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.apps-main{padding:38px 16px 65px}.apps-top{display:block}.apps-count{display:inline-block;margin-top:18px}.apps-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.app-card{min-height:105px;padding:17px 15px;border-radius:20px}.app-icon{width:46px;height:46px;border-radius:14px;font-size:18px}.app-info{padding-left:11px}.app-name{font-size:15px}.apps-toolbar{margin-bottom:20px}}@media(max-width:470px){.apps-grid{grid-template-columns:1fr}.app-card{min-height:88px}.apps-title{font-size:40px}}
</style>
</head>
<body class="apps-page">
<div id="site-header"></div>
<main class="apps-main">
<section class="apps-top">
<div><div class="apps-kicker"><i class="fa-solid fa-sparkles"></i> Laxman Nepal</div><h1 class="apps-title">Apps & Tools</h1><p class="apps-subtitle">Everything I've built, in one simple place.</p></div>
<div class="apps-count" id="app-count">Loading apps…</div>
</section>
<div class="apps-toolbar"><div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="app-search" class="apps-search" type="search" placeholder="Search apps…" autocomplete="off"></div></div>
<section id="apps-grid" class="apps-grid"><div class="empty" style="display:block"><i class="fa-solid fa-circle-notch fa-spin"></i><div>Loading apps…</div></div></section>
<p class="apps-footnote">New projects with a live homepage link are added automatically.</p>
</main>
<div id="site-footer"></div>
<script>
async function loadUniversalShell(){
 try{const r=await fetch('/?shell='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=new DOMParser().parseFromString(await r.text(),'text/html');const h=d.querySelector('header.gb-header'),f=d.querySelector('footer.gb-footer');if(h)document.getElementById('site-header').replaceChildren(document.importNode(h,true));if(f)document.getElementById('site-footer').replaceChildren(document.importNode(f,true));const m=document.getElementById('gb-mobile');m?.addEventListener('click',()=>document.querySelector('.gb-menu')?.classList.toggle('open'));const y=document.getElementById('year');if(y)y.textContent=new Date().getFullYear()}catch(e){console.warn('Universal shell failed',e)}}
const icons=['fa-grid-2','fa-calendar-days','fa-wand-magic-sparkles','fa-link','fa-book-open','fa-chart-line','fa-robot','fa-globe','fa-code','fa-bolt'];
let allApps=[];
async function loadApps(){
 const grid=document.getElementById('apps-grid'),count=document.getElementById('app-count');
 try{
  const r=await fetch('https://api.github.com/users/LaxmanNepal/repos?per_page=100&sort=updated',{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw 0;
  const repos=await r.json();
  allApps=repos.filter(x=>!x.fork&&!x.archived&&x.homepage&&/^https?:\\/\\//i.test(x.homepage)).map((x,i)=>({name:x.name.replace(/[-_]+/g,' '),url:x.homepage.trim(),icon:icons[i%icons.length]}));
  allApps.sort((a,b)=>a.name.localeCompare(b.name));renderApps(allApps);
 }catch(e){grid.innerHTML='<div class="empty" style="display:block"><i class="fa-solid fa-triangle-exclamation"></i><div>Apps could not be loaded right now.</div></div>';count.textContent='';console.error(e)}
}
function renderApps(apps){const grid=document.getElementById('apps-grid'),count=document.getElementById('app-count');count.textContent=apps.length+' '+(apps.length===1?'app':'apps');if(!apps.length){grid.innerHTML='<div class="empty" style="display:block"><i class="fa-regular fa-face-frown"></i><div>No apps found.</div></div>';return}grid.innerHTML=apps.map(a=>`<a class="app-card" href="${escapeAttr(a.url)}"><span class="app-icon"><i class="fa-solid ${a.icon}"></i></span><span class="app-info"><span class="app-name">${escapeHtml(a.name)}</span><span class="app-open">Open app <i class="fa-solid fa-arrow-right"></i></span></span></a>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s)}
document.getElementById('app-search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();renderApps(allApps.filter(a=>a.name.toLowerCase().includes(q)||a.url.toLowerCase().includes(q)))});
loadUniversalShell();loadApps();
</script>
</body>
</html>

</style></head><body class="gb-page apps-page"><div id="site-header"></div><main class="apps-main"><section class="apps-top"><div><div class="apps-kicker"><i class="fa-solid fa-sparkles"></i> Laxman Nepal</div><h1 class="apps-title">Apps & Tools</h1><p class="apps-subtitle">Your personal web-app launcher — fast, searchable and installable.</p></div><div class="apps-actions"><button class="icon-btn" id="theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button><button class="icon-btn" id="install-btn" title="Install app" aria-label="Install app" hidden><i class="fa-solid fa-download"></i></button></div></section><div class="apps-toolbar"><div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="app-search" class="apps-search" type="search" placeholder="Search apps, tools, categories…" autocomplete="off"></div><select id="sort-apps" class="sort-select" aria-label="Sort apps"><option value="name">Name A → Z</option><option value="updated">Recently updated</option><option value="stars">Most starred</option><option value="featured">Featured first</option><option value="recent">Recently opened</option></select></div><nav id="category-bar" class="category-bar" aria-label="App categories"></nav><section id="featured-section"><div class="section-label"><h2>Featured</h2><span>Popular projects</span></div><div id="featured-grid" class="featured-grid"></div></section><div class="launcher-tools"><small id="results-label">Loading apps…</small><div class="view-toggle"><button id="grid-view" class="active" title="Grid view"><i class="fa-solid fa-grip"></i></button><button id="list-view" title="List view"><i class="fa-solid fa-list"></i></button></div></div><section id="apps-grid" class="apps-grid"></section><p class="apps-footnote">Local catalog loads first. Live GitHub metadata updates in the background when available.</p></main><div id="site-footer"></div>

async function loadUniversalShell(){try{const r=await fetch('/?universal-shell='+Date.now(),{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw 0;const d=new DOMParser().parseFromString(await r.text(),'text/html'),h=d.querySelector('header.gb-header'),f=d.querySelector('footer.gb-footer');if(!h||!f)throw 0;document.getElementById('site-header').replaceChildren(document.importNode(h,true));document.getElementById('site-footer').replaceChildren(document.importNode(f,true));document.getElementById('gb-mobile')?.addEventListener('click',()=>document.querySelector('.gb-menu')?.classList.toggle('open'));const y=document.getElementById('year');if(y)y.textContent=new Date().getFullYear()}catch(e){document.getElementById('site-header').innerHTML='<div style="padding:16px;text-align:center">Unable to load universal site navigation.</div>'}}
const icons=['fa-table-cells','fa-calendar-days','fa-wand-magic-sparkles','fa-link','fa-book-open','fa-chart-line','fa-robot','fa-globe','fa-code','fa-bolt','fa-image','fa-file-lines'];const rules={AI:['ai','artificial','gpt','voice','tts','chatbot','machine'],Finance:['nepse','finance','stock','money','currency','bank'],Developer:['code','developer','github','html','css','javascript','api','json'],Education:['education','book','learn','typing','school','study'],Creative:['photo','image','video','music','lofi','design','creative'],Productivity:['excel','office','pdf','link','calendar','tool','generator'],Utility:['utility','converter','calculator','patro','weather','password']};let allApps=Array.isArray(window.LAXMAN_APP_CATALOG)?window.LAXMAN_APP_CATALOG:[],activeCategory='All',deferredInstall=null;const favKey='laxman-app-favorites',recentKey='laxman-app-recent',themeKey='laxman-app-theme';const getSet=k=>new Set(JSON.parse(localStorage.getItem(k)||'[]'));const saveSet=(k,s)=>localStorage.setItem(k,JSON.stringify([...s].slice(0,30)));function favUrl(u){try{return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(u).hostname)+'&sz=128'}catch{return ''}}function cat(x){let t=(x.name+' '+(x.description||'')+' '+(x.topics||[]).join(' ')).toLowerCase();for(const [k,v] of Object.entries(rules))if(v.some(w=>t.includes(w)))return k;return 'Other'}function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function visible(){let q=document.getElementById('app-search').value.trim().toLowerCase(),a=allApps.filter(x=>(activeCategory==='All'||x.category===activeCategory)&&[x.name,x.url,x.description,x.category].some(v=>String(v).toLowerCase().includes(q)));let s=document.getElementById('sort-apps').value,f=getSet(favKey),r=getSet(recentKey);if(s==='updated')a.sort((x,y)=>new Date(y.updated)-new Date(x.updated));else if(s==='stars')a.sort((x,y)=>y.stars-x.stars);else if(s==='featured')a.sort((x,y)=>y.featured-x.featured||y.stars-x.stars);else if(s==='recent')a.sort((x,y)=>(r.has(y.repo)?0:1)-(r.has(x.repo)?0:1)||x.name.localeCompare(y.name));else a.sort((x,y)=>x.name.localeCompare(y.name));return a}function renderCategories(){let c=['All',...Object.keys(rules),'Other'];document.getElementById('category-bar').innerHTML=c.map(x=>`<button class="category-btn ${x===activeCategory?'active':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('.category-btn').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderCategories();render()})}function card(a){let f=getSet(favKey);return `<a class="app-card" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" data-repo="${esc(a.repo)}"><button class="fav-btn ${f.has(a.repo)?'active':''}" type="button" aria-label="${f.has(a.repo)?'Remove from favorites':'Add to favorites'}"><i class="fa-solid fa-star"></i></button><div class="app-preview"><div class="preview-loading">Loading preview…</div><img class="app-snapshot" src="${esc(a.snapshot)}" data-fallback="${esc(a.fallback)}" alt="${esc(a.name)} homepage preview" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div><div class="app-info"><span class="app-icon"><i class="fa-solid ${a.icon}"></i><img src="${esc(a.favicon||favUrl(a.url))}" alt="" loading="lazy" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()"></span><span class="app-name-wrap"><span class="app-name">${esc(a.name)}</span><span class="app-open">${esc(a.category)} <span class="app-status"><span class="status-dot"></span>Live</span> <i class="fa-solid fa-arrow-up-right-from-square"></i></span></span></div></a>`}function render(){let a=visible(),g=document.getElementById('apps-grid');document.getElementById('results-label').textContent=a.length+' '+(a.length===1?'app':'apps')+' shown';g.innerHTML=a.length?a.map(card).join(''):'<div class="empty" style="display:block">No apps found.</div>';wire();renderFeatured()}function renderFeatured(){let q=document.getElementById('app-search').value.trim(),sec=document.getElementById('featured-section');if(q||activeCategory!=='All'){sec.style.display='none';return}sec.style.display='block';let a=[...allApps].sort((x,y)=>y.featured-x.featured||y.stars-x.stars).slice(0,4);document.getElementById('featured-grid').innerHTML=a.map(x=>`<a class="featured-card" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><img class="featured-logo" src="${esc(x.favicon||favUrl(x.url))}" alt="" loading="lazy"><span><span class="featured-name">${esc(x.name)}</span><span class="featured-meta"><i class="fa-solid fa-star"></i> ${x.stars||0} · ${esc(x.category)}</span></span></a>`).join('')}function wire(){document.querySelectorAll('.app-card').forEach(c=>{let img=c.querySelector('.app-snapshot'),load=c.querySelector('.preview-loading'),fav=c.querySelector('.fav-btn');img.onload=()=>load.classList.add('hidden');img.onerror=()=>{if(img.dataset.fallback&&img.src!==img.dataset.fallback)img.src=img.dataset.fallback;else{load.textContent='Preview unavailable';load.style.animation='none'}};fav.onclick=e=>{e.preventDefault();e.stopPropagation();let s=getSet(favKey),r=c.dataset.repo;s.has(r)?s.delete(r):s.add(r);saveSet(favKey,s);fav.classList.toggle('active',s.has(r));fav.setAttribute('aria-label',s.has(r)?'Remove from favorites':'Add to favorites')};c.addEventListener('click',e=>{if(e.target.closest('.fav-btn'))return;let s=getSet(recentKey);s.delete(c.dataset.repo);s=new Set([c.dataset.repo,...s]);saveSet(recentKey,s)})})}async function loadApps(){try{let r=await fetch('https://api.github.com/users/LaxmanNepal/repos?per_page=100&sort=updated',{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw 0;let repos=await r.json();let live=repos.filter(x=>!x.fork&&!x.archived&&x.homepage&&/^https?:\/\//i.test(x.homepage));let byRepo=new Map(live.map(x=>[x.name.toLowerCase(),x]));allApps=allApps.map((a,i)=>{let x=byRepo.get(a.repo.toLowerCase());if(!x)return a;return {...a,repo:x.name,name:x.name.replace(/[-_]+/g,' '),url:x.homepage.trim(),description:x.description||a.description,topics:x.topics||a.topics,stars:x.stargazers_count||0,updated:x.updated_at||x.pushed_at,category:cat(x),snapshot:'/assets/app-snapshots/'+x.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.webp',fallback:'https://image.thum.io/get/width/1200/crop/900/noanimate/'+x.homepage.trim(),favicon:favUrl(x.homepage.trim()),featured:(x.stargazers_count||0)>0}});let known=new Set(allApps.map(a=>a.repo.toLowerCase()));live.filter(x=>!known.has(x.name.toLowerCase())).forEach((x,i)=>allApps.push({repo:x.name,name:x.name.replace(/[-_]+/g,' '),url:x.homepage.trim(),description:x.description||'',topics:x.topics||[],stars:x.stargazers_count||0,updated:x.updated_at||x.pushed_at,category:cat(x),icon:icons[i%icons.length],gradient:'none',snapshot:'/assets/app-snapshots/'+x.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.webp',fallback:'https://image.thum.io/get/width/1200/crop/900/noanimate/'+x.homepage.trim(),favicon:favUrl(x.homepage.trim()),featured:(x.stargazers_count||0)>0}));renderCategories();render()}catch(e){let label=document.getElementById('results-label');if(label)label.textContent=allApps.length+' apps shown · local catalog'}}function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem(themeKey,t);document.getElementById('theme-btn').innerHTML=t==='dark'?'<i class="fa-solid fa-sun"></i>':'<i class="fa-solid fa-moon"></i>';document.getElementById('theme-color').content=t==='dark'?'#0b1020':'#111827'}document.getElementById('theme-btn').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');applyTheme(localStorage.getItem(themeKey)|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));document.getElementById('app-search').oninput=render;document.getElementById('sort-apps').onchange=render;document.getElementById('grid-view').onclick=()=>{document.documentElement.dataset.view='grid';document.getElementById('grid-view').classList.add('active');document.getElementById('list-view').classList.remove('active')};document.getElementById('list-view').onclick=()=>{document.documentElement.dataset.view='list';document.getElementById('list-view').classList.add('active');document.getElementById('grid-view').classList.remove('active')};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.getElementById('install-btn').hidden=false});document.getElementById('install-btn').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();deferredInstall=null;document.getElementById('install-btn').hidden=true};renderCategories();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('/apps/sw.js?v=14',{scope:'/apps/'}).catch(()=>{});loadUniversalShell();loadApps();
</script></body></html>

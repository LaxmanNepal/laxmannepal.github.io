<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<meta name="description" content="Laxman Nepal Apps — useful digital tools and applications.">
<meta name="author" content="Laxman Nepal">
<link rel="canonical" href="https://apps.laxmannepal.com.np/apps/">
<meta property="og:title" content="Apps — Laxman Nepal">
<meta property="og:description" content="Useful apps and digital tools by Laxman Nepal.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://apps.laxmannepal.com.np/apps/">
<title>Apps — Laxman Nepal</title>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/light.css">
<link rel="stylesheet" href="/assets/css/gadgetbyte-home.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--apps-bg:#f6f7f9;--apps-card:#fff;--apps-text:#111827;--apps-muted:#667085;--apps-border:rgba(0,0,0,.08)}
body.apps-page{margin:0;background:var(--apps-bg);color:var(--apps-text)}
.apps-main{padding:48px 0 72px}.apps-container{width:min(1180px,calc(100% - 32px));margin:auto}
.apps-heading{text-align:center;max-width:760px;margin:0 auto 42px}.apps-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:#111;color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.apps-heading h1{font-size:clamp(38px,6vw,64px);line-height:1.02;letter-spacing:-.045em;margin:18px 0 14px}.apps-heading p{font-size:18px;line-height:1.6;color:var(--apps-muted);margin:0}
.apps-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}.apps-search{flex:1;max-width:420px;position:relative}.apps-search i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#98a2b3}.apps-search input{width:100%;box-sizing:border-box;border:1px solid var(--apps-border);background:#fff;border-radius:14px;padding:13px 16px 13px 42px;font:inherit;outline:none}.apps-search input:focus{border-color:#111}.apps-count{color:var(--apps-muted);font-size:14px;font-weight:700}
.apps-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.app-card{display:flex;flex-direction:column;min-height:230px;background:var(--apps-card);border:1px solid var(--apps-border);border-radius:22px;padding:22px;text-decoration:none;color:inherit;box-shadow:0 8px 30px rgba(16,24,40,.04);transition:transform .2s,box-shadow .2s,border-color .2s}.app-card:hover{transform:translateY(-4px);box-shadow:0 18px 45px rgba(16,24,40,.1);border-color:rgba(0,0,0,.15)}.app-icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:#f0f2f5;color:#111;font-size:22px;margin-bottom:20px}.app-card h2{font-size:21px;line-height:1.2;margin:0 0 9px}.app-card p{font-size:14px;line-height:1.55;color:var(--apps-muted);margin:0}.app-meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:20px;font-size:12px;font-weight:800;color:#667085;text-transform:uppercase;letter-spacing:.06em}.app-arrow{font-size:18px;color:#111}
.apps-empty{display:none;text-align:center;padding:50px 20px;color:var(--apps-muted)}
.apps-error{display:none;margin:0 auto 24px;max-width:760px;padding:14px 16px;border-radius:12px;background:#fff4f4;color:#b42318;font-size:14px}
@media(max-width:900px){.apps-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.apps-main{padding:32px 0 54px}.apps-container{width:min(100% - 22px,1180px)}.apps-heading{margin-bottom:30px}.apps-heading h1{font-size:44px}.apps-heading p{font-size:16px}.apps-toolbar{display:block}.apps-search{max-width:none}.apps-count{display:block;margin-top:12px}.apps-grid{grid-template-columns:1fr;gap:14px}.app-card{min-height:205px}}
</style>
</head>
<body class="apps-page">
<!-- Universal shell: header/navbar/footer are imported from the live homepage at /. Do not duplicate them here. -->
<div id="site-header"></div>
<main class="apps-main">
<div class="apps-container">
<section class="apps-heading">
<span class="apps-eyebrow"><i class="fa-solid fa-grid-2"></i> Laxman Nepal</span>
<h1>Apps & Tools</h1>
<p>Useful digital tools, practical utilities and web apps built by Laxman Nepal.</p>
</section>
<div id="apps-error" class="apps-error"></div>
<div class="apps-toolbar">
<label class="apps-search"><i class="fa-solid fa-magnifying-glass"></i><input id="apps-search" type="search" placeholder="Search apps and tools..." aria-label="Search apps"></label>
<span id="apps-count" class="apps-count"></span>
</div>
<section id="apps-grid" class="apps-grid" aria-label="Apps and tools"></section>
<div id="apps-empty" class="apps-empty">No apps match your search.</div>
</div>
</main>
<div id="site-footer"></div>
<script>
/*
  UNIVERSAL SITE SHELL
  The homepage is the single source of truth for the header, navbar and footer.
  Any future edit made to /index.html is automatically reflected on /apps/.
*/
async function loadUniversalShell(){
  const response=await fetch('/?shell='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('Homepage shell could not be loaded.');
  const html=await response.text();
  const doc=new DOMParser().parseFromString(html,'text/html');
  const header=doc.querySelector('header.gb-header');
  const footer=doc.querySelector('footer.gb-footer');
  if(!header||!footer)throw new Error('Homepage header or footer was not found.');
  document.getElementById('site-header').replaceChildren(document.importNode(header,true));
  document.getElementById('site-footer').replaceChildren(document.importNode(footer,true));
  // Keep the homepage mobile menu behaviour working on this page without copying the homepage shell code.
  const menu=document.getElementById('gb-mobile');
  menu?.addEventListener('click',()=>document.querySelector('.gb-menu')?.classList.toggle('open'));
  const year=document.getElementById('year');
  if(year)year.textContent=new Date().getFullYear();
}

/* Add/edit apps here. The shell above must remain untouched. */
const APPS=[
  {name:'Nepali Patro',description:'Nepali calendar, dates, festivals and useful everyday calendar information.',url:'/Nepali-Patro/',icon:'fa-calendar-days',category:'Utility'},
  {name:'Janma Kundali',description:'Explore birth-chart and Vedic astrology calculations in a clean web interface.',url:'/Janma-Kundali/',icon:'fa-star',category:'Astrology'},
  {name:'Kritim AI',description:'A practical AI workspace for useful tools and experiments.',url:'/Kritim/',icon:'fa-wand-magic-sparkles',category:'AI'},
  {name:'Laxlink',description:'A simple personal link and digital profile experience.',url:'/Laxlink/',icon:'fa-link',category:'Utility'},
  {name:'PDF Books',description:'Browse and read useful PDF resources with a focused reading experience.',url:'/PDF-Books/',icon:'fa-book-open',category:'Reading'},
  {name:'Progress Bar Of The Year',description:'Visualize the progress of the year and create shareable daily graphics.',url:'/Progress-Bar-Of-The-Year/',icon:'fa-chart-simple',category:'Utility'},
  {name:'AI Tools',description:'A collection of practical AI tools and resources.',url:'/ai-tools/',icon:'fa-robot',category:'AI'}
];

function renderApps(query=''){
  const q=query.trim().toLowerCase();
  const filtered=APPS.filter(a=>!q||`${a.name} ${a.description} ${a.category}`.toLowerCase().includes(q));
  const grid=document.getElementById('apps-grid');
  grid.innerHTML=filtered.map(a=>`<a class="app-card" href="${a.url}"><div class="app-icon"><i class="fa-solid ${a.icon}"></i></div><h2>${a.name}</h2><p>${a.description}</p><div class="app-meta"><span>${a.category}</span><span class="app-arrow">→</span></div></a>`).join('');
  document.getElementById('apps-count').textContent=`${filtered.length} ${filtered.length===1?'app':'apps'}`;
  document.getElementById('apps-empty').style.display=filtered.length?'none':'block';
}

(async()=>{
  try{await loadUniversalShell();}
  catch(error){
    const box=document.getElementById('apps-error');box.textContent='The universal site navigation could not be loaded. Please refresh the page.';box.style.display='block';console.error(error);
  }
  renderApps();
  document.getElementById('apps-search').addEventListener('input',e=>renderApps(e.target.value));
})();
</script>
</body>
</html>

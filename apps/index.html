<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps & Tools — Laxman Nepal</title>
<meta name="description" content="Explore web apps and digital tools by Laxman Nepal.">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/light.css">
<link rel="stylesheet" href="/assets/css/gadgetbyte-home.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{color-scheme:light;--apps-bg:#f5f6f8;--apps-border:#e5e7eb;--apps-text:#111827;--apps-muted:#6b7280;--apps-panel:#fff}
html{scroll-behavior:smooth}.apps-page{margin:0;background:var(--apps-bg);color:var(--apps-text)}
#site-header{position:sticky;top:0;z-index:9999;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.apps-main{max-width:1240px;margin:auto;padding:42px 16px 80px}.apps-top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}.apps-kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#e11d48;margin-bottom:8px}.apps-title{font-size:clamp(38px,5vw,62px);line-height:.98;letter-spacing:-.05em;margin:0;font-weight:900}.apps-subtitle{margin:12px 0 0;color:var(--apps-muted);font-size:14px}.apps-count{padding:9px 13px;border:1px solid var(--apps-border);border-radius:999px;background:#fff;font-size:12px;font-weight:800;white-space:nowrap}
.apps-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:14px}.search-wrap{position:relative}.search-wrap i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#9ca3af}.apps-search{width:100%;height:48px;border:1px solid var(--apps-border);border-radius:12px;background:#fff;padding:0 16px 0 43px;outline:none;font-size:14px;box-sizing:border-box}.apps-search:focus{border-color:#111;box-shadow:0 0 0 3px rgba(17,17,17,.06)}.sort-select{height:48px;border:1px solid var(--apps-border);border-radius:12px;background:#fff;padding:0 38px 0 14px;font-size:13px;font-weight:800;outline:none;cursor:pointer}
.category-bar{display:flex;gap:8px;overflow:auto;padding:2px 0 16px;scrollbar-width:none}.category-bar::-webkit-scrollbar{display:none}.category-btn{border:1px solid var(--apps-border);background:#fff;color:#4b5563;border-radius:999px;padding:8px 13px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;transition:.2s}.category-btn:hover{transform:translateY(-1px)}.category-btn.active{background:#111827;color:#fff;border-color:#111827}
.section-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 12px}.section-label h2{margin:0;font-size:16px;font-weight:900}.section-label span{font-size:11px;color:#9ca3af;font-weight:700}.featured-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}.featured-card{position:relative;display:flex;align-items:center;gap:11px;min-width:0;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--apps-border);text-decoration:none;color:#111827;box-shadow:0 7px 20px rgba(0,0,0,.06);transition:.2s}.featured-card:hover{transform:translateY(-3px);box-shadow:0 13px 28px rgba(0,0,0,.10)}.featured-logo{width:42px;height:42px;border-radius:12px;object-fit:cover;flex:none;background:#eef2f7}.featured-copy{min-width:0}.featured-name{display:block;font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.featured-meta{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:9px;color:#9ca3af;font-weight:700}.featured-star{color:#f59e0b}.featured-status{display:inline-flex;align-items:center;gap:4px}.status-dot{width:6px;height:6px;border-radius:50%;background:#10b981}.status-dot.pending{background:#f59e0b}.status-dot.offline{background:#ef4444}
.apps-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.app-card{position:relative;display:grid;grid-template-rows:70% 30%;aspect-ratio:1/1;min-width:0;text-decoration:none;color:#fff;background:#fff;border:0;border-radius:20px;box-shadow:0 10px 28px rgba(0,0,0,.10);overflow:hidden;isolation:isolate;transition:transform .22s ease,box-shadow .22s ease}.app-card:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 20px 38px rgba(0,0,0,.18)}.app-card:active{transform:translateY(-2px) scale(.99)}
.app-preview{position:relative;min-height:0;background:#eef1f5;overflow:hidden}.app-snapshot{display:block;width:100%;height:100%;object-fit:cover;object-position:top center;background:#eef1f5;transition:transform .45s ease}.app-card:hover .app-snapshot{transform:scale(1.025)}.app-preview:after{content:"";position:absolute;inset:0;box-shadow:inset 0 -18px 28px rgba(0,0,0,.08);pointer-events:none}.preview-loading{position:absolute;inset:0;display:grid;place-items:center;color:#9ca3af;font-size:11px;font-weight:800;background:linear-gradient(110deg,#eef1f5 30%,#f8fafc 45%,#eef1f5 60%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}@keyframes shimmer{to{background-position:-200% 0}}
.app-info{position:relative;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--app-gradient);overflow:hidden}.app-info:before{content:"";position:absolute;width:130px;height:130px;right:-60px;bottom:-90px;border-radius:50%;background:rgba(255,255,255,.18)}.app-icon{position:relative;width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 5px 14px rgba(0,0,0,.13);backdrop-filter:blur(10px);color:#fff;font-size:17px;overflow:hidden}.app-icon img{width:27px;height:27px;border-radius:7px;object-fit:cover;background:#fff}.app-icon i{position:absolute}.app-name-wrap{position:relative;min-width:0;flex:1}.app-name{display:-webkit-box;font-size:15px;font-weight:900;line-height:1.15;text-transform:capitalize;white-space:normal;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-shadow:0 1px 2px rgba(0,0,0,.18)}.app-open{display:flex;align-items:center;gap:5px;margin-top:4px;color:rgba(255,255,255,.82);font-size:9px;font-weight:800}.app-status{display:inline-flex;align-items:center;gap:4px;margin-left:8px;color:rgba(255,255,255,.86)}.app-status .status-dot{width:5px;height:5px;background:#d1fae5}.empty{display:none;text-align:center;padding:55px 20px;color:var(--apps-muted);grid-column:1/-1}.apps-footnote{text-align:center;margin-top:30px;color:#9ca3af;font-size:11px}
@media(max-width:1050px){.apps-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.featured-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.apps-main{padding:32px 10px 60px}.apps-top{display:block}.apps-count{display:inline-block;margin-top:15px}.apps-toolbar{grid-template-columns:1fr}.sort-select{width:100%}.apps-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.featured-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.featured-card{padding:10px}.featured-logo{width:36px;height:36px}.app-card{border-radius:17px}.app-info{gap:9px;padding:9px 11px}.app-icon{width:38px;height:38px;border-radius:11px;font-size:16px}.app-name{font-size:12px}.app-open{font-size:8px;margin-top:3px}}@media(max-width:460px){.apps-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.app-card{border-radius:15px}.app-info{gap:7px;padding:8px}.app-icon{width:34px;height:34px;border-radius:10px;font-size:14px}.app-icon img{width:22px;height:22px}.app-name{font-size:11px}.app-open{font-size:7px}.apps-title{font-size:40px}.featured-name{font-size:10px}.featured-meta{font-size:8px}}
</style>
</head>
<body class="gb-page apps-page">
<div id="site-header"></div>
<main class="apps-main">
<section class="apps-top"><div><div class="apps-kicker"><i class="fa-solid fa-sparkles"></i> Laxman Nepal</div><h1 class="apps-title">Apps & Tools</h1><p class="apps-subtitle">Everything I've built, in one simple place.</p></div><div class="apps-count" id="app-count">Loading apps…</div></section>
<div class="apps-toolbar"><div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="app-search" class="apps-search" type="search" placeholder="Search apps…" autocomplete="off"></div><select id="sort-apps" class="sort-select" aria-label="Sort apps"><option value="name">Name A → Z</option><option value="updated">Recently updated</option><option value="stars">Most starred</option><option value="featured">Featured first</option></select></div>
<nav id="category-bar" class="category-bar" aria-label="App categories"></nav>
<section id="featured-section"><div class="section-label"><h2>Featured apps</h2><span>Popular projects</span></div><div id="featured-grid" class="featured-grid"></div></section>
<div class="section-label"><h2>All apps</h2><span id="results-label">Loading…</span></div>
<section id="apps-grid" class="apps-grid"><div class="empty" style="display:block">Loading apps…</div></section>
<p class="apps-footnote">New projects with a live homepage link are added automatically.</p>
</main>
<div id="site-footer"></div>
<script>
/* UNIVERSAL RULE: header, both navigation rows, and footer are copied from the repository homepage. */
async function loadUniversalShell(){try{const response=await fetch('/?universal-shell='+Date.now(),{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw new Error('Homepage unavailable');const doc=new DOMParser().parseFromString(await response.text(),'text/html');const header=doc.querySelector('header.gb-header');const footer=doc.querySelector('footer.gb-footer');if(!header||!footer)throw new Error('Homepage header/footer not found');document.getElementById('site-header').replaceChildren(document.importNode(header,true));document.getElementById('site-footer').replaceChildren(document.importNode(footer,true));const mobile=document.getElementById('gb-mobile');mobile?.addEventListener('click',()=>document.querySelector('.gb-menu')?.classList.toggle('open'));const year=document.getElementById('year');if(year)year.textContent=new Date().getFullYear()}catch(error){console.error(error);document.getElementById('site-header').innerHTML='<div style="padding:16px;text-align:center">Unable to load universal site navigation.</div>'}}
const icons=['fa-table-cells','fa-calendar-days','fa-wand-magic-sparkles','fa-link','fa-book-open','fa-chart-line','fa-robot','fa-globe','fa-code','fa-bolt','fa-image','fa-file-lines'];
const gradients=['linear-gradient(135deg,#ff6b6b,#feca57)','linear-gradient(135deg,#5f72bd,#9b23ea)','linear-gradient(135deg,#00c6ff,#0072ff)','linear-gradient(135deg,#11998e,#38ef7d)','linear-gradient(135deg,#f857a6,#ff5858)','linear-gradient(135deg,#f7971e,#ffd200)','linear-gradient(135deg,#7f00ff,#e100ff)','linear-gradient(135deg,#00b09b,#96c93d)','linear-gradient(135deg,#fc4a1a,#f7b733)','linear-gradient(135deg,#396afc,#2948ff)','linear-gradient(135deg,#ee0979,#ff6a00)','linear-gradient(135deg,#4776e6,#8e54e9)'];
const categoryRules={AI:['ai','artificial','gpt','voice','tts','chatbot','machine'],Finance:['nepse','finance','stock','money','currency','bank'],Developer:['code','developer','github','html','css','javascript','api','json'],Education:['education','book','learn','typing','school','study'],Creative:['photo','image','video','music','lofi','design','creative'],Productivity:['excel','office','pdf','link','calendar','tool','generator'],Utility:['utility','converter','calculator','patro','weather','password']};
let allApps=[],activeCategory='All',snapshotFailures=new Set();
function snapshotPath(repo){return '/assets/app-snapshots/'+slugify(repo)+'.webp'}
function slugify(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function fallbackSnapshot(url){return 'https://image.thum.io/get/width/1200/crop/900/noanimate/'+url}
function faviconUrl(url){try{return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(url).hostname)+'&sz=128'}catch{return ''}}
function getCategory(repo){const text=(repo.name+' '+(repo.description||'')+' '+(repo.topics||[]).join(' ')).toLowerCase();for(const [cat,words] of Object.entries(categoryRules))if(words.some(w=>text.includes(w)))return cat;return 'Other'}
function escapeHtml(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s)}
function formatDate(v){try{return new Intl.DateTimeFormat('en',{month:'short',day:'numeric'}).format(new Date(v))}catch{return ''}}
function repoScore(a){return Number(a.stars||0)}
function renderCategories(){const cats=['All',...Object.keys(categoryRules),'Other'];document.getElementById('category-bar').innerHTML=cats.map(c=>`<button type="button" class="category-btn ${activeCategory===c?'active':''}" data-category="${c}">${c}</button>`).join('');document.querySelectorAll('.category-btn').forEach(b=>b.addEventListener('click',()=>{activeCategory=b.dataset.category;renderCategories();renderAll() }))}
function matchesCategory(a){return activeCategory==='All'||a.category===activeCategory}
function getVisible(){const q=document.getElementById('app-search').value.trim().toLowerCase();let list=allApps.filter(a=>matchesCategory(a)&&(a.name.toLowerCase().includes(q)||a.url.toLowerCase().includes(q)||(a.description||'').toLowerCase().includes(q)||(a.category||'').toLowerCase().includes(q)));const sort=document.getElementById('sort-apps').value;if(sort==='updated')list.sort((a,b)=>new Date(b.updated)-new Date(a.updated));else if(sort==='stars')list.sort((a,b)=>repoScore(b)-repoScore(a));else if(sort==='featured')list.sort((a,b)=>Number(b.featured)-Number(a.featured)||a.name.localeCompare(b.name));else list.sort((a,b)=>a.name.localeCompare(b.name));return list}
function renderFeatured(){const grid=document.getElementById('featured-grid');const q=document.getElementById('app-search').value.trim();if(q||activeCategory!=='All'){document.getElementById('featured-section').style.display='none';return}document.getElementById('featured-section').style.display='block';const list=[...allApps].sort((a,b)=>Number(b.featured)-Number(a.featured)||repoScore(b)-repoScore(a)).slice(0,4);grid.innerHTML=list.map(a=>`<a class="featured-card" href="${escapeAttr(a.url)}" target="_blank" rel="noopener noreferrer"><img class="featured-logo" src="${escapeAttr(a.favicon)}" alt="" loading="lazy" onerror="this.src='https://icons.duckduckgo.com/ip3/${escapeAttr(new URL(a.url).hostname)}.ico';this.onerror=null"><span class="featured-copy"><span class="featured-name">${escapeHtml(a.name)}</span><span class="featured-meta"><span class="featured-status"><span class="status-dot ${snapshotFailures.has(a.repo)?'offline':''}"></span>${snapshotFailures.has(a.repo)?'Preview issue':'Live preview'}</span><span>•</span><span class="featured-star"><i class="fa-solid fa-star"></i> ${repoScore(a)}</span><span>•</span><span>${formatDate(a.updated)}</span></span></span></a>`).join('')}
function renderAll(){const grid=document.getElementById('apps-grid'),count=document.getElementById('app-count'),label=document.getElementById('results-label'),apps=getVisible();count.textContent=apps.length+' '+(apps.length===1?'app':'apps');label.textContent=apps.length+' shown';if(!apps.length){grid.innerHTML='<div class="empty" style="display:block">No apps found.</div>';return}grid.innerHTML=apps.map(a=>`<a class="app-card" href="${escapeAttr(a.url)}" target="_blank" rel="noopener noreferrer" style="--app-gradient:${a.gradient}"><div class="app-preview"><div class="preview-loading">Loading preview…</div><img class="app-snapshot" src="${escapeAttr(a.snapshot)}" data-fallback="${escapeAttr(fallbackSnapshot(a.url))}" alt="${escapeAttr(a.name)} homepage preview" loading="lazy" referrerpolicy="no-referrer"><span class="app-status" hidden></span></div><div class="app-info"><span class="app-icon"><i class="fa-solid ${a.icon}"></i><img src="${escapeAttr(a.favicon)}" alt="" loading="lazy" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()"></span><span class="app-name-wrap"><span class="app-name">${escapeHtml(a.name)}</span><span class="app-open">${escapeHtml(a.category)} <span class="app-status"><span class="status-dot"></span>Live</span> <i class="fa-solid fa-arrow-up-right-from-square"></i></span></span></div></a>`).join('');wireSnapshots()}
function wireSnapshots(){document.querySelectorAll('.app-snapshot').forEach(img=>{const loading=img.parentElement.querySelector('.preview-loading');img.addEventListener('load',()=>{loading.remove()},{once:true});img.addEventListener('error',()=>{if(img.dataset.triedFallback){loading.textContent='Preview unavailable';loading.style.animation='none';snapshotFailures.add(img.closest('.app-card')?.querySelector('.app-name')?.textContent||'');return}img.dataset.triedFallback='1';img.src=img.dataset.fallback},{once:true})})}
async function loadApps(){const grid=document.getElementById('apps-grid');try{const r=await fetch('https://api.github.com/users/LaxmanNepal/repos?per_page=100&sort=updated',{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub API failed');const repos=await r.json();allApps=repos.filter(x=>!x.fork&&!x.archived&&x.homepage&&/^https?:\/\//i.test(x.homepage)).map((x,i)=>({repo:x.name,name:x.name.replace(/[-_]+/g,' '),url:x.homepage.trim(),description:x.description||'',topics:x.topics||[],stars:x.stargazers_count||0,updated:x.updated_at||x.pushed_at,category:getCategory(x),icon:icons[i%icons.length],gradient:gradients[i%gradients.length],snapshot:snapshotPath(x.name),favicon:faviconUrl(x.homepage.trim()),featured:(x.stargazers_count||0)>0}));renderCategories();renderFeatured();renderAll()}catch(e){grid.innerHTML='<div class="empty" style="display:block">Apps could not be loaded right now.</div>';document.getElementById('app-count').textContent=''}}
document.getElementById('app-search').addEventListener('input',()=>{renderFeatured();renderAll()});document.getElementById('sort-apps').addEventListener('change',renderAll);loadUniversalShell();loadApps();
</script>
</body>
</html>
